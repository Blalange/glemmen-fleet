# Colibri: GLM-5.3-Flash (int4-g64, 321B) on CPU. The routed experts stream
# from a read-only FUSE mount of the Hugging Face repo at /model-hf, served by
# the hf-fuse sidecar below over plain HTTP Range requests (no Xet, no disk
# cache). The strict-local Longhorn volume stays attached at /model so the
# engine keeps its learned .coli_usage history and the warm local copy.
#
# Image: docker build -t hexahigh/colibri:1.11.0 . (in the Dockerfile repo);
# built for x86-64-v3 (AVX2), all nine colibri engines included.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: colibri
  labels:
    app.kubernetes.io/name: colibri
spec:
  replicas: 1
  # RWO volume + a pod that fills the node: never run two, and stop the old
  # one before starting the replacement instead of leaving it Pending.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: colibri
  template:
    metadata:
      labels:
        app.kubernetes.io/name: colibri
    spec:
      # Evicts lower-priority workloads from glemmen80 when the 185Gi pod
      # cannot fit; stays below longhorn-critical so storage is untouched.
      priorityClassName: colibri-critical
      # Hard pin: refuse to run on anything but glemmen80. The strict-local
      # volume is created on the same node and follows the pod.
      nodeSelector:
        kubernetes.io/hostname: glemmen80
      terminationGracePeriodSeconds: 60
      initContainers:
        # Native sidecar (restartPolicy: Always) that keeps a read-only FUSE
        # view of the Hub repo mounted at /mnt/model for the pod's lifetime.
        # It deliberately does NOT use hf-mount/hf-csi-driver: that stack
        # stalled fetching Xet ranges (0 bytes per fetch) on this cluster while
        # plain HTTP downloads worked. Here every cache miss is a Range GET
        # against the Hub's /resolve/ redirect (the xet-bridge CDN URL, over
        # HTTP/1.1) and nothing is written to disk.
        #
        # The mount is shared with the colibri container through the hf-model
        # emptyDir: this container mounts it Bidirectional (so the FUSE mount
        # propagates to the host), colibri mounts it HostToContainer.
        - name: hf-fuse
          image: python:3.13-slim
          restartPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends ca-certificates util-linux
              # t64 on trixie, plain libfuse2 on older Debian.
              apt-get install -y -qq --no-install-recommends libfuse2t64 || \
                apt-get install -y -qq --no-install-recommends libfuse2
              pip install --quiet --no-cache-dir --disable-pip-version-check \
                huggingface_hub==1.32.0 fsspec==2026.9.0 fusepy==3.0.1
              # A previous sidecar may have died leaving a dead FUSE mount in
              # the shared emptyDir; detach it so a fresh one can mount.
              if mountpoint -q "$HF_MOUNT"; then umount -l "$HF_MOUNT" || true; fi
              exec python3 /srv/hf-fuse.py
          env:
            - name: HF_REPO
              value: Justvugg/GLM-5.3-Flash-colibri-int4-g64
            - name: HF_REVISION
              value: main
            - name: HF_MOUNT
              value: /mnt/model
            # Per-file window: 4 MiB blocks, four fetched ahead by eight
            # concurrent range GETs. Raise HF_MAX_INFLIGHT / HF_PREFETCH_BLOCKS
            # if the link still is not saturated; lower them if the sidecar
            # hits its memory limit (window + cache per open shard).
            - name: HF_BLOCK_SIZE
              value: "4194304"
            - name: HF_PREFETCH_BLOCKS
              value: "4"
            - name: HF_MAX_INFLIGHT
              value: "12"
            - name: HF_UID
              value: "1000"
            - name: HF_GID
              value: "1000"
            # Default is 10s, which is tight for a 4 MiB block on a shared
            # 1 Gbit/s link.
            - name: HF_HUB_DOWNLOAD_TIMEOUT
              value: "60"
          securityContext:
            # FUSE mount + Bidirectional mount propagation require it.
            privileged: true
          volumeMounts:
            - name: model-hf
              mountPath: /mnt
              mountPropagation: Bidirectional
            - name: hf-fuse-script
              mountPath: /srv
              readOnly: true
          startupProbe:
            # Written by the FUSE daemon once the mount is ready.
            exec:
              command: ["test", "-f", "/mnt/model/.fuse_ready"]
            # apt-get + pip at container start: allow up to 5 minutes.
            periodSeconds: 2
            failureThreshold: 150
          resources:
            requests:
              cpu: 50m
              # Keep the pod's scheduling request as close to colibri's 185Gi
              # as possible; the 2Gi limit still covers the buffers.
              memory: 64Mi
            limits:
              # Readahead buffers (8 MiB per open shard) plus Python/httpx.
              memory: 2Gi
        # Downloads the checkpoint into the Longhorn volume the first time the
        # pod runs (195 GB, ~30-60 min at 1 Gbit/s) and resumes it after an
        # interruption. `hf download` is incremental, and the sentinel makes
        # later starts skip the check entirely.
        - name: model-download
          image: python:3.13-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              if [ -f /model/.download-complete ]; then
                echo "model already present; skipping download"
                exit 0
              fi
              pip install --quiet --no-cache-dir huggingface_hub==1.32.0
              # glemmen80 also runs the k3s control plane on the same HDD.
              # Idle IO class + low CPU priority + fewer parallel shards keep
              # etcd/kubelet responsive; the download still gets all the disk
              # and CPU whenever they are idle.
              nice -n 19 ionice -c 3 hf download Justvugg/GLM-5.3-Flash-colibri-int4-g64 \
                --local-dir /model --max-workers 2
              touch /model/.download-complete
              # the colibri image runs as uid 1000 and writes .coli_usage here
              chown -R 1000:1000 /model
              echo "download complete"
          resources:
            requests:
              cpu: 2
              memory: 2Gi
            limits:
              # CPU-limited: this node's etcd and kubelet need cycles more
              # than the download does.
              cpu: "2"
              memory: 8Gi
          volumeMounts:
            - name: model
              mountPath: /model
      containers:
        - name: colibri
          image: hexahigh/colibri:1.12.0-1
          imagePullPolicy: IfNotPresent
          # Same reasoning as the init container: this node is also the k3s
          # control plane, and the engine streams ~4.8 GB per token from the
          # HDD etcd lives on. Low priority keeps the API responsive; the
          # engine still gets every idle cycle of CPU and disk.
          command:
            - nice
            - -n
            - "19"
            - ionice
            - -c
            - "3"
            - python3
            - /app/coli
          # The image's default CMD is `web` on 127.0.0.1; serve instead.
          # --allowed-host '*' is the documented opt-out of the DNS-rebinding
          # guard for a 0.0.0.0 bind: the client's Host header (ClusterIP or
          # service DNS) is not predictable inside the container.
          args:
            - web
            # Weights come from the hf-fuse mount (the FUSE mount lives in a
            # subdirectory of the shared emptyDir), not the Longhorn volume.
            - --model
            - /model
            - --host
            - 0.0.0.0
            - --allowed-host
            - "*"
            - --no-browser
            # 180 GB budget inside the 185Gi cgroup: ~168Gi of expert cache,
            # the rest headroom for page cache and the runtime.
            - --ram
            - "172"
          env:
            # The bind is 0.0.0.0 with no API key, allowed because the
            # Service is ClusterIP: only pods in this cluster can reach it.
            - name: COLI_ALLOW_INSECURE_BIND
              value: "1"
            - name: PIN
              value: "auto"
            - name: PIN_GB
              value: "172"
            - name: RAM_GB
              value: "172"
            - name: CTX
              value: "409600"
            - name: PREFETCH
              value: "1"
            # PIN/PIN_GB seed the hot store from the .coli_usage history. With
            # --model pointed at the read-only HF mount the engine would look
            # for it there, so point it at the copy on the Longhorn volume,
            # which is also where the updated history is written back.
            - name: COLI_USAGE
              value: /model/.coli_usage
          envFrom:
            - secretRef:
                name: colibri-secrets
          ports:
            - name: http
              containerPort: 8000
          resources:
            # Keep a few Gi for the host: glemmen80 reports 188.6Gi total
            # (firmware reserves part of the nominal 192Gi) and also runs
            # k3s/etcd/containerd/Longhorn. If this stays Pending with
            # "Insufficient memory", allocatable is below the request and
            # preemption cannot help past allocatable -- lower it.
            requests:
              cpu: "6"
              memory: 185Gi
            limits:
              # No CPU limit: throttling the engine is pure lost throughput.
              memory: 185Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            # The engine loads the dense weights before answering: give it
            # up to 30 minutes instead of restart-looping a cold start.
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: model
              mountPath: /model
            - name: model-hf
              mountPath: /model-hf
              # See the mount in the hf-fuse sidecar: the FUSE mount is
              # established on the host under this emptyDir and propagates in.
              mountPropagation: HostToContainer
      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: colibri-model
        # Carries the FUSE mount from the hf-fuse sidecar to the colibri
        # container. No model bytes are stored here; the emptyDir only holds
        # the mount point.
        - name: model-hf
          emptyDir: {}
        - name: hf-fuse-script
          configMap:
            name: hf-fuse-script
