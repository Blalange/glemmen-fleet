# Traefik Kubernetes ingress controller, replacing the K3s-bundled Traefik.
#
# Serves HTTPS for all ingress hosts; the cert-manager wildcard certificates are
# loaded into the default TLS store and selected per SNI, with the blatrix one
# as fallback certificate (same behaviour as the old cluster).
#
# The Service is a LoadBalancer served by MetalLB at 192.168.6.99 (the IP the
# UniFi router forwards 80/443 to).
#
# Run Traefik as a DaemonSet on every ECMP-capable node (all 1xx nodes plus
# glemmen80). MetalLB may move the VIP to any of those nodes, and
# externalTrafficPolicy: Local requires a Traefik pod on the node that owns the
# VIP. A Deployment with a few replicas would blackhole traffic whenever the
# VIP landed on a node without one.
deployment:
  kind: DaemonSet
  replicas: 1
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: glem.men/ecmp-node
              operator: In
              values: ["true"]
podDisruptionBudget:
  enabled: true
  minAvailable: 1

ports:
  web:
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    asDefault: true
    http:
      tls:
        enabled: true

tlsStore:
  default:
    defaultCertificate:
      secretName: glem-blatrix-eu-wildcard-tls
    certificates:
      - secretName: glem-blatrix-eu-wildcard-tls
      - secretName: shrail-eu-org-wildcard-tls
      - secretName: thisisaveryshortdomain-asso-eu-org-wildcard-tls
      - secretName: glem-men-wildcard-tls

service:
  # Every ECMP-capable node runs a Traefik pod, so Local is safe and preserves
  # the real client source address instead of SNATing it to a node IP.
  spec:
    externalTrafficPolicy: Local
  annotations:
    # The IP the UniFi router forwards 80/443 (and future ports) to.
    metallb.io/loadBalancerIPs: 192.168.6.99
    # Allow the NetBird relay's UDP 3478 Service to share this VIP.
    metallb.io/allow-shared-ip: glemmen-vip
