# SeaweedFS cluster and its S3 bucket/credentials. Separate from the
# infrastructure Kustomization so the operator's CRDs exist before these custom
# resources are applied.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: seaweedfs
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  path: ./flux/infrastructure/seaweedfs
  prune: true
  dependsOn:
    - name: infrastructure
  healthChecks:
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: Seaweed
      name: seaweedfs
      namespace: seaweedfs
    # The media PVC uses this driver's StorageClass; do not let the media
    # Kustomization start before the controller and node plugins are ready.
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: SeaweedCSIDriver
      name: seaweedfs
      namespace: seaweedfs
    # The extra hostPath-backed volume server on glemmen60 is managed by the
    # official SeaweedFS chart, not by the operator.
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: seaweedfs-glemmen60
      namespace: seaweedfs
  sourceRef:
    kind: GitRepository
    name: flux-system
