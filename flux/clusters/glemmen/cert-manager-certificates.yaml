# Wildcard certificates. They live in kube-system like before so Traefik can
# load the resulting secrets into its default TLS store.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-certificates
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  path: ./cert-manager/certificates
  prune: true
  targetNamespace: kube-system
  dependsOn:
    - name: cert-manager-issuers
  sourceRef:
    kind: GitRepository
    name: flux-system
