# Prometheus alert rules.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-alerts
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  path: ./kube-prometheus-stack/alerts
  prune: true
  targetNamespace: monitoring
  dependsOn:
    - name: monitoring
  sourceRef:
    kind: GitRepository
    name: flux-system
