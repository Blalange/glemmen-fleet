# Grafana's static Longhorn volume/PVC (volume restored from backup) and the
# monitoring StorageClass.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-pvc
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  path: ./kube-prometheus-stack/pvc
  prune: true
  targetNamespace: monitoring
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
