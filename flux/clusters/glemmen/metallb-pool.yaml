# MetalLB address pool + L2 advertisement. Separate from the infrastructure
# group because the IPAddressPool CRD is installed by the MetalLB chart itself.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb-pool
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  path: ./flux/infrastructure/metallb/resources
  prune: true
  targetNamespace: metallb-system
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
