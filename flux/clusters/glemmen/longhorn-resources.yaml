# Longhorn recurring backup and trim jobs. Separate from the infrastructure
# group because Longhorn installs its CRDs in that group.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-resources
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  path: ./flux/infrastructure/longhorn/resources
  prune: true
  targetNamespace: longhorn-system
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
