# The applications. The actual Kustomization objects live in flux/apps/.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  path: ./flux/apps
  prune: true
  wait: false
  dependsOn:
    - name: infrastructure
    - name: monitoring
    - name: ingress
  sourceRef:
    kind: GitRepository
    name: flux-system
