# tuppr upgrade plans (Talos + Kubernetes versions). Separate from the
# infrastructure group because the tuppr CRDs are installed by its HelmRelease.
#
# The plans are pinned to the versions the cluster already runs; bump them to
# trigger a health-gated rollout (only one upgrade runs at a time).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tuppr-config
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  path: ./flux/infrastructure/tuppr/resources
  prune: true
  targetNamespace: system-upgrade
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
