# ServiceMonitors for components outside the monitoring namespace, applied after
# kube-prometheus-stack (and its CRDs) is ready.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-servicemonitors
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  path: ./flux/monitoring-servicemonitors
  prune: true
  targetNamespace: cert-manager
  dependsOn:
    - name: monitoring
  sourceRef:
    kind: GitRepository
    name: flux-system
