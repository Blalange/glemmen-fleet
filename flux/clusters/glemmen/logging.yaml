# Loki and the Alloy log collector. Separate from `monitoring` so a log
# pipeline failure does not block the core monitoring health check.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: logging
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 30m
  path: ./flux/logging
  prune: true
  wait: true
  targetNamespace: monitoring
  dependsOn:
    - name: monitoring
    - name: seaweedfs
  sourceRef:
    kind: GitRepository
    name: flux-system
