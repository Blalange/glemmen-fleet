# Monitoring stack (kube-prometheus-stack, smartctl-exporter, unpoller).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 20m
  path: ./flux/monitoring
  prune: true
  wait: true
  targetNamespace: monitoring
  dependsOn:
    - name: monitoring-pvc
  sourceRef:
    kind: GitRepository
    name: flux-system
