# Monitoring stack (kube-prometheus-stack, Thanos, smartctl-exporter, idrac-exporter, unpoller).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  # Grafana runs its schema migrations on the first rollout after switching
  # from SQLite, and this rollout also starts the second Prometheus and
  # Alertmanager replicas.
  timeout: 45m
  path: ./flux/monitoring
  prune: true
  wait: true
  targetNamespace: monitoring
  dependsOn:
    - name: infrastructure
    - name: seaweedfs
  sourceRef:
    kind: GitRepository
    name: flux-system
