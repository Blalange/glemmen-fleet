# cert-manager ClusterIssuers and wildcard Certificates. Separate from the
# infrastructure group because the cert-manager CRDs are installed by that
# group's HelmRelease.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: certificates
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  path: ./flux/infrastructure/cert-manager/resources
  prune: true
  # Traefik runs in kube-system and reads the wildcard secrets from its own
  # namespace, so cert-manager must create them there. Applying these
  # Certificates to cert-manager left Traefik serving manually copied,
  # never-renewed secrets (the glem.men copy expired 2026-12-13).
  targetNamespace: kube-system
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
