# cert-manager ClusterIssuers and wildcard Certificates. Separate from the
# infrastructure group because the cert-manager CRDs are installed by that
# group's HelmRelease.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: certificates
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  path: ./flux/infrastructure/cert-manager/resources
  prune: true
  targetNamespace: cert-manager
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
