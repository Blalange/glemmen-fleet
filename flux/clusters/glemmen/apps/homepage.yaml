# Homepage dashboard (Helm release under flux/apps/homepage).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homepage
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  path: ./flux/apps/homepage
  prune: true
  wait: true
  targetNamespace: homepage
  dependsOn:
    - name: monitoring
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
