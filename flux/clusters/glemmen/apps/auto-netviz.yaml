apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: auto-netviz
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  path: ./flux/apps/auto-netviz
  prune: true
  wait: true
  targetNamespace: auto-netviz
  dependsOn:
    - name: infrastructure
    - name: rook-ceph
  sourceRef:
    kind: GitRepository
    name: flux-system
