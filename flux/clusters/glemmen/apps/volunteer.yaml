# Volunteer network services: Tor Snowflake, Syncthing relay, Tor WebTunnel
# bridge and a Tor guard/middle relay.
#
# The WebTunnel path is generated once into this Secret on the cluster:
#
#   kubectl -n flux-system create secret generic volunteer-secrets \
#     --from-literal=WEBTUNNEL_PATH="$(openssl rand -hex 12)"
#
# Flux substitutes it into the Ingress and Deployment via postBuild below.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: volunteer
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  path: ./flux/apps/volunteer
  prune: true
  wait: true
  targetNamespace: volunteer
  dependsOn:
    - name: infrastructure
  postBuild:
    substituteFrom:
      - kind: Secret
        name: volunteer-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
