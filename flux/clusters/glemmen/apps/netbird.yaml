# NetBird reverse proxy for private services under *.proxy.glem.men, plus the
# external relay at nb-relay.glem.men.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: netbird
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  path: ./flux/apps/netbird
  prune: true
  wait: true
  targetNamespace: netbird
  dependsOn:
    - name: infrastructure
    - name: certificates
    - name: ingress
  sourceRef:
    kind: GitRepository
    name: flux-system
