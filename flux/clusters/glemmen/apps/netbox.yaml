# NetBox, PostgreSQL, Valkey and the Git inventory sync CronJob.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: netbox
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  # NetBox runs database migrations during the first rollout.
  timeout: 15m
  path: ./flux/apps/netbox
  prune: true
  wait: true
  targetNamespace: netbox
  dependsOn:
    - name: netbox-inventory
    - name: infrastructure
    # The chart creates a ServiceMonitor for NetBox.
    - name: monitoring
  sourceRef:
    kind: GitRepository
    name: flux-system
