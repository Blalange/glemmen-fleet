# NetBox, Valkey and the Git inventory sync CronJob. NetBox uses the shared
# in-cluster PostgreSQL instance.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: netbox
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  # The first rollout creates the whole NetBox schema.
  timeout: 20m
  path: ./flux/apps/netbox
  prune: true
  wait: true
  targetNamespace: netbox
  dependsOn:
    - name: infrastructure
    # The chart creates a ServiceMonitor for NetBox.
    - name: monitoring
  sourceRef:
    kind: GitRepository
    name: flux-system
