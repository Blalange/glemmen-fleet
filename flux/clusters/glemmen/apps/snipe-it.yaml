# Snipe-IT + MariaDB, Longhorn volumes.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: snipe-it
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  path: ./flux/apps/snipe-it
  prune: true
  wait: true
  targetNamespace: snipe-it
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
