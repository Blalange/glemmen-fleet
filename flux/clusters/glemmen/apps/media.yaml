# Media stack: Jellyfin, Sonarr, Radarr, Prowlarr, Seerr and qBittorrent.
# Waits for the SeaweedFS CSI driver/StorageClass and the shared media PVC.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: media
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  # The first *arr FluentMigrator run against YSQL can take tens of minutes
  # because every DDL statement is slow. Startup probes already prevent the
  # pods from being killed; give Flux enough time to see them become ready.
  timeout: 45m
  path: ./flux/apps/media
  prune: true
  wait: tr