# NetBox inventory ConfigMaps: manual/generated YAML and device images. Kept
# separate from the NetBox app so the inventory can live at the repository
# root without Kustomize cross-root file access. The sync code ships in the
# netbox-inventory-toolkit image instead of a ConfigMap.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: netbox-inventory
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  path: ./inventory
  prune: true
  wait: true
  targetNamespace: netbox
  sourceRef:
    kind: GitRepository
    name: flux-system
