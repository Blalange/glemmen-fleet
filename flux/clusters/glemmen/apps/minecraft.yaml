# All Minecraft servers. The parent Kustomization applies every server
# subdirectory; currently that is Minecraft Radar (radar.mc.glem.men).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: minecraft
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  # First start downloads the Bedrock server and creates the world.
  timeout: 15m
  path: ./flux/apps/minecraft
  prune: true
  wait: true
  targetNamespace: minecraft
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
