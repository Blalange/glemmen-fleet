# Application Kustomizations. Most point at flux/apps/; netbox-inventory
# points at the repository-root inventory directory.
# Helpers for suspending/resuming everything: scripts/flux/manage.py.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - energisjappa.yaml
  - frigate.yaml
  - homepage.yaml
  - netbird.yaml
  - netbox-inventory.yaml
  - netbox.yaml
  - panel.yaml
  - snipe-it.yaml
  - unifi.yaml
  - volunteer.yaml
  - warrior.yaml
  - webodm.yaml
