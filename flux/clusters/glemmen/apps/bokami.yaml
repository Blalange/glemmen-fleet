# Bokami book reader. Waits for the Rook Ceph storage classes (nvme-rbd for
# app state and fast-fs CephFS for the book library).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bokami
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  path: ./flux/apps/bokami
  prune: true
  wait: true
  targetNamespace: bokami
  dependsOn:
    - name: infrastructure
    - name: rook-ceph
  sourceRef:
    kind: GitRepository
    name: flux-system
