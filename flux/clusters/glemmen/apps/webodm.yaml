# WebODM + ClusterODM + NodeODM (drone photogrammetry).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: webodm
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  path: ./flux/apps/webodm
  prune: true
  wait: true
  targetNamespace: webodm
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
