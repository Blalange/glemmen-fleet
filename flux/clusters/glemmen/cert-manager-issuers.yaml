# cert-manager ClusterIssuers (need the chart and the Cloudflare token secrets).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-issuers
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  path: ./cert-manager/issuers
  prune: true
  targetNamespace: cert-manager
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
