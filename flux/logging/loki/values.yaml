# Loki runs as a single binary (Monolithic) with one replica. Chunks and the
# TSDB index live in the `loki` bucket in SeaweedFS; the local volume keeps
# the WAL and query caches.
deploymentMode: Monolithic

loki:
  # Single-tenant cluster: Alloy and Grafana do not send an X-Scope-OrgID
  # header. Enabling multi-tenancy later would require setting that header on
  # both the write path and the datasource.
  auth_enabled: false

  commonConfig:
    # One Loki instance, one ring member.
    replication_factor: 1

  schemaConfig:
    configs:
      - from: 2024-04-01
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: s3
    bucketNames:
      chunks: loki
      ruler: loki
    s3:
      endpoint: seaweedfs-s3.seaweedfs.svc.cluster.local:8333
      region: us-east-1
      s3ForcePathStyle: true
      insecure: true
      accessKeyId: ${LOKI_S3_ACCESS_KEY}
      secretAccessKey: ${LOKI_S3_SECRET_KEY}

  limits_config:
    retention_period: 30d

  compactor:
    retention_enabled: true
    delete_request_store: s3

# The SimpleScalable targets are disabled; the single binary runs all Loki
# components. The chart's validation still reads their replicas, so zero them.
write:
  enabled: false
  replicas: 0

read:
  enabled: false
  replicas: 0

backend:
  enabled: false
  replicas: 0

singleBinary:
  replicas: 1
  # The rules sidecar is only needed for Loki ruler rules; the Prometheus
  # alert rules live in monitoring/resources/alerts.
  sidecar: false
  # The single binary runs all Loki components. The chart adds
  # -config.expand-env=true, so the S3 credentials are expanded from the
  # `loki-s3` Secret at runtime.
  extraEnvFrom:
    - secretRef:
        name: loki-s3
  persistence:
    enabled: true
    size: 20Gi
    storageClass: monitoring
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi
  # A one-replica workload cannot make progress during a voluntary drain if a
  # PDB demands one available pod.
  podDisruptionBudget:
    enabled: false

gateway:
  replicas: 1
  # Alloy ships every pod log line to Loki; do not also log every successful
  # push/query request from the gateway.
  verboseLogging: false
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  podDisruptionBudget:
    enabled: false

# Keep the caches small; the object store is local and fast.
chunksCache:
  allocatedMemory: 2048

resultsCache:
  allocatedMemory: 512

# A single canary Deployment is enough to test the write/read path.
lokiCanary:
  kind: Deployment
  podDisruptionBudget:
    enabled: false
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

monitoring:
  serviceMonitor:
    enabled: true
    interval: 30s
    labels:
      release: kube-prometheus-stack
  dashboards:
    enabled: true
    annotations:
      grafana_folder: Loki
    labels:
      grafana_dashboard: "1"
    # The upstream dashboard hard-codes the Loki mixin demo values
    # (app_instance and namespace = prod) and parses logfmt, so it is empty in
    # this cluster. The local replacement lives in
    # flux/monitoring/resources/dashboards/loki/ and uses the Alloy stream
    # labels and the provisioned Loki/Thanos data sources.
    loki-logs:
      enabled: false
  rules:
    enabled: true
    labels:
      release: kube-prometheus-stack
