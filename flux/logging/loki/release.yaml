# Grafana Loki (SimpleScalable) for cluster log storage.
#
# Loki writes chunks and the TSDB index to the `loki` bucket in SeaweedFS
# (../../infrastructure/seaweedfs). The S3 key pair is not in Git; create the
# `loki-s3` Secret in monitoring before reconciling this release; see
# ../../README.md.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana-community
spec:
  interval: 1h
  url: https://grafana-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  interval: 1h
  timeout: 15m
  # The chart ships ServiceMonitors, PrometheusRules and Grafana dashboard
  # ConfigMaps, so the kube-prometheus-stack CRDs must exist first.
  dependsOn:
    - name: kube-prometheus-stack
  chart:
    spec:
      chart: loki
      version: 21.2.2
      sourceRef:
        kind: HelmRepository
        name: grafana-community
  valuesFrom:
    - kind: ConfigMap
      name: loki-values
      valuesKey: values.yaml
