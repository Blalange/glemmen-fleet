# Grafana Alloy as a per-node log collector. It reads pod logs through the
# Kubernetes API (no hostPath mount) and pushes them to the Loki gateway.
# The chart's Grafana Agent CRDs are not used by this configuration.
crds:
  create: false

controller:
  # Run on control-plane nodes as well if they are tainted.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

alloy:
  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  # Talos writes its service and kernel logs under /var/log, and the
  # kube-apiserver audit log under /var/log/audit/kube. The Alloy container
  # runs as root, which is required for the 0600 audit files.
  mounts:
    varlog: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  configMap:
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        // Each Alloy pod only collects the pods scheduled on its own node.
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          regex         = sys.env("NODE_NAME")
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
        rule {
          target_label = "cluster"
          replacement  = "glemmen"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.local.receiver]
      }

      // Talos host logs and the kube-apiserver audit log are written to the
      // host filesystem. Talos has no journald; its service logs (machined,
      // apid, etcd, kubelet, containerd, kernel, ...) are /var/log/*.log.
      local.file_match "host" {
        path_targets = [
          {
            __path__ = "/var/log/*.log",
            job      = "talos-host",
            log_type = "talos",
            node     = sys.env("NODE_NAME"),
            cluster  = "glemmen",
          },
          {
            __path__ = "/var/log/audit/kube/kube-apiserver.log",
            job      = "kube-apiserver-audit",
            log_type = "audit",
            node     = sys.env("NODE_NAME"),
            cluster  = "glemmen",
          },
        ]
      }

      loki.source.file "host" {
        targets       = local.file_match.host.targets
        forward_to    = [loki.write.local.receiver]
        // Skip the historical contents of the current files; only new host
        // and audit lines are ingested.
        tail_from_end = true
      }

      loki.write "local" {
        endpoint {
          url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
        }
      }

# Scrape Alloy's own metrics through the operator.
serviceMonitor:
  enabled: true
  interval: 30s
  additionalLabels:
    release: kube-prometheus-stack
