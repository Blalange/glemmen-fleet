# SeaweedFS CSI driver, managed by the operator.
#
# The driver exposes the SeaweedFS filer as ordinary Kubernetes volumes over
# FUSE, including ReadWriteMany. The media stack uses it for the shared
# /data volume that Jellyfin, the *arr apps and qBittorrent all mount.
#
# The driver name is node-global. Keep it distinct from the Longhorn driver and
# from the `seaweedfs` StorageClass that Longhorn uses for the SeaweedFS data
# volumes. `seaweedfs-media` is the class for application volumes.
apiVersion: seaweed.seaweedfs.com/v1
kind: SeaweedCSIDriver
metadata:
  name: seaweedfs
  namespace: seaweedfs
spec:
  seaweedRef:
    name: seaweedfs
  driverName: seaweedfs-csi-driver
  controller:
    replicas: 1
  storageClass:
    name: seaweedfs-media
    reclaimPolicy: Retain
    volumeBindingMode: Immediate
    allowVolumeExpansion: true
    # StorageClass parameters are immutable. The operator updates the existing
    # class in place and does not recreate it, so changing a value here leaves
    # the SeaweedCSIDriver in ReconcileFailed ("parameters: ... field is
    # immutable") until the class is deleted once:
    #
    #   kubectl delete storageclass seaweedfs-media
    #
    # The operator recreates it from this spec on its next reconcile (~30s).
    # Existing PVs/PVCs are unaffected; parameters only apply to new volumes,
    # so an already-provisioned volume keeps its original replication.
    parameters:
      replication: "001"
      # All media consumers run as uid/gid 1000 (LinuxServer PUID/PGID and the
      # Jellyfin image). Map every file in the mount to that identity. The
      # driver passes these to `weed mount -map.uid/-map.gid`, which expect
      # `localId:filerId` pairs; a bare id makes weed panic.
      uidMap: "1000:1000"
      gidMap: "1000:1000"
