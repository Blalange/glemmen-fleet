# SeaweedFS cluster managed by seaweedfs-operator.
#
# The volume servers hold both the Thanos bucket and the media library. They are
# deliberately spread across four nodes, with two 100Gi Longhorn volumes per
# server (`volumeServerDiskCount: 2`). Longhorn keeps two replicas of each data
# volume. The data PVCs are excluded from the Longhorn daily-backup job (see
# storageLabels below) because the media library is re-downloadable. The 2Gi
# master PVC stays in the backup job.
#
# Growing the cluster is a two-part operation: change `volume.replicas`,
# `volume.requests.storage` or `volumeServerDiskCount` here, then recreate the
# volume StatefulSet with
# `kubectl -n seaweedfs delete statefulset seaweedfs-volume --cascade=orphan`
# and delete the remaining volume pods so the new volumeClaimTemplates are
# applied. Existing PVCs are retained. See flux/apps/media/README.md.
apiVersion: seaweed.seaweedfs.com/v1
kind: Seaweed
metadata:
  name: seaweedfs
spec:
  image: chrislusf/seaweedfs:4.51

  # weed admin rejects admin-plane gRPC calls from remote pods unless
  # jwt.filer_signing.key is configured (or the caller uses mTLS). The admin
  # server and workers run in separate pods, so render the key to authenticate
  # worker connections. This also makes the filer require signed HTTP writes
  # and IAM gRPC calls; the S3 gateway and operator sign their own requests,
  # and the CSI/media path uses the filer's gRPC API.
  securityConfig:
    jwtSigning:
      filerWrite: true

  master:
    replicas: 1
    # Prometheus metrics on :9327. The operator creates the matching
    # ServiceMonitors for this and the other components.
    metricsPort: 9327
    volumeSizeLimitMB: 1024
    persistence:
      enabled: true
      existingClaim: seaweedfs-master
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  volume:
    replicas: 4
    metricsPort: 9327
    storageClassName: seaweedfs
    requests:
      storage: 100Gi
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 1Gi
    # Longhorn puts volumes without a recurring-job selector into the `default`
    # group, which the daily-backup job includes. Marking the generated PVCs as
    # the recurring-job source and placing them only in `daily-trim` keeps the
    # filesystem trim but excludes them from backups. The existing PVCs need
    # the same labels applied by hand once (see flux/apps/media/README.md).
    storageLabels:
      recurring-job.longhorn.io/source: enabled
      recurring-job-group.longhorn.io/daily-trim: enabled
    # Four volume servers should never share a node. With eight nodes there is
    # room to reschedule one if its node is drained or fails.
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: seaweedfs
                app.kubernetes.io/component: volume
                app.kubernetes.io/instance: seaweedfs
            topologyKey: kubernetes.io/hostname
  filer:
    replicas: 2
    metricsPort: 9327
    # Filer metadata lives in the existing three-node YugabyteDB cluster, not
    # on a local leveldb/PVC. The Secret is hand-created (not in Git) because it
    # contains the YSQL password; see flux/README.md.
    configSecret:
      name: seaweedfs-filer-config
      key: filer.toml
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Standalone S3 gateway. It exposes SeaweedFS as an S3 endpoint on
  # seaweedfs-s3.seaweedfs.svc.cluster.local:8333.
  s3:
    replicas: 2
    metricsPort: 9327
    iam: true
    service:
      type: ClusterIP
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Web admin panel for cluster topology, volume/file management and
  # maintenance jobs. It also dispatches work to the worker Deployment below.
  # weed admin stays on loopback when it has no password, so the credentials
  # Secret is required for the Service and Ingress to be reachable. The Secret
  # is created by hand because it contains the password (see flux/README.md);
  # updating it requires a restart of the admin pod.
  admin:
    metricsPort: 9327
    credentialsSecret:
      name: seaweedfs-admin
    ingress:
      enabled: true
      className: traefik
      host: seaweedfs.glem.men
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Workers execute maintenance and background jobs dispatched by the admin
  # server (volume balance/vacuum, replication repair, ...). They keep no
  # durable state: the admin re-dispatches interrupted jobs after a restart,
  # and the persistence block only provides the scratch working directory.
  worker:
    replicas: 2
    metricsPort: 9327
    jobType: all
    maxExecute: 4
    persistence:
      enabled: true
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  volumeServerDiskCount: 4
