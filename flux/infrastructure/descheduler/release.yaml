# Descheduler from the upstream Kubernetes SIG Scheduling chart.
#
# Pinned to 0.37.0, which matches Kubernetes 1.37 (the cluster's minor version).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: descheduler
spec:
  interval: 1h
  url: https://kubernetes-sigs.github.io/descheduler/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: descheduler
      version: 0.37.0
      sourceRef:
        kind: HelmRepository
        name: descheduler
  valuesFrom:
    - kind: ConfigMap
      name: descheduler-values
      valuesKey: values.yaml
