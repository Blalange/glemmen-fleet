# MetalLB in L2 mode: advertises LoadBalancer service IPs from the pool with
# gratuitous ARP, replacing the old keepalived VRRP setup.
#
# Pool: 192.168.6.96-192.168.6.97 plus 192.168.6.99. 192.168.6.98 is the
# Talos API VIP and is deliberately excluded. autoAssign is off, so every
# service that wants an external IP must ask for one explicitly (annotation
# metallb.io/loadBalancerIPs).
#
# Only the ECMP-capable server NICs (1xx eno8303 / glemmen80 enp4s0f0) may
# announce the VIP. The speakers are restricted to the same nodes; MetalLB's
# FRR/BGP backend is disabled because this cluster only uses L2.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: metallb
spec:
  interval: 1h
  url: https://metallb.github.io/metallb
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: metallb
      version: 0.16.2
      sourceRef:
        kind: HelmRepository
        name: metallb
  values:
    # L2 only: do not install the idle frr-k8s BGP backend.
    frrk8s:
      enabled: false
    controller:
      # glemmen50 cannot currently reach the API service from its pod network;
      # keep the controller on an ECMP-capable node.
      nodeSelector:
        glem.men/ecmp-node: "true"
    speaker:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: glem.men/ecmp-node
                    operator: In
                    values: ["true"]
    prometheus:
      serviceMonitor:
        enabled: true
      namespace: monitoring
      serviceAccount: kube-prometheus-stack-prometheus
      prometheusRule:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack
        # BGP is disabled, so the chart's BGP-session alert would have no
        # series and only add noise.
        bgpSessionDown:
          enabled: false
