# Address pool and L2 advertisements for the internal network.
#
# 192.168.6.99 is the address the UniFi router forwards port 80/443 to.
# 192.168.6.98 is reserved for the Talos Layer2 API VIP and must never be in
# this pool. autoAssign is off, so every service must request an address with
# the metallb.io/loadBalancerIPs annotation.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: internal
spec:
  addresses:
    - 192.168.6.96-192.168.6.97
    - 192.168.6.99-192.168.6.99
  autoAssign: false
---
# Only the server-VLAN interface on the server nodes may announce the VIP.
# The 1xx nodes carry the server VLAN on bond0 (LACP); glemmen80 uses its
# single 10G enp4s0f0 link. This keeps .99 off the legacy VLAN 1 PXE
# interface.
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: internal-1xx
spec:
  ipAddressPools:
    - internal
  nodeSelectors:
    - matchExpressions:
        - key: glem.men/1xx
          operator: In
          values: ["true"]
  interfaces:
    - bond0
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: internal-g80
spec:
  ipAddressPools:
    - internal
  nodeSelectors:
    - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values: ["glemmen80"]
  interfaces:
    - enp4s0f0
