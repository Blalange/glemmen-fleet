# The rclone S3 gateway (rclone/) is NOT part of this Kustomization: it is
# applied by the separate `longhorn-backup` Flux Kustomization so a missing
# hand-created Secret cannot block the infrastructure group. See
# ../../clusters/glemmen/longhorn-backup.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: longhorn-system
resources:
  - release.yaml
configMapGenerator:
  - name: longhorn-values
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true
