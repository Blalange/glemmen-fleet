# Longhorn distributed block storage
#
# Talos specifics:
# - the data paths are NOT the default /var/lib/longhorn: each node exposes a
#   directory user volume on the system disk (/var/mnt/longhorn-system) and a
#   btrfs user volume on the data disk (/var/mnt/longhorn, and /var/mnt/hdd1 on
#   glemmen130/glemmen80/glemmen60). The disk configuration itself comes from
#   the node label/annotation set in the Talos machine config, see
#   ../talos/nodes/*.yaml (node.longhorn.io/create-default-disk + default-disks-config).
# - for that mechanism to be picked up, createDefaultDiskLabeledNodes must be on.

defaultSettings:
  createDefaultDiskLabeledNodes: true
  defaultDataPath: /var/mnt/longhorn-system
  # Annotation-created disks with storageReserved: 0 would otherwise get the
  # default 30% reservation; the system disk has an explicit reservation.
  storageReservedPercentageForDefaultDisk: 0

# Storage class configuration
persistence:
  # Create the default 'longhorn' StorageClass
  createStorageClass: true
  # Do not make it the cluster default (apps use explicit SCs)
  defaultClass: false
  # Match the 1-replica convention used by the btrix/monitoring SCs
  defaultClassReplicaCount: 1

# Backup target: disabled on 2026-10-15. The migration backed up to the NFS
# export on glemmen60, which has since been wiped to join the cluster as a
# worker. When a permanent backupstore exists (the planned in-cluster SeaweedFS
# S3; credentials restored in the longhorn-weed-credentials secret), set
# `defaultBackupStore.backupTarget` (and the credential secret) again and
# re-create the recurring backup jobs.
defaultBackupStore:
  backupTarget: ""

# Longhorn is managed by Flux/GitOps
preUpgradeChecker:
  jobEnabled: false

# The UI is stateless (it talks to longhorn-backend); run its two replicas on
# different nodes so it stays reachable when one node fails. The chart default
# is also two replicas, but with only preferred anti-affinity.
longhornUI:
  replicas: 2
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: longhorn-ui
          topologyKey: kubernetes.io/hostname
