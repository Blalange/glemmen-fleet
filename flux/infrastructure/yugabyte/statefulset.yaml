# Three-node YugabyteDB (YSQL) cluster for Grafana.
#
# Three pods, three masters, three tservers, one Longhorn volume per pod. The
# pods are spread across three Kubernetes nodes with required anti-affinity.
# Pod 0 is the seed; pods 1/2 join it. The startup script on pod 0 waits for
# the full cluster and configures a zone-tolerant placement with RF3 before
# creating the Grafana role/database.
#
# The yugabyte-auth Secret (created by hand, not in Git) holds the superuser
# and Grafana role passwords. The grafana-db Secret in `monitoring` must carry
# the same Grafana password.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: yugabyte
  namespace: yugabyte
  labels:
    app.kubernetes.io/name: yugabyte
spec:
  serviceName: yugabyte
  # Start all three pods together: pod 0 waits for the other two to join
  # before it configures RF3, while pods 1/2 wait for pod 0's master port.
  podManagementPolicy: Parallel
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: yugabyte
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yugabyte
    spec:
      # A tserver with a 20Gi Longhorn volume can take a long time to flush its
      # tablets and WALs on shutdown; 120s was not enough and pods were being
      # SIGKILLed, which left partially written WAL segments behind. The
      # start.sh trap forwards SIGTERM to yugabyted, so allow it to finish.
      terminationGracePeriodSeconds: 600
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: yugabyte
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - glemmen130
                      - glemmen150
                      - glemmen160
                      - glemmen170
                      - glemmen180
            - weight: 50
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - glemmen80
      containers:
        - name: yugabyte
          image: yugabytedb/yugabyte:2026.1.0.1-b1
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/opt/yugabyte/start.sh"]
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: ysql
              containerPort: 5433
            - name: master-rpc
              containerPort: 7100
            - name: tserver-rpc
              containerPort: 9100
            - name: master-ui
              containerPort: 7000
            - name: tserver-ui
              containerPort: 9000
          env:
            # The tablet-replica budget is derived from this value (10% is
            # reserved for tablet overhead). Grafana's schema is small; 4GiB
            # per tserver is ample for three replicas of every tablet.
            - name: YSQL_MEMORY_LIMIT_BYTES
              value: "4294967296"
            - name: YUGABYTE_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: yugabyte-auth
                  key: superuser-password
            - name: GRAFANA_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: yugabyte-auth
                  key: grafana-password
          volumeMounts:
            - name: data
              mountPath: /home/yugabyte/yb_data
            - name: start
              mountPath: /opt/yugabyte
              readOnly: true
          startupProbe:
            exec:
              command: ["/opt/yugabyte/ready.sh"]
            periodSeconds: 5
            timeoutSeconds: 5
            # The Longhorn data disks are spinning disks and fsync latency is
            # high, so a cold start (tablet bootstrap + WAL replay) can take
            # much longer than the old 10 minute budget.
            failureThreshold: 720
          readinessProbe:
            exec:
              command: ["/opt/yugabyte/ready.sh"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Deliberately no liveness probe. A restarting tserver has to replay
          # its WALs and bootstrap every tablet; on these disks that takes tens
          # of minutes. The previous liveness probe killed pods halfway through
          # that work (leaving partial WAL segments behind) and the resulting
          # election storm made the cluster unavailable. A readiness failure
          # only removes the pod from Service endpoints; it is the correct
          # signal for a database that is busy catching up.
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 6Gi
      volumes:
        - name: start
          configMap:
            name: yugabyte-start
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: yugabyte
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: yugabyte
        resources:
          requests:
            storage: 20Gi
