# Three-node YugabyteDB (YSQL) cluster for Grafana.
#
# Three pods, three masters, three tservers, one Longhorn volume per pod. The
# pods are spread across three Kubernetes nodes with required anti-affinity.
# Pod 0 is the seed; pods 1/2 join it. The startup script on pod 0 waits for
# the full cluster and configures a zone-tolerant placement with RF3 before
# creating the Grafana role/database.
#
# The yugabyte-auth Secret (created by hand, not in Git) holds the superuser
# and Grafana role passwords. The grafana-db Secret in `monitoring` must carry
# the same Grafana password.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: yugabyte
  namespace: yugabyte
  labels:
    app.kubernetes.io/name: yugabyte
spec:
  serviceName: yugabyte
  # Start all three pods together: pod 0 waits for the other two to join
  # before it configures RF3, while pods 1/2 wait for pod 0's master port.
  podManagementPolicy: Parallel
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: yugabyte
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yugabyte
    spec:
      terminationGracePeriodSeconds: 120
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: yugabyte
              topologyKey: kubernetes.io/hostname
      containers:
        - name: yugabyte
          image: yugabytedb/yugabyte:2026.1.0.1-b1
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/opt/yugabyte/start.sh"]
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: ysql
              containerPort: 5433
            - name: master-rpc
              containerPort: 7100
            - name: tserver-rpc
              containerPort: 9100
            - name: master-ui
              containerPort: 7000
            - name: tserver-ui
              containerPort: 9000
          env:
            # The tablet-replica budget is derived from this value (10% is
            # reserved for tablet overhead). Grafana's schema is small; 4GiB
            # per tserver is ample for three replicas of every tablet.
            - name: YSQL_MEMORY_LIMIT_BYTES
              value: "4294967296"
            - name: YUGABYTE_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: yugabyte-auth
                  key: superuser-password
            - name: GRAFANA_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: yugabyte-auth
                  key: grafana-password
          volumeMounts:
            - name: data
              mountPath: /home/yugabyte/yb_data
            - name: start
              mountPath: /opt/yugabyte
              readOnly: true
          startupProbe:
            exec:
              command: ["/opt/yugabyte/ready.sh"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            exec:
              command: ["/opt/yugabyte/ready.sh"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /opt/yugabyte/ysql-local.sh
                - -U
                - yugabyte
                - -d
                - yugabyte
                - -tAc
                - SELECT 1
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 6Gi
      volumes:
        - name: start
          configMap:
            name: yugabyte-start
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: yugabyte
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: yugabyte
        resources:
          requests:
            storage: 20Gi
