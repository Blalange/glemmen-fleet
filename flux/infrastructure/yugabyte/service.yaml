# Headless Service for the three YugabyteDB pods. publishNotReadyAddresses
# lets the pods resolve each other (and their own advertise addresses) before
# the readiness probes pass.
apiVersion: v1
kind: Service
metadata:
  name: yugabyte
  namespace: yugabyte
  labels:
    app.kubernetes.io/name: yugabyte
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: yugabyte
  ports:
    - name: ysql
      port: 5433
      targetPort: ysql
    - name: master-rpc
      port: 7100
      targetPort: master-rpc
    - name: tserver-rpc
      port: 9100
      targetPort: tserver-rpc
    - name: master-ui
      port: 7000
      targetPort: master-ui
    - name: tserver-ui
      port: 9000
      targetPort: tserver-ui
