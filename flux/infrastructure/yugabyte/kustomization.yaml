apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: yugabyte
resources:
  - storageclass.yaml
  - storageclass-fast.yaml
  - release.yaml
  - pdb.yaml
  - init-job.yaml
configMapGenerator:
  - name: yugabyte-values
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true
