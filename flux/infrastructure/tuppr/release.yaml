# tuppr - Talos Linux / Kubernetes upgrade controller, driven from the cluster.
# See flux/infrastructure/tuppr/resources for the upgrade plans.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: tuppr
spec:
  interval: 1h
  url: oci://ghcr.io/home-operations/charts/tuppr
  ref:
    tag: 0.1.27
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuppr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: tuppr
