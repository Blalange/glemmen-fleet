# ECMP route agent for the dual-link 1xx nodes, glemmen80 and the single-link
# glemmen50/glemmen60/glemmen250 nodes.
#
# Felix route programming is disabled (FelixConfiguration
# programClusterRoutes: Disabled); this agent is the single owner of pod-CIDR
# routes on every node.  See agent.sh for the routing and failover logic.
apiVersion: v1
kind: Namespace
metadata:
  name: ecmp-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ecmp-route-agent
  namespace: ecmp-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ecmp-route-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ecmp-route-agent
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Run on every node: converted nodes get dual paths, single-link nodes
      # (glemmen50/glemmen60/glemmen250) get a single server-VLAN path.
      tolerations:
        - operator: Exists
      containers:
        - name: agent
          # Pinned digest: this privileged container is the sole owner of the
          # pod-CIDR routes, so a mutable tag is unacceptable.
          image: docker.io/nicolaka/netshoot@sha256:b09d9b21381f47a79b3cbcb30da25266dc17186ea00ae65e99fdc51396f48e70
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/agent.sh"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: STATE_DIR
              value: /var/lib/ecmp-route-agent
            - name: TEXTFILE_DIR
              value: /var/lib/node-exporter/textfile
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: state
              mountPath: /var/lib/ecmp-route-agent
            - name: textfile
              mountPath: /var/lib/node-exporter/textfile
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 96Mi
      volumes:
        - name: script
          configMap:
            name: ecmp-route-agent-script
            defaultMode: 0755
        - name: state
          hostPath:
            path: /var/lib/ecmp-route-agent
            type: DirectoryOrCreate
        - name: textfile
          hostPath:
            path: /var/lib/node-exporter/textfile
            type: DirectoryOrCreate
