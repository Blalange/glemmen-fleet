# Wildcard certificates. The `certificates` Flux Kustomization applies these
# to kube-system, where Traefik runs, so it can load the resulting secrets into
# its default TLS store and serve them per SNI for every Ingress. Do not move
# them back to the cert-manager namespace: Traefik would keep serving stale
# copies that cert-manager never renews.
---
# *.glem.blatrix.eu
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: glem-blatrix-eu-wildcard
spec:
  secretName: glem-blatrix-eu-wildcard-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - glem.blatrix.eu
    - "*.glem.blatrix.eu"
---
# *.shrail.eu.org, uses the same Cloudflare token as blatrix.eu
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: shrail-eu-org-wildcard
spec:
  secretName: shrail-eu-org-wildcard-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "*.shrail.eu.org"
---
# *.thisisaveryshortdomain.asso.eu.org, uses the same Cloudflare token as blatrix.eu
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: thisisaveryshortdomain-asso-eu-org-wildcard
spec:
  secretName: thisisaveryshortdomain-asso-eu-org-wildcard-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "*.thisisaveryshortdomain.asso.eu.org"
---
# *.glem.men, uses its own Cloudflare token
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: glem-men-wildcard
spec:
  secretName: glem-men-wildcard-tls
  issuerRef:
    name: letsencrypt-prod-glem-men
    kind: ClusterIssuer
  dnsNames:
    - glem.men
    - "*.glem.men"
