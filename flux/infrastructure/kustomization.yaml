# Infrastructure building blocks, reconciled before anything else:
# namespaces, Longhorn, cert-manager (chart), external-dns, MetalLB (chart),
# metrics-server, descheduler, tuppr, YugabyteDB, the SeaweedFS operator and
# Node Feature Discovery. CRs that need the charts' CRDs live in subdirectories
# (resources/) applied by their own Kustomizations.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - longhorn/
  - cert-manager/
  - external-dns/
  - metallb/
  - metrics-server/
  - descheduler/
  - tuppr/
  - yugabyte/
  - seaweedfs-operator/
  - nfd/
