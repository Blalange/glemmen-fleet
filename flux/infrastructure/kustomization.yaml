# Infrastructure building blocks, reconciled before anything else:
# namespaces, Calico (operator + Installation), cert-manager (chart),
# external-dns, MetalLB (chart), metrics-server, descheduler, tuppr,
# YugabyteDB, Rook Ceph, Node Feature Discovery and the NVIDIA GPU operator.
# CRs that need the charts' CRDs live in subdirectories (resources/) applied by
# their own Kustomizations.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - calico/
  - cert-manager/
  - external-dns/
  - metallb/
  - metrics-server/
  - descheduler/
  - yugabyte/
  - nfd/
  - gpu-operator/
