# Infrastructure building blocks, reconciled before anything else:
# namespaces, Longhorn, cert-manager (chart), MetalLB (chart), metrics-server
# and tuppr. CRs that need the charts' CRDs live in subdirectories (resources/)
# applied by their own Kustomizations.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - longhorn/
  - cert-manager/
  - metallb/
  - metrics-server/
  - tuppr/
  - yugabyte/
