# Headless Service for the single PostgreSQL pod. NetBox and Grafana connect to
# postgres.postgres.svc.cluster.local:5432.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
