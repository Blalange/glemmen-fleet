# Shared PostgreSQL for NetBox and Grafana.
#
# One pod, one Longhorn volume. The official entrypoint runs the init script
# from the postgres-init ConfigMap while the data directory is empty, then
# starts the real server. Both applications use their own role and database;
# the postgres superuser is only for administration.
#
# The postgres-auth Secret (created by hand, not in Git) holds the superuser
# password and the netbox/grafana role passwords. The application Secrets must
# contain the same role passwords.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      terminationGracePeriodSeconds: 120
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: docker.io/library/postgres:18.6-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          env:
            # The official image creates this superuser/database first. The
            # init script then creates the application roles and databases.
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: admin-password
            - name: NETBOX_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: netbox-password
            - name: GRAFANA_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: grafana-password
          ports:
            - name: postgres
              containerPort: 5432
          # postgres:18 keeps its cluster in /var/lib/postgresql/18/docker, so
          # the volume mounts one level above the data directory.
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d/10-init.sh
              subPath: init.sh
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "postgres"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
      volumes:
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: postgres
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: postgres
        resources:
          requests:
            storage: 20Gi
