# First-boot initialization for the shared PostgreSQL instance. The official
# image runs this once, while the data directory is empty. It creates the two
# application roles/databases with the passwords from the postgres-auth Secret
# and enables ltree in the NetBox database.
#
# Changing the passwords later does not change them inside PostgreSQL; rotate
# with SQL as well.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: postgres
  labels:
    app.kubernetes.io/name: postgres
data:
  init.sh: |
    #!/bin/bash
    set -euo pipefail

    create_role() {
      local role="$1"
      local password="$2"
      if ! psql -U "${POSTGRES_USER}" -d postgres -tAc \
          "SELECT 1 FROM pg_roles WHERE rolname = '${role}'" | grep -qx 1; then
        psql -U "${POSTGRES_USER}" -d postgres -v ON_ERROR_STOP=1 \
          -c "CREATE ROLE ${role} LOGIN PASSWORD '${password}'"
      else
        psql -U "${POSTGRES_USER}" -d postgres -v ON_ERROR_STOP=1 \
          -c "ALTER ROLE ${role} PASSWORD '${password}'"
      fi
    }

    create_db() {
      local db="$1"
      if ! psql -U "${POSTGRES_USER}" -d postgres -tAc \
          "SELECT 1 FROM pg_database WHERE datname = '${db}'" | grep -qx 1; then
        psql -U "${POSTGRES_USER}" -d postgres -v ON_ERROR_STOP=1 \
          -c "CREATE DATABASE ${db} OWNER ${db}"
      fi
    }

    create_role netbox "${NETBOX_DB_PASSWORD}"
    create_role grafana "${GRAFANA_DB_PASSWORD}"
    create_db netbox
    create_db grafana

    psql -U "${POSTGRES_USER}" -d netbox -v ON_ERROR_STOP=1 \
      -c "CREATE EXTENSION IF NOT EXISTS ltree"
