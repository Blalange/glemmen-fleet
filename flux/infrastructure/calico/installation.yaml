apiVersion: operator.tigera.io/v1
kind: Installation
metadata:
  name: default
spec:
  calicoLibHostPath: /var/lib/calico
  calicoNetwork:
    # Jumbo frames: the node and VLAN underlay is MTU 9000; leave 20 bytes
    # for the IPIP tunnel header. New pods get 8980-byte veth interfaces;
    # existing pods keep their previous MTU until they are recreated.
    mtu: 8980
    bgp: Disabled
    hostPorts: Enabled
    ipPools:
    - allowedUses:
      - Workload
      - Tunnel
      assignmentMode: Automatic
      blockSize: 24
      cidr: 10.42.0.0/24
      disableNewAllocations: false
      encapsulation: IPIPCrossSubnet
      name: 10.42.0.0-24
      natOutgoing: Enabled
      nodeSelector: kubernetes.io/hostname == 'glemmen150'
    - allowedUses:
      - Workload
      - Tunnel
      assignmentMode: Automatic
      blockSize: 24
      cidr: 10.42.1.0/24
      disableNewAllocations: false
      encapsulation: IPIPCrossSubnet
      name: 10.42.1.0-24
      natOutgoing: Enabled
      nodeSelector: kubernetes.io/hostname == 'glemmen130'
    - allowedUses:
      - Workload
      - Tunnel
      assignmentMode: Automatic
      blockSize: 24
      cidr: 10.42.2.0/24
      disableNewAllocations: false
      encapsulation: IPIPCrossSubnet
      name: 10.42.2.0-24
      natOutgoing: Enabled
      nodeSelector: kubernetes.io/hostname == 'glemmen60'
    # glemmen50 is currently offline. The block is reserved so it can rejoin
    # without a manual IPAM change; verify node.spec.podCIDR on first join and
    # adjust this CIDR if Kubernetes allocates a different /24.
    - allowedUses:
      - Workload
      - Tunnel
      assignmentMode: Automatic
      blockSize: 24
      cidr: 10.42.7.0/24
      disableNewAllocations: false
      encapsulation: IPIPCrossSubnet
      name: 10.42.7.0-24
      natOutgoing: Enabled
      nodeSelector: kubernetes.io/hostname == 'glemmen50'
    - allowedUses:
      - Workload
      - Tunnel
      assignmentMode: Automatic
      blockSize: 24
      cidr: 10.42.3.0/24
      disableNewAllocations: false
      encapsulation: IPIPCrossSubnet
      name: 10.42.3.0-24
      natOutgoing: Enabled
      nodeSelector: kubernetes.io/hostname == 'glemmen160'
    - allowedUses:
      - Workload
      - Tunnel
      assignmentMode: Automatic
      blockSize: 24
      cidr: 10.42.4.0/24
      disableNewAllocations: false
      encapsulation: IPIPCrossSubnet
      name: 10.42.4.0-24
      natOutgoing: Enabled
      nodeSelector: kubernetes.io/hostname == 'glemmen80'
    - allowedUses:
      - Workload
      - Tunnel
      assignmentMode: Automatic
      blockSize: 24
      cidr: 10.42.5.0/24
      disableNewAllocations: false
      encapsulation: IPIPCrossSubnet
      name: 10.42.5.0-24
      natOutgoing: Enabled
      nodeSelector: kubernetes.io/hostname == 'glemmen180'
    - allowedUses:
      - Workload
      - Tunnel
      assignmentMode: Automatic
      blockSize: 24
      cidr: 10.42.6.0/24
      disableNewAllocations: false
      encapsulation: IPIPCrossSubnet
      name: 10.42.6.0-24
      natOutgoing: Enabled
      nodeSelector: kubernetes.io/hostname == 'glemmen170'
    # glemmen250 got this block from the Kubernetes pod CIDR allocator when it
    # joined; the pool must exist for Calico to program the node.
    - allowedUses:
      - Workload
      - Tunnel
      assignmentMode: Automatic
      blockSize: 24
      cidr: 10.42.14.0/24
      disableNewAllocations: false
      encapsulation: IPIPCrossSubnet
      name: 10.42.14.0-24
      natOutgoing: Enabled
      nodeSelector: kubernetes.io/hostname == 'glemmen250'
    linuxDataplane: Iptables
    linuxPolicySetupTimeoutSeconds: 0
    multiInterfaceMode: None
    nodeAddressAutodetectionV4:
      canReach: 192.168.6.1
    windowsDataplane: Disabled
  calicoRunHostPath: /var/run/calico
  cni:
    binDir: /opt/cni/bin
    confDir: /etc/cni/net.d
    installMode: All
    ipam:
      type: Calico
    specVersion: Auto
    type: Calico
  controlPlaneReplicas: 2
  # Expose Felix and Typha Prometheus metrics for the monitoring stack.
  nodeMetricsPort: 9091
  typhaMetricsPort: 9093
  flexVolumePath: None
  kubeletVolumePluginPath: None
  logging:
    cni:
      logFileMaxAgeDays: 30
      logFileMaxCount: 10
      logFileMaxSize: 100Mi
      logSeverity: Info
  nodeUpdateStrategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
  registry: quay.io
  serviceCIDRs:
  - 10.43.0.0/16
  variant: Calico
---
apiVersion: projectcalico.org/v3
kind: FelixConfiguration
metadata:
  name: default
spec:
  bpfConnectTimeLoadBalancing: TCP
  bpfEnabled: false
  bpfHostNetworkedNATWithoutCTLB: Enabled
  floatingIPs: Disabled
  healthPort: 9099
  logSeverityScreen: Info
  nftablesFlowTableOffload: Disabled
  nftablesMode: Disabled
  # The ecmp-route-agent owns pod-CIDR routes so it can install multipath
  # routes; Felix would otherwise rewrite them to a single path.
  programClusterRoutes: Disabled
  reportingInterval: 0s
  vxlanPort: 4789
  vxlanVNI: 4096
  # Calico's XDP prefilter has no HostEndpoint resources to protect here, and
  # it cannot detach the XDP program that NetBird's eBPF WireGuard proxy
  # attaches to lo. Felix then retries the removal forever ("failed to wipe
  # the XDP state"), which delays workload-endpoint programming. XDP is not
  # used with bpfEnabled: false, so disable it instead of fighting NetBird.
  xdpEnabled: false
---
apiVersion: projectcalico.org/v3
kind: BGPConfiguration
metadata:
  name: default
spec:
  # BGP is disabled in the Installation above.  Keep the mesh off and route
  # programming disabled so re-enabling BGP later cannot take ownership of the
  # pod-CIDR routes from the ecmp-route-agent.
  logSeverityScreen: Info
  nodeToNodeMeshEnabled: false
  programClusterRoutes: Disabled
