apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nfd
spec:
  interval: 1h
  url: https://kubernetes-sigs.github.io/node-feature-discovery/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: node-feature-discovery
      version: 0.20.1
      sourceRef:
        kind: HelmRepository
        name: nfd
  values:
    master:
      # The GPU operator labels nodes with nvidia.com/gpu.present; NFD only
      # publishes labels from this namespace when it is explicitly allowed.
      extraLabelNs:
        - nvidia.com
  # The worker is a DaemonSet; do not block the release on every replica
  # becoming ready during a rolling node change.
  install:
    disableWait: true
  upgrade:
    disableWait: true
