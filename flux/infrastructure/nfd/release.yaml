apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nfd
spec:
  interval: 1h
  url: https://kubernetes-sigs.github.io/node-feature-discovery/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: node-feature-discovery
      version: 0.20.1
      sourceRef:
        kind: HelmRepository
        name: nfd
  # The worker is a DaemonSet and glemmen50 is intentionally offline, so the
  # release would otherwise wait for a permanently-missing worker replica.
  install:
    disableWait: true
  upgrade:
    disableWait: true
