# Namespaces for the workloads.
#
# Talos enables Kubernetes Pod Security Admission with a `baseline` default, so
# namespaces that run privileged or host-namespace pods must opt out explicitly.
# Privileged:
#   - rook-ceph:       Rook/Ceph OSD, MON, MGR and CSI pods are privileged
#   - metallb-system:  the speaker needs NET_ADMIN/NET_RAW and friends
#   - monitoring:      node-exporter (hostNetwork/hostPID), smartctl-exporter, network-mesh-probe
#   - node-feature-discovery: nfd-worker mounts host paths (/sys, /proc, /lib)
#   - colibri:         the hf-fuse sidecar needs a privileged FUSE mount
#   - pxe:             the proxyDHCP/TFTP pod needs hostNetwork + NET_ADMIN
#   - media:           gluetun needs NET_ADMIN and /dev/net/tun for WireGuard
#   - gpu-operator:    the toolkit/device-plugin/DCGM exporter pods are privileged
# All other namespaces (and anything added later) stay on the baseline default.
apiVersion: v1
kind: Namespace
metadata:
  name: rook-ceph
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
