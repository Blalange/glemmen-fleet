# NVIDIA GPU Operator from the NGC Helm repository.
#
# The chart also deploys Node Feature Discovery by default; the cluster already
# runs its own NFD release, so nfd.enabled=false in values.yaml.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nvidia
spec:
  interval: 1h
  url: https://helm.ngc.nvidia.com/nvidia
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: gpu-operator
      version: v26.7.2
      sourceRef:
        kind: HelmRepository
        name: nvidia
  valuesFrom:
    - kind: ConfigMap
      name: gpu-operator-values
      valuesKey: values.yaml
