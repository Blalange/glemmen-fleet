# The Ceph cluster, its block pool/CephFS and the `fast-rbd`/`fast-fs`
# StorageClasses are created by the cluster chart plus resources/.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
  namespace: rook-ceph
spec:
  interval: 1h
  timeout: 30m
  dependsOn:
    - name: rook-ceph
    - name: ceph-csi-drivers
  chart:
    spec:
      chart: rook-ceph-cluster
      version: 1.21.2
      sourceRef:
        kind: HelmRepository
        name: rook-release
  valuesFrom:
    - kind: ConfigMap
      name: rook-ceph-cluster-values
      valuesKey: values-cluster.yaml
