# Rook Ceph cluster.
#
# Current OSDs (deviceClass=cmr):
#   glemmen130: /dev/disk/by-id/wwn-0x5000c500f266aba4
#               /dev/disk/by-id/wwn-0x5000c500f266c686
#   glemmen150: /dev/disk/by-id/wwn-0x5000c500f266c378
#   glemmen170: /dev/disk/by-id/wwn-0x5000c500f266e157
#   glemmen160: /dev/disk/by-id/wwn-0x5000c500f266c046
#   glemmen180: /dev/disk/by-id/wwn-0x5000c500f266bb89
#
# Current OSDs (deviceClass=nvme), raw partitions:
#   glemmen250: /dev/disk/by-partlabel/r-nvme-osd
#   glemmen180: /dev/disk/by-partlabel/r-nvme-osd
#   glemmen170: /dev/disk/by-partlabel/r-nvme-osd
#   glemmen160: /dev/disk/by-partlabel/r-nvme-osd
#
# Deferred deliberately:
#   - glemmen60 8 TB disk, the glemmen80 1 TB disks, and the SMR disks on
#     glemmen130/150/160/170 are unmounted and not yet used by Ceph.
#   - nvme-rbd/nvme-fs: the remaining 1xx nodes need the same 100 GiB
#     EPHEMERAL cap and reinstall before they can join the nvme class.
#   - bulk-rbd/bulk-fs and the bulk RGW pools: glemmen80 has not received the
#     24x12TB disks or the external SAS HBA yet. The fast RGW below is live.
#
# Rook uses explicit device paths and never `useAllDevices`; only add devices
# that are unmounted.
toolbox:
  enabled: true

operatorNamespace: rook-ceph
clusterName: rook-ceph

cephImage:
  repository: quay.io/ceph/ceph
  tag: v20.2.4

monitoring:
  enabled: true
  createPrometheusRules: true
  rulesNamespaceOverride: monitoring
  prometheusRule:
    labels:
      release: kube-prometheus-stack

cephClusterSpec:
  dataDirHostPath: /var/lib/rook

  security:
    cephx:
      csi:
        keyType: aes

  mon:
    count: 3
    allowMultiplePerNode: false

  mgr:
    count: 2
    allowMultiplePerNode: false
    modules:
      - name: rook
        enabled: false

  dashboard:
    enabled: true
    ssl: true

  network:
    provider: host
    connections:
      # Talos 6.18 supports msgr2; explicitly require it as Rook 1.21 does.
      requireMsgr2: true
      encryption:
        enabled: false
      compression:
        enabled: false

  cephConfig:
    global:
      # Do not let Ceph advertise the Netbird or ECMP addresses.
      public_network: 192.168.6.0/24
      cluster_network: 192.168.6.0/24
      # RF2 is the cluster-wide default. The only pool that does not set a
      # size explicitly is Ceph's internal .mgr pool; without this it asks for
      # three replicas and stays undersized on the two current CMR hosts.
      osd_pool_default_size: "2"
      osd_pool_default_min_size: "1"
    osd:
      # Keep three OSDs on a 32 GB control-plane node reasonable. The OSD
      # daemon's own memory target is deliberately below the pod limit.
      osd_memory_target: "2147483648"

  storage:
    useAllNodes: false
    useAllDevices: false
    nodes:
      - name: glemmen130
        devices:
          - name: /dev/disk/by-id/wwn-0x5000c500f266aba4
            config:
              deviceClass: cmr
          - name: /dev/disk/by-id/wwn-0x5000c500f266c686
            config:
              deviceClass: cmr
      - name: glemmen150
        devices:
          - name: /dev/disk/by-id/wwn-0x5000c500f266c378
            config:
              deviceClass: cmr
      - name: glemmen170
        devices:
          - name: /dev/disk/by-id/wwn-0x5000c500f266e157
            config:
              deviceClass: cmr
          - name: /dev/disk/by-partlabel/r-nvme-osd
            config:
              deviceClass: nvme
      - name: glemmen160
        devices:
          - name: /dev/disk/by-id/wwn-0x5000c500f266c046
            config:
              deviceClass: cmr
          - name: /dev/disk/by-partlabel/r-nvme-osd
            config:
              deviceClass: nvme
      - name: glemmen180
        devices:
          - name: /dev/disk/by-id/wwn-0x5000c500f266bb89
            config:
              deviceClass: cmr
          - name: /dev/disk/by-partlabel/r-nvme-osd
            config:
              deviceClass: nvme
      - name: glemmen250
        devices:
          - name: /dev/disk/by-partlabel/r-nvme-osd
            config:
              deviceClass: nvme

  resources:
    mon:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        memory: 2Gi
    mgr:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1Gi
    osd:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 2Gi
    prepareosd:
      requests:
        cpu: 500m
        memory: 1Gi
    mds:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        memory: 2Gi
    rgw:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1Gi

  placement:
    all:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: glem.men/ephemeral
                  operator: DoesNotExist

  disruptionManagement:
    managePodBudgets: true
    osdMaintenanceTimeout: 30

  cleanupPolicy:
    # Never allow an accidental Helm uninstall to destroy the OSDs.
    confirmation: ""

# Fast CMR block tier. The matching StorageClass lives in
# resources/storageclasses.yaml and uses the same pool name.
cephBlockPools:
  - name: fast-rbd
    spec:
      failureDomain: host
      replicated:
        size: 2
        requireSafeReplicaSize: true
      deviceClass: cmr
      parameters:
        # RF2 with min_size 1 keeps writes available while a single OSD/host is
        # down. It is an availability trade-off, not additional redundancy.
        min_size: "1"
        # One PG per pool is the Ceph default for a tiny cluster, but it
        # serializes all writes through a single OSD. Spread the fast pool
        # across the three OSDs.
        pg_num: "32"
        pgp_num: "32"
    storageClass:
      enabled: false

# NVMe block tier. The first three NVMe OSDs are the raw partitions on
# glemmen250, glemmen180 and glemmen160.
  - name: nvme-rbd
    spec:
      failureDomain: host
      replicated:
        size: 2
        requireSafeReplicaSize: true
      deviceClass: nvme
      parameters:
        min_size: "1"
        pg_num: "32"
        pgp_num: "32"
    storageClass:
      enabled: false

# One CephFilesystem with the fast and NVMe data pools. `fast-fs` and
# `nvme-fs` select the corresponding pool; the bulk pool is added when the
# glemmen80 disks exist.
cephFileSystems:
  - name: cephfs
    spec:
      metadataPool:
        failureDomain: host
        replicated:
          size: 2
          requireSafeReplicaSize: true
        deviceClass: cmr
        parameters:
          min_size: "1"
          pg_num: "32"
          pgp_num: "32"
      dataPools:
        - name: fast
          failureDomain: host
          replicated:
            size: 2
            requireSafeReplicaSize: true
          deviceClass: cmr
          parameters:
            min_size: "1"
            pg_num: "32"
            pgp_num: "32"
        - name: nvme
          failureDomain: host
          replicated:
            size: 2
            requireSafeReplicaSize: true
          deviceClass: nvme
          parameters:
            min_size: "1"
            pg_num: "32"
            pgp_num: "32"
      preserveFilesystemOnDelete: true
      metadataServer:
        activeCount: 1
        activeStandby: true
        priorityClassName: system-cluster-critical
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            memory: 2Gi
    storageClass:
      enabled: false

# RGW on the fast CMR tier. The `fast` store gets its own replicated metadata
# and data pools on `deviceClass: cmr`; it is not an EC pool yet. Thanos and
# Loki are migrated here first, and can move to the bulk EC pools later without
# changing their bucket names.
cephObjectStores:
  - name: fast
    spec:
      metadataPool:
        failureDomain: host
        replicated:
          size: 2
          requireSafeReplicaSize: true
        deviceClass: cmr
        parameters:
          min_size: "1"
          pg_num: "32"
          pgp_num: "32"
      dataPool:
        failureDomain: host
        replicated:
          size: 2
          requireSafeReplicaSize: true
        deviceClass: cmr
        parameters:
          min_size: "1"
          pg_num: "32"
          pgp_num: "32"
      preservePoolsOnDelete: true
      gateway:
        port: 80
        instances: 2
        priorityClassName: system-cluster-critical
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 1Gi
    storageClass:
      enabled: true
      name: ceph-bucket
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
      parameters:
        region: us-east-1
    ingress:
      enabled: false

# The credentials are generated into
# rook-ceph-object-user-fast-{thanos,loki}. The buckets themselves are created
# once with radosgw-admin and are not managed by these users.
cephObjectStoreUsers:
  - name: thanos
    spec:
      store: fast
      displayName: Thanos
  - name: loki
    spec:
      store: fast
      displayName: Loki

cephECBlockPools: []
