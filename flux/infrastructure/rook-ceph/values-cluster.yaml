# Rook Ceph cluster.
#
# Current OSDs (deviceClass=cmr):
#   glemmen130: /dev/disk/by-id/wwn-0x5000c500f266aba4
#               /dev/disk/by-id/wwn-0x5000c500f266c686
#   glemmen150: /dev/disk/by-id/wwn-0x5000c500f266c378
#   glemmen170: /dev/disk/by-id/wwn-0x5000c500f266e157
#   glemmen160: /dev/disk/by-id/wwn-0x5000c500f266c046
#   glemmen180: /dev/disk/by-id/wwn-0x5000c500f266bb89
#
# Current OSDs (deviceClass=nvme), raw partitions:
#   glemmen250: /dev/disk/by-partlabel/r-nvme-osd
#   glemmen180: /dev/disk/by-partlabel/r-nvme-osd
#   glemmen170: /dev/disk/by-partlabel/r-nvme-osd
#   glemmen150: /dev/disk/by-partlabel/r-nvme-osd
#   glemmen130: /dev/disk/by-partlabel/r-nvme-osd
#   glemmen160: /dev/disk/by-partlabel/r-nvme-osd
#
# Deferred deliberately:
#   - the glemmen80 1 TB disks and the SMR disks on
#     glemmen130/150/160/170 are unmounted and not yet used by Ceph.
#   - bulk-rbd/bulk-fs and the bulk RGW pools: glemmen80 has not received the
#     24x12TB disks or the external SAS HBA yet. The fast RGW below is live.
#
# Rook uses explicit device paths and never `useAllDevices`; only add devices
# that are unmounted.
toolbox:
  enabled: true

operatorNamespace: rook-ceph
clusterName: rook-ceph

cephImage:
  repository: quay.io/ceph/ceph
  tag: v20.2.4

monitoring:
  enabled: true
  createPrometheusRules: true
  rulesNamespaceOverride: monitoring
  prometheusRule:
    labels:
      release: kube-prometheus-stack

cephClusterSpec:
  dataDirHostPath: /var/lib/rook

  security:
    cephx:
      csi:
        keyType: aes

  mon:
    count: 3
    allowMultiplePerNode: false

  mgr:
    count: 2
    allowMultiplePerNode: false
    modules:
      - name: rook
        enabled: false

  dashboard:
    enabled: true
    ssl: true

  network:
    provider: host
    connections:
      # Talos 6.18 supports msgr2; explicitly require it as Rook 1.21 does.
      requireMsgr2: true
      encryption:
        enabled: false
      compression:
        enabled: false

  cephConfig:
    global:
      # Do not let Ceph advertise the Netbird or ECMP addresses.
      public_network: 192.168.6.0/24
      cluster_network: 192.168.6.0/24
      # RF2 is the cluster-wide default. The only pool that does not set a
      # size explicitly is Ceph's internal .mgr pool; without this it asks for
      # three replicas and stays undersized on the two current CMR hosts.
      osd_pool_default_size: "2"
      osd_pool_default_min_size: "1"
    osd:
      # Keep three OSDs on a 32 GB control-plane node reasonable. The OSD
      # daemon's own memory target is deliberately below the pod limit.
      osd_memory_target: "2147483648"
    mds:
      # Keep the MDS cache below the 4Gi pod limit. The Ceph default is 4Gi,
      # which would leave no headroom for the daemon itself.
      mds_cache_memory_limit: "3221225472"

  storage:
    useAllNodes: false
    useAllDevices: false
    nodes:
      - name: glemmen60
        devices:
          - name: /dev/disk/by-id/wwn-0x6b8ca3a0f77e3f003291bffdae6cda20
            config:
              deviceClass: cmr
          - name: /dev/disk/by-id/wwn-0x6b8ca3a0f77e3f003291bffdae756f8f
            config:
              deviceClass: cmr
          - name: /dev/disk/by-id/wwn-0x6b8ca3a0f77e3f003291bffeae7ee88b
            config:
              deviceClass: cmr
          - name: /dev/disk/by-id/wwn-0x6b8ca3a0f77e3f003291bfffae88ae35
            config:
              deviceClass: cmr
          - name: /dev/disk/by-id/wwn-0x6b8ca3a0f77e3f003291bfffae92d1d5
            config:
              deviceClass: cmr
      - name: glemmen130
        devices:
          - name: /dev/disk/by-id/wwn-0x5000c500f266aba4
            config:
              deviceClass: cmr
          - name: /dev/disk/by-id/wwn-0x5000c500f266c686
            config:
              deviceClass: cmr
          - name: /dev/disk/by-partlabel/r-nvme-osd
            config:
              deviceClass: nvme
      - name: glemmen150
        devices:
          - name: /dev/disk/by-id/wwn-0x5000c500f266c378
            config:
              deviceClass: cmr
          - name: /dev/disk/by-partlabel/r-nvme-osd
            config:
              deviceClass: nvme
      - name: glemmen170
        devices:
          - name: /dev/disk/by-id/wwn-0x5000c500f266e157
            config:
              deviceClass: cmr
          - name: /dev/disk/by-partlabel/r-nvme-osd
            config:
              deviceClass: nvme
      - name: glemmen160
        devices:
          - name: /dev/disk/by-id/wwn-0x5000c500f266c046
            config:
              deviceClass: cmr
          - name: /dev/disk/by-partlabel/r-nvme-osd
            config:
              deviceClass: nvme
      - name: glemmen180
        devices:
          - name: /dev/disk/by-id/wwn-0x5000c500f266bb89
            config:
              deviceClass: cmr
          - name: /dev/disk/by-partlabel/r-nvme-osd
            config:
              deviceClass: nvme
      - name: glemmen250
        devices:
          - name: /dev/disk/by-partlabel/r-nvme-osd
            config:
              deviceClass: nvme

  resources:
    mon:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        memory: 3Gi
    mgr:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1Gi
    osd:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 3Gi
    prepareosd:
      requests:
        cpu: 500m
        memory: 1Gi
    mds:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        memory: 4Gi
    rgw:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1Gi

  placement:
    all:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: glem.men/ephemeral
                  operator: DoesNotExist

  disruptionManagement:
    managePodBudgets: true
    osdMaintenanceTimeout: 30

  cleanupPolicy:
    # Never allow an accidental Helm uninstall to destroy the OSDs.
    confirmation: ""

# Fast CMR block tier. The matching StorageClass lives in
# resources/storageclasses.yaml and uses the same pool name.
cephBlockPools:
  - name: fast-rbd
    spec:
      failureDomain: host
      replicated:
        size: 2
        requireSafeReplicaSize: true
      deviceClass: cmr
      parameters:
        # RF2 with min_size 1 keeps writes available while a single OSD/host is
        # down. It is an availability trade-off, not additional redundancy.
        min_size: "1"
        # Keep a floor of 32 PGs so the pool is spread across the OSDs, but
        # let the PG autoscaler own pg_num. Do not set pg_num or pgp_num here:
        # Rook re-applies every parameter on each reconcile, which would fight
        # the autoscaler.
        pg_num_min: "32"
    storageClass:
      enabled: false

  # NVMe block tier. The NVMe OSDs are the raw partitions on the control-plane
  # nodes and glemmen250.
  - name: nvme-rbd
    spec:
      failureDomain: host
      replicated:
        size: 2
        requireSafeReplicaSize: true
      deviceClass: nvme
      parameters:
        min_size: "1"
        pg_num_min: "32"
    storageClass:
      enabled: false

# One CephFilesystem with the fast and NVMe data pools. `fast-fs` and
# `nvme-fs` select the corresponding pool; the bulk pool is added when the
# glemmen80 disks exist.
cephFileSystems:
  - name: cephfs
    spec:
      metadataPool:
        failureDomain: host
        replicated:
          size: 2
          requireSafeReplicaSize: true
        deviceClass: cmr
        parameters:
          min_size: "1"
          pg_num_min: "32"
      dataPools:
        - name: fast
          failureDomain: host
          replicated:
            size: 2
            requireSafeReplicaSize: true
          deviceClass: cmr
          parameters:
            min_size: "1"
            pg_num_min: "32"
        - name: nvme
          failureDomain: host
          replicated:
            size: 2
            requireSafeReplicaSize: true
          deviceClass: nvme
          parameters:
            min_size: "1"
            pg_num_min: "32"
      preserveFilesystemOnDelete: true
      metadataServer:
        activeCount: 1
        activeStandby: true
        priorityClassName: system-cluster-critical
        placement:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app: rook-ceph-mds
                topologyKey: kubernetes.io/hostname
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            memory: 4Gi
    storageClass:
      enabled: false

# RGW on the fast CMR tier. The `fast` store gets its own replicated metadata
# and data pools on `deviceClass: cmr`; it is not an EC pool yet. Thanos and
# Loki are migrated here first, and can move to the bulk EC pools later without
# changing their bucket names.
cephObjectStores:
  - name: fast
    spec:
      metadataPool:
        failureDomain: host
        replicated:
          size: 2
          requireSafeReplicaSize: true
        deviceClass: cmr
        parameters:
          min_size: "1"
          # Rook sets pg_num_min=8 on the RGW metadata/index pools itself.
          # Leave pg_num/pgp_num unset so the autoscaler stays in control.
      dataPool:
        failureDomain: host
        replicated:
          size: 2
          requireSafeReplicaSize: true
        deviceClass: cmr
        parameters:
          min_size: "1"
          pg_num_min: "32"
      preservePoolsOnDelete: true
      gateway:
        port: 80
        instances: 2
        priorityClassName: system-cluster-critical
        placement:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app: rook-ceph-rgw
                topologyKey: kubernetes.io/hostname
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 1Gi
    storageClass:
      enabled: true
      name: ceph-bucket
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
      parameters:
        region: us-east-1
    ingress:
      enabled: false

# The credentials are generated into
# rook-ceph-object-user-fast-{thanos,loki,plus}. The buckets themselves are
# created once and are not managed by these users.
cephObjectStoreUsers:
  - name: thanos
    spec:
      store: fast
      displayName: Thanos
  - name: loki
    spec:
      store: fast
      displayName: Loki
  - name: plus
    spec:
      store: fast
      displayName: Plus

cephECBlockPools: []
