# The Rook operator creates ServiceMonitors and PrometheusRules when
# `monitoring.enabled` is true in the CephCluster. The upstream operator
# ClusterRole does not grant those permissions, so Rook logs
# "servicemonitors ... is forbidden" and never creates the monitoring objects.
# Grant just the monitoring API permissions; the Ceph metrics are then scraped
# by kube-prometheus-stack's Prometheus.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rook-ceph-monitoring
rules:
  - apiGroups:
      - monitoring.coreos.com
    resources:
      - servicemonitors
      - prometheusrules
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rook-ceph-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rook-ceph-monitoring
subjects:
  - kind: ServiceAccount
    name: rook-ceph-system
    namespace: rook-ceph
