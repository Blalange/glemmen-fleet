# Ceph dashboard ingress.
#
# The Rook dashboard Service has no Traefik service annotations, so expose an
# alias Service with the same active-mgr selector and tell Traefik to speak
# HTTPS to it with certificate verification disabled. Client-side TLS is the
# usual Traefik default store (*.glem.men wildcard certificate), selected by
# SNI; no namespace-local TLS Secret is needed.
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: insecure
  namespace: rook-ceph
spec:
  insecureSkipVerify: true
---
apiVersion: v1
kind: Service
metadata:
  name: ceph-dashboard
  namespace: rook-ceph
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/service.serverstransport: rook-ceph-insecure@kubernetescrd
spec:
  selector:
    app: rook-ceph-mgr
    mgr_role: active
    rook_cluster: rook-ceph
  ports:
    - name: https-dashboard
      port: 8443
      protocol: TCP
      targetPort: 8443
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ceph-dashboard
  namespace: rook-ceph
spec:
  ingressClassName: traefik
  rules:
    - host: ceph.glem.men
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ceph-dashboard
                port:
                  number: 8443
