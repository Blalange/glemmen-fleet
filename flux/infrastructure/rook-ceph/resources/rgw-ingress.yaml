# Ceph RGW (S3) ingress.
#
# Traefik terminates TLS using the default *.glem.men wildcard certificate
# (selected by SNI) and forwards plain HTTP to the fast RGW Service on port 80.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ceph-rgw-fast
  namespace: rook-ceph
spec:
  ingressClassName: traefik
  rules:
    - host: s3.glem.men
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rook-ceph-rgw-fast
                port:
                  number: 80
