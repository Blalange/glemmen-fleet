# Rook Ceph operator (+ the ceph-csi-operator subchart).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  interval: 1h
  timeout: 20m
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: rook-ceph
      version: 1.21.2
      sourceRef:
        kind: HelmRepository
        name: rook-release
  valuesFrom:
    - kind: ConfigMap
      name: rook-ceph-operator-values
      valuesKey: values-operator.yaml
