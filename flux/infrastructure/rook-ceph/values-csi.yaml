# Recommended Rook-compatible values for the ceph-csi-drivers chart.
# Only RBD and CephFS are enabled; NFS and NVMe-oF are not used by this
# cluster.
operatorConfig:
  namespace: rook-ceph
  driverSpecDefaults:
    imageSet:
      name: rook-csi-operator-image-set-configmap
    nodePlugin:
      priorityClassName: system-node-critical
    controllerPlugin:
      priorityClassName: system-cluster-critical
      replicas: 2

drivers:
  rbd:
    enabled: true
    name: rook-ceph.rbd.csi.ceph.com
  cephfs:
    enabled: true
    name: rook-ceph.cephfs.csi.ceph.com
  nfs:
    enabled: false
    name: rook-ceph.nfs.csi.ceph.com
  nvmeof:
    enabled: false
    name: rook-ceph.nvmeof.csi.ceph.com
