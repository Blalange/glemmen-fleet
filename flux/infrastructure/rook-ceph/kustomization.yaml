# Rook Ceph.
#
# The `fast` CMR tier (glemmen130/150/160/170/180) and the `nvme` tier
# (glemmen250/180/160) are live. `bulk-rbd`/`bulk-fs` plus the bulk RGW move
# wait for the 24x12TB disks and HBA in glemmen80. See README.md for details.
#
# The HelmReleases are applied after the `infrastructure` Kustomization so the
# privileged namespace and the Prometheus Operator CRDs already exist.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rook-ceph
resources:
  - repositories.yaml
  - release-operator.yaml
  - release-csi.yaml
  - release-cluster.yaml
  - resources/
configMapGenerator:
  - name: rook-ceph-operator-values
    files:
      - values-operator.yaml
  - name: rook-ceph-csi-values
    files:
      - values-csi.yaml
  - name: rook-ceph-cluster-values
    files:
      - values-cluster.yaml
generatorOptions:
  disableNameSuffixHash: true
