# ProxyDHCP and TFTP for the server VLAN.
#
# UniFi remains the only DHCP address server. dnsmasq only supplies the PXE
# boot options, so a normal DHCP lease still comes from the UDM.
port=0
interface=bond0
bind-interfaces
dhcp-range=192.168.6.0,proxy,255.255.255.0

enable-tftp
tftp-root=/var/lib/tftpboot

# First stage: chain the firmware's PXE implementation to iPXE.
dhcp-match=set:bios,option:client-arch,0
dhcp-boot=tag:bios,undionly.kpxe
dhcp-match=set:efi32,option:client-arch,6
dhcp-boot=tag:efi32,ipxe.efi
dhcp-match=set:efibc,option:client-arch,7
dhcp-boot=tag:efibc,ipxe.efi
dhcp-match=set:efi64,option:client-arch,9
dhcp-boot=tag:efi64,ipxe.efi

# Second stage: iPXE asks again with user-class iPXE. Serve the generated
# script, which matches known Talos nodes and falls back to netboot.xyz.
dhcp-userclass=set:ipxe,iPXE
dhcp-boot=tag:ipxe,boot.ipxe

log-dhcp
log-facility=-
