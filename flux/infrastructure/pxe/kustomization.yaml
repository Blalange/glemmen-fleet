# PXE chainloader: proxyDHCP/TFTP for BIOS and UEFI, the generated iPXE boot
# script, and the Talos kernel/initramfs asset server.
#
# boot.ipxe is generated by scripts/talos/gen-pxe.py from talos/pxe.yaml and
# talos/nodes/*.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pxe
resources:
  - dnsmasq.yaml
  - assets.yaml
configMapGenerator:
  - name: pxe-dnsmasq-config
    files:
      - dnsmasq.conf
  - name: pxe-boot-script
    files:
      - boot.ipxe
  # TALOS_VERSION comes from the shared Talos settings. The hash suffix makes
  # the asset Deployment re-download when the value changes.
  - name: pxe-settings
    envs:
      - ../../../talos/settings.env
  # Serve both images: the base schematic for every non-GPU node and the GPU
  # schematic for TALOS_GPU_NODES (glemmen250). Booting a non-GPU node from
  # the GPU image reintroduces the NVIDIA service boot wait from the
  # 2026-11-19 incident.
  - name: pxe-schematics
    files:
      - schematic.yaml=../../../talos/schematic.yaml
      - schematic-gpu.yaml=../../../talos/schematic-gpu.yaml
