# PXE chainloader: proxyDHCP/TFTP for BIOS and UEFI, the generated iPXE boot
# script, and the Talos kernel/initramfs asset server.
#
# boot.ipxe is generated by scripts/talos/gen-pxe.py from talos/pxe.yaml and
# talos/nodes/*.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pxe
resources:
  - dnsmasq.yaml
  - assets.yaml
configMapGenerator:
  - name: pxe-dnsmasq-config
    files:
      - dnsmasq.conf
  - name: pxe-boot-script
    files:
      - boot.ipxe
  # TALOS_VERSION comes from the shared Talos settings. The hash suffix makes
  # the asset Deployment re-download when the value changes.
  - name: pxe-settings
    envs:
      - ../../../talos/settings.env
  # Keep the PXE assets on the GPU schematic until the PXE server is split or
  # relocated. Control planes are installed from the base schematic and do not
  # run the NVIDIA services; glemmen250 still needs the GPU kernel/modules on
  # its PXE boots. The file is mounted as /config/schematic.yaml.
  - name: pxe-schematic
    files:
      - schematic.yaml=../../../talos/schematic-gpu.yaml
