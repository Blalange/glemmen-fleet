# One probe per node. hostNetwork is deliberate: the probe must source its
# pings and transfers from the node's own network stack, and its HTTP server
# must be reachable on the node's InternalIP.
#
# The test volume is a balance between measurement accuracy and background
# traffic: 32 MiB takes roughly 0.3s on a 1 Gbit/s link and 0.03s on a 10
# Gbit/s link. Each transfer is split across TRANSFER_FLOWS parallel HTTP
# connections so multipath/ECMP links are exercised; the total traffic stays
# at 32 MiB per direction. Tests are phase-shifted across nodes (see probe.py),
# so all nodes do not run the full mesh at the same instant.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: network-mesh-probe
  namespace: monitoring
  labels:
    app.kubernetes.io/name: network-mesh-probe
    app.kubernetes.io/component: probe
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: network-mesh-probe
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: network-mesh-probe
        app.kubernetes.io/component: probe
    spec:
      serviceAccountName: network-mesh-probe
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/os: linux
      # Run on every node, including the control-plane nodes. The DaemonSet is
      # a cluster-wide diagnostic, so it intentionally tolerates all taints.
      tolerations:
        - operator: Exists
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: docker.io/library/python:3.13-slim
          imagePullPolicy: IfNotPresent
          command: ["python3", "-u", "/app/probe.py"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: PORT
              value: "9101"
            - name: INTERVAL_SECONDS
              value: "300"
            - name: PING_COUNT
              value: "4"
            - name: PING_INTERVAL_MS
              value: "200"
            - name: PING_TIMEOUT_SECONDS
              value: "1"
            - name: TRANSFER_BYTES
              value: "33554432"
            - name: TRANSFER_FLOWS
              value: "8"
            - name: TRANSFER_TIMEOUT_SECONDS
              value: "15"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: http
              containerPort: 9101
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 1000m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_RAW"]
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: app
          configMap:
            name: network-mesh-probe
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
