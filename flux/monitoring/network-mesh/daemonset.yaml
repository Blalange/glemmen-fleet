# One probe per node. The probe runs on the pod network (not hostNetwork) so
# its pings and iperf3 tests traverse the Calico pod-CIDR routes and exercise
# the ECMP multipath links between nodes. It discovers the peer probe pods via
# the Kubernetes API and uses their pod IPs.
#
# Each throughput test is a 2-second iperf3 TCP run with 16 parallel streams in
# each direction. iperf3 is used instead of the Python HTTP transfer because
# the Python write path was CPU-bound around 1 Gbit/s and could not show the
# 2 Gbit/s ECMP aggregate. Tests are phase-shifted across nodes so only one
# pair runs at a time.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: network-mesh-probe
  namespace: monitoring
  labels:
    app.kubernetes.io/name: network-mesh-probe
    app.kubernetes.io/component: probe
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: network-mesh-probe
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: network-mesh-probe
        app.kubernetes.io/component: probe
    spec:
      serviceAccountName: network-mesh-probe
      hostNetwork: false
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/os: linux
      # Run on every node, including the control-plane nodes. The DaemonSet is
      # a cluster-wide diagnostic, so it intentionally tolerates all taints.
      tolerations:
        - operator: Exists
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: docker.io/nicolaka/netshoot:latest
          imagePullPolicy: IfNotPresent
          command: ["python3", "-u", "/app/probe.py"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PORT
              value: "9101"
            - name: INTERVAL_SECONDS
              value: "300"
            - name: PING_COUNT
              value: "4"
            - name: PING_INTERVAL_MS
              value: "200"
            - name: PING_TIMEOUT_SECONDS
              value: "1"
            - name: TRANSFER_BYTES
              value: "33554432"
            - name: TRANSFER_FLOWS
              value: "16"
            - name: TRANSFER_TIMEOUT_SECONDS
              value: "15"
            - name: IPERF_PORT
              value: "5201"
            - name: IPERF_SECONDS
              value: "2"
            - name: IPERF_OMIT_SECONDS
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: http
              containerPort: 9101
              protocol: TCP
            - name: iperf
              containerPort: 5201
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 1000m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_RAW"]
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: app
          configMap:
            name: network-mesh-probe
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
