# One probe per node. The probe runs on the pod network (not hostNetwork) so
# its pings and iperf3 tests traverse the Calico pod-CIDR routes between
# nodes. It discovers the peer probe pods via
# the Kubernetes API and uses their pod IPs.
#
# The node/VLAN underlay is MTU 9000 and Calico pods use 8980 bytes, so the
# iperf3 test uses the jumbo-frame path.
#
# Pings run every minute and are the health signal.  Throughput tests run
# every 30 minutes with 16 parallel iperf3 streams in each direction; they are
# phase-shifted so only one node runs a throughput cycle at a time.  This keeps
# the 1 Gbit/s access ports from being saturated by the monitoring itself.
#
# Expected link capacities come from the glem.men/lan-speed node label
# (aggregate LAN speed in Mbit/s), which the probe reads from the Kubernetes
# API; there is no capacity list to keep in sync here.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: network-mesh-probe
  namespace: monitoring
  labels:
    app.kubernetes.io/name: network-mesh-probe
    app.kubernetes.io/component: probe
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: network-mesh-probe
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: network-mesh-probe
        app.kubernetes.io/component: probe
    spec:
      serviceAccountName: network-mesh-probe
      hostNetwork: false
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/os: linux
      # Run on every node, including the control-plane nodes. The DaemonSet is
      # a cluster-wide diagnostic, so it intentionally tolerates all taints.
      tolerations:
        - operator: Exists
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          # Pinned digest: the probe runs privileged-ish ICMP/iperf tests and
          # must not change tooling silently on a node rejoin.
          image: docker.io/nicolaka/netshoot@sha256:b09d9b21381f47a79b3cbcb30da25266dc17186ea00ae65e99fdc51396f48e70
          imagePullPolicy: IfNotPresent
          command: ["python3", "-u", "/app/probe.py"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PORT
              value: "9101"
            - name: PING_INTERVAL_SECONDS
              value: "60"
            - name: TRANSFER_INTERVAL_SECONDS
              value: "1800"
            - name: PING_COUNT
              value: "10"
            - name: PING_INTERVAL_MS
              value: "200"
            - name: PING_TIMEOUT_SECONDS
              value: "1"
            - name: TRANSFER_BYTES
              value: "33554432"
            - name: TRANSFER_FLOWS
              value: "16"
            - name: TRANSFER_TIMEOUT_SECONDS
              value: "20"
            - name: IPERF_PORT
              value: "5201"
            - name: IPERF_SECONDS
              value: "3"
            - name: IPERF_OMIT_SECONDS
              value: "1"
            - name: EXPECTED_NODES
              value: "glemmen60,glemmen80,glemmen130,glemmen150,glemmen160,glemmen170,glemmen180,glemmen250"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: http
              containerPort: 9101
              protocol: TCP
            - name: iperf
              containerPort: 5201
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 1000m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_RAW"]
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: app
          configMap:
            name: network-mesh-probe
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
