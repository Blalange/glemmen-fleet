# Node-to-node network tests (ICMP latency/loss and HTTP upload/download).
#
# The probe runs as a host-network DaemonSet so each node tests the network
# path from itself to every other node. The script is kept in the ConfigMap and
# mounted into a stock Python image; no custom image build is required. The
# generated ConfigMap name carries a hash, so changing probe.py rolls the
# DaemonSet.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - rbac.yaml
  - daemonset.yaml
configMapGenerator:
  - name: network-mesh-probe
    files:
      - probe.py
