# The probe lists its peer probe pods in the monitoring namespace to discover
# their pod IPs, and lists nodes to read the glem.men/lan-speed capacity label.
# It only reads these objects; it does not watch them, so get/list is enough.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: network-mesh-probe
  namespace: monitoring
  labels:
    app.kubernetes.io/name: network-mesh-probe
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: network-mesh-probe
  labels:
    app.kubernetes.io/name: network-mesh-probe
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: network-mesh-probe
  labels:
    app.kubernetes.io/name: network-mesh-probe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: network-mesh-probe
subjects:
  - kind: ServiceAccount
    name: network-mesh-probe
    namespace: monitoring
