# Node-to-node network mesh dashboard (ping RTT/loss and upload/download
# throughput matrices). The dashboard is maintained by hand because its
# groupingToMatrix tables are tailored to the network-mesh-probe metrics.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
configMapGenerator:
  - name: grafana-dashboard-network-mesh
    files:
      - network-mesh.json
commonAnnotations:
  grafana_folder: Network
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
