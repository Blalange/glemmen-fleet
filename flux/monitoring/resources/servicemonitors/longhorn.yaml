# Longhorn Manager metrics (node/disk capacity, volume state, ...) for the
# cluster specs and Longhorn dashboards. The chart's own ServiceMonitor is not
# used because this cluster installs the Prometheus Operator CRDs after the
# infrastructure group (same reason as the tuppr ServiceMonitor).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: longhorn
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - longhorn-system
  selector:
    matchLabels:
      app: longhorn-manager
  endpoints:
    - port: manager
      interval: 30s
