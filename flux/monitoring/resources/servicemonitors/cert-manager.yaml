# cert-manager metrics for kube-prometheus-stack. This mirrors the ServiceMonitor
# the cert-manager chart would create (prometheus.servicemonitor.enabled), moved
# here because the monitoring.coreos.com CRDs only exist after kube-prometheus-stack
# is installed.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cert-manager
  namespace: cert-manager
  labels:
    app: cert-manager
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/instance: cert-manager
    app.kubernetes.io/component: controller
spec:
  jobLabel: app.kubernetes.io/name
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - cert-manager
          - cainjector
          - webhook
      - key: app.kubernetes.io/instance
        operator: In
        values:
          - cert-manager
      - key: app.kubernetes.io/component
        operator: In
        values:
          - cainjector
          - controller
          - webhook
  namespaceSelector:
    matchNames:
      - cert-manager
  endpoints:
    - targetPort: http-metrics
      path: /metrics
      honorLabels: false
