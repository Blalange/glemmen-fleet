# Monitoring stack: kube-prometheus-stack (+ the StorageClass/static Grafana
# PVC), Thanos for long-term metrics, smartctl-exporter, kepler and unpoller.
# Dashboards, alert rules and ServiceMonitors live in resources/ (applied after
# the CRDs exist).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pvc/
  - kube-prometheus-stack/
  - thanos/
  - smartctl-exporter/
  - kepler/
  - unpoller/
