# kube-prometheus-stack (Prometheus, Alertmanager, Grafana, exporters, CRDs).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
spec:
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  interval: 1h
  # Grafana runs its SQLite -> PostgreSQL schema migrations during the first
  # rollout after the database switch.
  timeout: 30m
  # The chart's node-exporter DaemonSet can never report all
  # replicas ready while a node is down. Waiting for readiness would keep the
  # whole release (and every dependent Kustomization) stuck until the timeout.
  install:
    disableWait: true
  upgrade:
    disableWait: true
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 87.21.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  valuesFrom:
    - kind: ConfigMap
      name: kube-prometheus-stack-values
      valuesKey: values.yaml
