# kube-prometheus-stack (Prometheus, Alertmanager, Grafana, exporters, CRDs).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
spec:
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  interval: 1h
  # Grafana runs its SQLite -> PostgreSQL schema migrations during the first
  # rollout after the database switch.
  timeout: 30m
  # The chart's node-exporter DaemonSet can never report all
  # replicas ready while a node is down. Waiting for readiness would keep the
  # whole release (and every dependent Kustomization) stuck until the timeout.
  install:
    disableWait: true
  upgrade:
    disableWait: true
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 87.21.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  valuesFrom:
    - kind: ConfigMap
      name: kube-prometheus-stack-values
      valuesKey: values.yaml
  # The chart only supports one annotation set for all of its built-in
  # dashboards, so select the Kubernetes-mixin and node-exporter-mixin
  # dashboards by ConfigMap name and add the folder annotation the Grafana
  # sidecar uses. k8s-coredns is deliberately excluded: its dashboard is
  # CoreDNS-specific, not part of the Kubernetes mixin.
  postRenderers:
    - kustomize:
        patches:
          # Grafana's subchart defaults to an HTTP /api/health liveness probe.
          # During a YugabyteDB outage that endpoint returns 503 and the probe
          # restarts Grafana, which cannot make the database recover. Replace
          # the whole probe with a TCP check; readiness keeps using /api/health.
          - target:
              kind: Deployment
              name: kube-prometheus-stack-grafana
            patch: |
              - op: replace
                path: /spec/template/spec/containers/2/livenessProbe
                value:
                  tcpSocket:
                    port: grafana
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
          - target:
              kind: ConfigMap
              name: "kube-prometheus-stack-(apiserver|cluster-total|controller-manager|k8s-resources-.*|kubelet|namespace-by-.*|persistentvolumesusage|pod-total|proxy|scheduler|workload-total)"
            patch: |
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: dashboard-folder
                annotations:
                  grafana_folder: Kubernetes
          - target:
              kind: ConfigMap
              name: "kube-prometheus-stack-(node-cluster-rsrc-use|node-rsrc-use|nodes|nodes-aix|nodes-darwin)"
            patch: |
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: dashboard-folder
                annotations:
                  grafana_folder: Node Exporter
