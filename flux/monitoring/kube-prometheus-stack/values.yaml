# kube-prometheus-stack configuration
# Provides Prometheus, Grafana, Alertmanager, and exporters

# Prometheus configuration
prometheus:
  prometheusSpec:
    replicas: 1
    # Prometheus is a StatefulSet: its updateStrategy only supports RollingUpdate
    # or OnDelete (the CRD rejects Recreate). With one replica the old pod is
    # terminated before the new one is created, so the RWO volume is never
    # attached to two pods at once.
    # Scrape configuration. 30s halves ingestion while still matching the
    # Grafana/Thanos data source interval.
    scrapeInterval: 30s

    # Thanos identifies uploaded blocks by their Prometheus external labels.
    externalLabels:
      cluster: glemmen

    # Prefer the control-plane/1xx nodes. This is a soft preference so
    # Prometheus can still move to a worker if the 1xx nodes are full.
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - glemmen130
                    - glemmen150
                    - glemmen160
                    - glemmen170
                    - glemmen180
          - weight: 50
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - glemmen80

    # Storage configuration
    # Keep the local volume below the 20Gi budget: Prometheus deletes the
    # oldest blocks as soon as the block directory reaches 15GiB (the WAL and
    # head chunks live on top of that). Older samples stay queryable through
    # Thanos, which uploads blocks to object storage before they are deleted.
    retention: 30d
    retentionSize: 15GiB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: monitoring
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

    # Ship completed TSDB blocks to the Thanos object store (the `thanos`
    # bucket in SeaweedFS, see ../../infrastructure/seaweedfs) and expose the
    # local Prometheus through the Thanos Store API.
    thanos:
      image: quay.io/thanos/thanos:v0.42.4
      objectStorageConfig:
        existingSecret:
          name: thanos-objstore-config
          key: objstore.yml
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 2Gi

    # Resource limits. Prometheus runs on a 1xx control-plane node (4 CPU /
    # 32GiB); these leave room for the sidecar and system pods while allowing
    # compaction/query bursts.
    resources:
      requests:
        cpu: 1
        memory: 4Gi
      limits:
        cpu: 3
        # Peak usage was already ~3.8Gi with the old scrape volume.
        memory: 10Gi

    # Service monitors selector - match all
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

    # Enable monitoring of all namespaces
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}

  # Headless service used by Thanos Query to discover the sidecar's gRPC
  # Store API (port 10901), plus its ServiceMonitor.
  thanosService:
    enabled: true
  thanosServiceMonitor:
    enabled: true

# Grafana configuration
grafana:
  enabled: true
  # Two replicas share the YugabyteDB database. The local /var/lib/grafana is
  # an emptyDir, so there is no RWO volume to serialize on and a rolling
  # update can keep one replica serving.
  replicas: 2
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
          topologyKey: kubernetes.io/hostname
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - glemmen130
                  - glemmen150
                  - glemmen160
                  - glemmen170
                  - glemmen180
        - weight: 50
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - glemmen80

  # Readiness is the database-backed probe. The subchart's default
  # /api/health liveness probe is replaced by a TCP check in release.yaml:
  # Grafana returns 503 while YugabyteDB is unavailable, and restarting Grafana
  # does not make the database recover any faster. The startup probe waits for
  # the database-backed health endpoint during a cold start (including a schema
  # migration).
  startupProbe:
    httpGet:
      path: /api/health
      port: grafana
    periodSeconds: 10
    timeoutSeconds: 10
    # Allow an hour: the first migration can take 20-30 minutes on this
    # cluster, and a YugabyteDB outage can delay it much longer.
    failureThreshold: 360

  # Use secret for admin password
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  # Database password for the in-cluster YugabyteDB grafana role.
  envValueFrom:
    GF_DATABASE_PASSWORD:
      secretKeyRef:
        name: grafana-db
        key: password

  # Grafana's SQLite database is replaced by the three-node YugabyteDB (YSQL)
  # in the `yugabyte` namespace (flux/infrastructure/yugabyte). The role
  # password is in the grafana-db Secret (created by hand, not in Git).
  # Dashboards, data sources and the admin user are provisioned from this
  # repository/the Secret, so the new database starts empty without losing
  # managed state.
  grafana.ini:
    database:
      type: postgres
      host: yb-tservers.yugabyte.svc.cluster.local:5433
      name: grafana
      user: grafana
      ssl_mode: disable
    # Let the Homepage dashboard at glem.men embed Grafana panels (the WAN
    # traffic graph). Embedding needs allow_embedding, and anonymous Viewer
    # access is what lets the panel render for visitors who are not logged in.
    # Note: this makes all dashboards readable by anyone who can reach Grafana.
    security:
      allow_embedding: true
    auth.anonymous:
      enabled: true
      org_role: Viewer

  # Grafana's state lives in YugabyteDB; the local volume is only used for
  # plugins and generated files. An emptyDir lets both replicas run without a
  # ReadWriteOnce volume, and plugins come from the image.
  persistence:
    enabled: false

  # Grafana resources
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 4
      memory: 2Gi

  # Ingress configuration
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.glem.men

  # Additional data sources. Thanos Query includes the live Prometheus sidecar
  # and the object-store blocks, so it serves both recent and long-term data.
  # It is the only Prometheus-compatible data source: the chart's built-in
  # Prometheus data source is disabled below and removed from Grafana's
  # database with deleteDatasources.
  additionalDataSources:
    - name: Thanos
      type: prometheus
      uid: thanos
      access: proxy
      url: http://thanos-query.monitoring.svc.cluster.local:9090
      isDefault: true
      jsonData:
        timeInterval: 30s
        prometheusType: Thanos

  # The built-in Prometheus data source is no longer provisioned. Delete it
  # from Grafana's database as well, since all dashboards query Thanos.
  deleteDatasources:
    - name: Prometheus
      orgId: 1

  # Dashboards whose ConfigMap carries the grafana_folder annotation are
  # written into a subdirectory of the sidecar's dashboard volume; the file
  # provider's foldersFromFilesStructure option turns those directories into
  # Grafana folders. The Thanos, Node Exporter, UniFi Poller and Kubernetes
  # dashboards use this to stay grouped by topic. Dashboards without the
  # annotation stay at the root of the volume, which Grafana provisions into
  # the root (General) level.
  sidecar:
    datasources:
      # Only one data source can be the default; Thanos is it. Disable the
      # chart's built-in Prometheus data source so Thanos is the only
      # Prometheus-compatible source.
      defaultDatasourceEnabled: false
      isDefaultDatasource: false
    dashboards:
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true

# Alertmanager configuration
alertmanager:
  enabled: true
  replicas: 1
  # Alertmanager is the only alerting path. Prometheus evaluates the
  # PrometheusRule objects and sends firing alerts here; Grafana is only used
  # for dashboards and for displaying Alertmanager alerts.
  config:
    global:
      resolve_timeout: 5m
      smtp_smarthost: smtp.gmail.com:587
      smtp_from: noreply@blalange.org
      smtp_auth_username: noreply@blalange.org
      # The password is in the hand-created `alertmanager-smtp` Secret, mounted
      # by alertmanagerSpec.secrets below. Keep it out of Git.
      smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/auth-password
      smtp_require_tls: true
    inhibit_rules:
      - source_matchers:
          - 'severity = critical'
        target_matchers:
          - 'severity =~ warning|info'
        equal:
          - 'namespace'
          - 'alertname'
      - source_matchers:
          - 'severity = warning'
        target_matchers:
          - 'severity = info'
        equal:
          - 'namespace'
          - 'alertname'
      - source_matchers:
          - 'alertname = InfoInhibitor'
        target_matchers:
          - 'severity = info'
        equal:
          - 'namespace'
      - target_matchers:
          - 'alertname = InfoInhibitor'
    route:
      group_by: ['namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: email
      routes:
        - receiver: 'null'
          matchers:
            - alertname = "Watchdog"
    receivers:
      - name: email
        email_configs:
          - to: hexahigh0@gmail.com
            send_resolved: true
      - name: 'null'
    templates:
      - '/etc/alertmanager/config/*.tmpl'
  # Exposed through Traefik; the wildcard certificate is served from Traefik's
  # default TLS store, so no per-Ingress TLS secret is needed.
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - alerts.glem.men
    paths:
      - /
    pathType: Prefix
  alertmanagerSpec:
    # Used for the "View in Alertmanager" links in notifications and for
    # generated URLs in the UI.
    externalUrl: https://alerts.glem.men
    # Mounted at /etc/alertmanager/secrets/alertmanager-smtp; referenced by
    # smtp_auth_password_file above.
    secrets:
      - alertmanager-smtp
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: monitoring
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 3Gi

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

# Node exporter - collects hardware and OS metrics
nodeExporter:
  enabled: true

# Adds the Kubernetes node name as a 'node' label to every node-exporter metric,
# so PromQL can query per node (the default instance label is just the pod IP).
# The subchart is configured under its own name, not under nodeExporter.
prometheus-node-exporter:
  prometheus:
    monitor:
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
          action: replace

# Kube-state-metrics - collects Kubernetes object state
kubeStateMetrics:
  enabled: true

# Keep the chart's default apiserver bucket filter and drop the high-cardinality
# watch/cache/body/response/storage-list metrics that no dashboard or alert
# uses. This removes roughly 100k series.
# Defining metricRelabelings replaces the chart's list, so the chart's existing
# noisy-bucket rule is repeated here.
kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      - action: drop
        regex: '(etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?'
        sourceLabels:
          - __name__
          - le
      - action: drop
        regex: "apiserver_watch_.*"
        sourceLabels:
          - __name__
      - action: drop
        regex: "apiserver_(request_body_size_bytes|response_sizes|storage_list_duration_seconds).*"
        sourceLabels:
          - __name__

# Scrape cAdvisor at the same 30s resolution as the rest of the cluster. The
# chart default is 10s, which is a large share of the sample volume.
kubelet:
  serviceMonitor:
    cAdvisorInterval: 30s

# Talos binds the controller-manager, scheduler and kube-proxy metrics
# endpoints to localhost, so Prometheus can never scrape them. Stop creating
# the unusable targets; the matching alert groups are disabled below.
kubeControllerManager:
  serviceMonitor:
    enabled: false
kubeScheduler:
  serviceMonitor:
    enabled: false
kubeProxy:
  serviceMonitor:
    enabled: false

# Prometheus operator
prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Default rules - pre-configured alerts
defaultRules:
  create: true
  disabled:
    # Disabling the Alertname removes the whole group, including the matching
    # "InstanceUnreachable" alert that otherwise fires permanently on Talos.
    KubeControllerManagerDown: true
    KubeSchedulerDown: true
    KubeProxyDown: true
  rules:
    alertmanager: true
    etcd: true
    configReloaders: true
    general: true
    k8s: true
    kubeApiserverAvailability: true
    # The burnrate group evaluates 1d/3d rate windows every 30s and takes ~8s
    # on average over the high-cardinality apiserver metrics. The SLO alerts
    # depend on it, so both are disabled together.
    kubeApiserverBurnrate: false
    kubeApiserverSlos: false
    kubelet: true
    kubeProxy: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeSchedulerAlerting: true
    kubeSchedulerRecording: true
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true

# Additional scrape configs (example for custom services)
# prometheus:
#   prometheusSpec:
#     additionalScrapeConfigs:
