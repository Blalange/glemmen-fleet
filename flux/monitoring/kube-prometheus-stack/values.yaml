# kube-prometheus-stack configuration
# Provides Prometheus, Grafana, Alertmanager, and exporters

# Prometheus configuration
prometheus:
  prometheusSpec:
    replicas: 1
    # Prometheus is a StatefulSet: its updateStrategy only supports RollingUpdate
    # or OnDelete (the CRD rejects Recreate). With one replica the old pod is
    # terminated before the new one is created, so the RWO volume is never
    # attached to two pods at once.
    # Scrape configuration
    scrapeInterval: 15s

    # Thanos identifies uploaded blocks by their Prometheus external labels.
    externalLabels:
      cluster: glemmen

    # Storage configuration
    # Keep the local volume below the 20Gi budget: Prometheus deletes the
    # oldest blocks as soon as the block directory reaches 15GiB (the WAL and
    # head chunks live on top of that). Older samples stay queryable through
    # Thanos, which uploads blocks to object storage before they are deleted.
    retention: 30d
    retentionSize: 15GiB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: monitoring
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

    # Ship completed TSDB blocks to the Thanos object store (the `thanos`
    # bucket served by the rclone S3 bridge) and expose the local Prometheus
    # through the Thanos Store API.
    thanos:
      image: quay.io/thanos/thanos:v0.42.4
      objectStorageConfig:
        existingSecret:
          name: thanos-objstore-config
          key: objstore.yml
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi

    # Resource limits
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi

    # Service monitors selector - match all
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

    # Enable monitoring of all namespaces
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}

  # Headless service used by Thanos Query to discover the sidecar's gRPC
  # Store API (port 10901), plus its ServiceMonitor.
  thanosService:
    enabled: true
  thanosServiceMonitor:
    enabled: true

# Grafana configuration
grafana:
  enabled: true
  replicas: 1

  # Grafana mounts a ReadWriteOnce volume (monitoring-grafana), so a rolling
  # update can deadlock: the new pod cannot attach the volume while the old pod
  # still holds it (Multi-Attach error). Recreate terminates the old pod first.
  # rollingUpdate must be explicitly null, otherwise the API rejects the change
  # on the existing Deployment (spec.strategy.rollingUpdate is Forbidden when
  # type is Recreate).
  updateStrategy:
    type: Recreate
    rollingUpdate: null

  # Use secret for admin password
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  # Let the Homepage dashboard at glem.men embed Grafana panels (the WAN
  # traffic graph). Embedding needs allow_embedding, and anonymous Viewer
  # access is what lets the panel render for visitors who are not logged in.
  # Note: this makes all dashboards readable by anyone who can reach Grafana.
  grafana.ini:
    security:
      allow_embedding: true
    auth.anonymous:
      enabled: true
      org_role: Viewer

  # Persistence for dashboards
  persistence:
    enabled: true
    storageClassName: monitoring
    size: 2Gi
    existingClaim: monitoring-grafana

  # Grafana resources
  resources:
    requests:
      cpu: 2
      memory: 1Gi
    limits:
      cpu: 4
      memory: 2Gi

  # Ingress configuration
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.glem.men

  # Additional data sources. Thanos Query includes the live Prometheus sidecar
  # and the object-store blocks, so dashboards can use it for ranges beyond the
  # local retention window. The built-in Prometheus data source stays the
  # default; select "Thanos" in a dashboard's data source picker for old data.
  additionalDataSources:
    - name: Thanos
      type: prometheus
      uid: thanos
      access: proxy
      url: http://thanos-query.monitoring.svc.cluster.local:9090
      jsonData:
        timeInterval: 30s

# Alertmanager configuration
alertmanager:
  enabled: true
  replicas: 1
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: monitoring
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 3Gi

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

# Node exporter - collects hardware and OS metrics
nodeExporter:
  enabled: true

# Adds the Kubernetes node name as a 'node' label to every node-exporter metric,
# so PromQL can query per node (the default instance label is just the pod IP).
# The subchart is configured under its own name, not under nodeExporter.
prometheus-node-exporter:
  prometheus:
    monitor:
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
          action: replace

# Kube-state-metrics - collects Kubernetes object state
kubeStateMetrics:
  enabled: true

# Prometheus operator
prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Default rules - pre-configured alerts
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: true
    configReloaders: true
    general: true
    k8s: true
    kubeApiserverAvailability: true
    kubeApiserverSlos: true
    kubelet: true
    kubeProxy: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeSchedulerAlerting: true
    kubeSchedulerRecording: true
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true

# Additional scrape configs (example for custom services)
# prometheus:
#   prometheusSpec:
#     additionalScrapeConfigs:
#       - job_name: 'custom-service'
#         static_configs:
#           - targets: ['service.namespace.svc.cluster.local:8080']
