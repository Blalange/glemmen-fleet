apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - release.yaml
configMapGenerator:
  - name: kube-prometheus-stack-values
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true
  # Without the fixed name (no hash suffix) the HelmRelease would not notice
  # value changes unless the generated ConfigMap is watched by the controller.
  labels:
    reconcile.fluxcd.io/watch: Enabled
