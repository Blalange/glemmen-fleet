# prometheus-smartctl-exporter - S.M.A.R.T. disk health metrics (privileged).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community-smartctl
spec:
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: smartctl-exporter
spec:
  interval: 1h
  chart:
    spec:
      chart: prometheus-smartctl-exporter
      version: 0.17.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community-smartctl
  valuesFrom:
    - kind: ConfigMap
      name: smartctl-exporter-values
      valuesKey: values.yaml
