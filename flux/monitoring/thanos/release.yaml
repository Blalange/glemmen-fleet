# Thanos Query/Store Gateway/Compactor for long-term Prometheus metrics.
# Prometheus itself runs the sidecar (see ../kube-prometheus-stack/values.yaml)
# and uploads blocks to the `thanos` bucket on the rclone S3 bridge.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: thanos-community
spec:
  interval: 1h
  url: https://thanos-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: thanos
spec:
  interval: 1h
  timeout: 15m
  # The chart ships a PrometheusRule and ServiceMonitors, so the
  # kube-prometheus-stack CRDs must exist first.
  dependsOn:
    - name: kube-prometheus-stack
  chart:
    spec:
      chart: thanos
      version: 0.47.2
      sourceRef:
        kind: HelmRepository
        name: thanos-community
  valuesFrom:
    - kind: ConfigMap
      name: thanos-values
      valuesKey: values.yaml
