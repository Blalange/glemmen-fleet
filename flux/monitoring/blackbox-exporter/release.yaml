# Blackbox exporter for synthetic checks of the API VIP, ingress VIP, DNS and
# TCP reachability. Probe CRs live in flux/monitoring/resources/probes/.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community-blackbox
  namespace: monitoring
spec:
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: prometheus-blackbox-exporter
      version: 11.21.3
      sourceRef:
        kind: HelmRepository
        name: prometheus-community-blackbox
        namespace: monitoring
  valuesFrom:
    - kind: ConfigMap
      name: blackbox-exporter-values
      valuesKey: values.yaml
