# Energisjappa (backend/admin/postgres), Longhorn volumes.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: energisjappa
  namespace: flux-system
spec:
  # suspended until the Longhorn volumes are restored (migration step 7), resume via flux/manage.sh
  suspend: true
  interval: 1h
  retryInterval: 2m
  path: ./energisjappa
  prune: true
  wait: true
  targetNamespace: energisjappa
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
