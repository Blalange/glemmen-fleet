# Browsertrix web archiving, served at https://browsertrix.glem.men.
#
# Secrets are created by hand and never committed; see README.md for the exact
# Secret and first-run/import commands.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: browsertrix
resources:
  - release.yaml
  - ingress.yaml
configMapGenerator:
  - name: browsertrix-values
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true
