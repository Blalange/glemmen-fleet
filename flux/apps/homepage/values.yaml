# Homepage (https://gethomepage.dev) - dashboard for the Glemmen cluster,
# served at https://glem.men. Kubernetes, Longhorn and Prometheus stats are
# read in-cluster; Grafana stats come from the Grafana API.
#
# Homepage reads credentials from two pre-created Secrets in this namespace:
#
#   homepage-grafana  Grafana admin user/password    (keys: username, password)
#   unpoller-unifi    UniFi controller user/password (keys: username, password)
#
# Create them before Fleet rolls out the bundle by copying the existing values:
#
#   kubectl -n homepage create secret generic homepage-grafana \
#     --from-literal=username=admin \
#     --from-literal=password="$(kubectl -n monitoring get secret grafana-admin \
#       -o jsonpath='{.data.admin-password}' | base64 -d)"
#
#   kubectl -n homepage create secret generic unpoller-unifi \
#     --from-literal=username="$(kubectl -n monitoring get secret unpoller-unifi \
#       -o jsonpath='{.data.username}' | base64 -d)" \
#     --from-literal=password="$(kubectl -n monitoring get secret unpoller-unifi \
#       -o jsonpath='{.data.password}' | base64 -d)"

# The chart (2.1.0) still pins Homepage v1.2.0, whose Grafana widget cannot
# read Alertmanager alerts. v2.3.0 supports 'version: 2' with
# 'alerts: alertmanager' below.
image:
  tag: v2.3.0

# ClusterRole/ClusterRoleBinding and ServiceAccount for the Kubernetes widget
# (nodes, pods and metrics.k8s.io). metrics-server is deployed by
# flux/infrastructure/metrics-server, so node CPU and memory metrics work.
enableRbac: true
serviceAccount:
  create: true

# Two replicas so the dashboard stays available when one node fails. Homepage is
# stateless (config comes from ConfigMaps), so both can serve and the required
# anti-affinity below keeps them on different machines.
controller:
  replicas: 2
  strategy: RollingUpdate
  rollingUpdate:
    surge: 1
    unavailable: 0
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: homepage
            app.kubernetes.io/instance: homepage
        topologyKey: kubernetes.io/hostname

# Traefik terminates TLS with the *.glem.men wildcard certificate, which also
# covers the apex domain.
ingress:
  main:
    enabled: true
    ingressClassName: traefik
    hosts:
      - host: glem.men
        paths:
          - path: /
            pathType: Prefix

# HOMEPAGE_ALLOWED_HOSTS must list every Host header Homepage accepts. The pod
# IP is included so requests that bypass the Ingress (port-forward) still work.
env:
  - name: MY_POD_IP
    valueFrom:
      fieldRef:
        fieldPath: status.podIP
  - name: HOMEPAGE_ALLOWED_HOSTS
    value: "glem.men,$(MY_POD_IP):3000"
  - name: HOMEPAGE_VAR_GRAFANA_USER
    valueFrom:
      secretKeyRef:
        name: homepage-grafana
        key: username
  - name: HOMEPAGE_VAR_GRAFANA_PASSWORD
    valueFrom:
      secretKeyRef:
        name: homepage-grafana
        key: password
  - name: HOMEPAGE_VAR_UNIFI_USER
    valueFrom:
      secretKeyRef:
        name: unpoller-unifi
        key: username
  - name: HOMEPAGE_VAR_UNIFI_PASSWORD
    valueFrom:
      secretKeyRef:
        name: unpoller-unifi
        key: password

# Static files from the homepage-assets ConfigMap (see ../assets) are mounted
# under /app/public so Homepage serves them as /logo.svg, /background.webp and
# /about.html, plus custom.css/custom.js at /app/config. The chart's default
# emptyDir for /app/config/logs is merged in by Helm.
persistence:
  logo:
    enabled: true
    type: configMap
    name: homepage-assets
    mountPath: /app/public/logo.svg
    subPath: logo.svg
    readOnly: true
  background:
    enabled: true
    type: configMap
    name: homepage-assets
    mountPath: /app/public/background.webp
    subPath: background.webp
    readOnly: true
  about:
    enabled: true
    type: configMap
    name: homepage-assets
    mountPath: /app/public/about.html
    subPath: about.html
    readOnly: true
  custom-css:
    enabled: true
    type: configMap
    name: homepage-assets
    mountPath: /app/config/custom.css
    subPath: custom.css
    readOnly: true
  custom-js:
    enabled: true
    type: configMap
    name: homepage-assets
    mountPath: /app/config/custom.js
    subPath: custom.js
    readOnly: true

# Homepage bakes settings.yaml into static HTML at image build time. Hitting
# /api/revalidate as the startup probe regenerates that HTML once the pod is
# up, so the mounted settings (layout, background, logo, ...) apply without
# anyone having to click the refresh icon. The other probes stay TCP.
probes:
  startup:
    enabled: true
    custom: true
    spec:
      httpGet:
        path: /api/revalidate
        port: http
      periodSeconds: 5
      timeoutSeconds: 10
      failureThreshold: 60

config:
  # Use the ServiceAccount above instead of a kubeconfig file.
  kubernetes:
    mode: cluster

  disableIndexing: true

  # The links live under services instead.
  bookmarks: []

  settings:
    title: Glemmen K8S cluster
    description: Dashboard for 2ITA sitt Kubernetes-cluster
    theme: dark
    color: slate
    # 'clean' keeps the header fully transparent (no fill, border or blur);
    # assets/custom.css pushes the cluster stats to the right edge.
    headerStyle: clean
    useEqualHeights: true
    hideVersion: true
    disableIndexing: true
    language: nb-NO
    target: _blank
    # Blossom wallpaper served by Homepage itself (homepage-assets ConfigMap);
    # hotlinking imgur is unreliable because browsers get a consent page.
    # The image stays sharp, 'opacity' only controls how much of it shows
    # through the dark overlay. The frosted glass effect is cardBlur (below)
    # plus the styling in assets/custom.css.
    background:
      image: /background.webp
      opacity: 50
    # Blur the service cards so the background shows through them like frosted
    # glass. The header is 'clean' and stays transparent.
    cardBlur: md
    # Longhorn has no public ingress, so the widget talks to the in-cluster
    # frontend service directly.
    providers:
      longhorn:
        url: http://longhorn-frontend.longhorn-system.svc.cluster.local
    layout:
      - Tjenester og lenker:
          style: row
          columns: 4
      - Cluster:
          style: row
          columns: 2
      - Noder:
          style: row
          columns: 3
      - Nettverk:
          style: row
          columns: 1

  widgets:
    # Served from the homepage-assets ConfigMap mounted at /app/public/logo.svg.
    - logo:
        icon: /logo.svg
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: false
          label: Cluster
        nodes:
          show: false
          cpu: true
          memory: true
          showLabel: true
    - longhorn:
        expanded: true
        total: true
        labels: false
        nodes: false

  services:
    # Apps, monitoring and links share one section now. Apps come first, then
    # the monitoring stack and external tools. The group is laid out as a
    # four-column row in config.settings.layout below.
    - Tjenester og lenker:
        - WebODM:
            icon: drone.png
            href: https://webodm.glem.men
            description: Fotogrammetri og dronekart
        - Energisjappa:
            icon: terminal.png
            href: https://energisjappa.glem.men
            description: Butikkterminal og administrasjon
        - Frigate:
            icon: frigate.png
            href: https://frigate.glem.men
            description: Kameraovervåking og opptak
        - Snipe-IT:
            icon: snipe-it.png
            href: https://snipe.glem.men
            description: Inventar og lån av IT-utstyr
        - Pterodactyl:
            icon: pterodactyl.png
            href: https://panel.glem.men
            description: Spillpanel og serveradministrasjon
        - Grafana:
            icon: grafana.png
            href: https://grafana.glem.men
            description: Dashboards, datasources og varsler
            widget:
              type: grafana
              # Grafana 10.4+ needs version 2, and kube-prometheus-stack
              # provisions an Alertmanager datasource named "alertmanager".
              version: 2
              alerts: alertmanager
              url: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local
              username: "{{HOMEPAGE_VAR_GRAFANA_USER}}"
              password: "{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}"
        - Prometheus:
            icon: prometheus.png
            href: https://grafana.glem.men/explore
            description: Metrikk og scrape targets
            widget:
              type: prometheus
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        - Longhorn:
            icon: longhorn.png
            href: https://grafana.glem.men/d/ozk-lh-mon/longhorn-monitoring-backups
            description: Lagring, volumer og backups
            widget:
              type: prometheusmetric
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
              metrics:
                - label: Kapasitet
                  query: sum(longhorn_disk_capacity_bytes)
                  format:
                    type: bytes
                - label: Brukt
                  query: sum(longhorn_disk_usage_bytes)
                  format:
                    type: bytes
        - UniFi:
            icon: unifi.png
            href: https://unifi.glem.men
            description: Nettverkskontroller og tilkoblede klienter
            widget:
              type: unifi
              url: https://unifi.glem.men
              username: "{{HOMEPAGE_VAR_UNIFI_USER}}"
              password: "{{HOMEPAGE_VAR_UNIFI_PASSWORD}}"
        - Rancher:
            icon: rancher.png
            href: https://rancher.blalange.org
            description: Administrasjon av clusteret
        - GitHub:
            icon: github.png
            href: https://github.com/Blalange/glemmen-fleet
            description: Konfigurasjonen for clusteret
        - Grafana-alarmer:
            icon: alertmanager.png
            href: https://grafana.glem.men/alerting/list
            description: Aktive alarmer og varsler
    # Cluster totals (the same queries as the Cluster Specs Grafana dashboard)
    # plus the live CPU/RAM/network usage card.
    - Cluster:
        - Maskinvare:
            icon: kubernetes.png
            href: https://grafana.glem.men/d/glemmen-cluster-specs/cluster-specs
            description: Maskiner, kjerner, minne og rådisk før RAID
            widget:
              type: prometheusmetric
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
              metrics:
                - label: Maskiner
                  query: count(node_uname_info)
                  format:
                    type: number
                    options:
                      maximumFractionDigits: 0
                - label: Kjerner
                  query: count(node_cpu_seconds_total{mode="idle"})
                  format:
                    type: number
                    options:
                      maximumFractionDigits: 0
                - label: Minne
                  query: sum(node_memory_MemTotal_bytes)
                  format:
                    type: bytes
                - label: Rådisk
                  query: >-
                    sum(max by (node, serial_number) (
                      smartctl_device_capacity_bytes{device!~"^(loop|ram|sr|fd|dm-|zram|zd|nbd|rbd|drbd)[0-9]+$"}
                      * on (node, device) group_left (serial_number, model_name)
                        smartctl_device{
                          device!~"^(loop|ram|sr|fd|dm-|zram|zd|nbd|rbd|drbd)[0-9]+$",
                          model_name!="IET VIRTUAL-DISK",
                          model_name!~"(?i).*(perc|megaraid|serveraid|logical volume|virtual disk).*"
                        }
                    ))
                  format:
                    type: bytes
        - Bruk:
            icon: prometheus.png
            href: https://grafana.glem.men/d/rYdddlPWk/node-exporter-full
            description: CPU, RAM og nettverk akkurat nå
            widget:
              type: prometheusmetric
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
              metrics:
                - label: CPU
                  query: 100 * (1 - avg(irate(node_cpu_seconds_total{mode="idle"}[2m])))
                  format: &percent
                    type: percent
                    options:
                      maximumFractionDigits: 1
                - label: RAM
                  query: 100 * (1 - sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes))
                  format: *percent
                - label: Ned
                  query: >-
                    sum(
                      irate(node_network_receive_bytes_total{device!~"lo|veth.*|br.*|cali.*|flannel.*|cni.*|docker.*|kube.*|nodelocaldns|lhnet.*|wt.*|tun.*|tap.*|wg.*"}[2m])
                      unless on(device, node) label_replace(node_bonding_slaves, "device", "$1", "slave", "(.+)")
                    )
                  format: &byterate
                    type: byterate
                - label: Opp
                  query: >-
                    sum(
                      irate(node_network_transmit_bytes_total{device!~"lo|veth.*|br.*|cali.*|flannel.*|cni.*|docker.*|kube.*|nodelocaldns|lhnet.*|wt.*|tun.*|tap.*|wg.*"}[2m])
                      unless on(device, node) label_replace(node_bonding_slaves, "device", "$1", "slave", "(.+)")
                    )
                  format: *byterate
    # Per-node CPU/RAM/network from node-exporter via Prometheus. The queries
    # filter on the 'node' label, which kube-prometheus-stack attaches to every
    # node-exporter metric through the ServiceMonitor relabeling. Virtual
    # interfaces are excluded and bond slaves are dropped so bonded nodes are
    # not counted twice.
    #
    # Rates use irate() (last two samples) instead of rate(): when a
    # node-exporter pod restarts it gets a new instance IP, which creates new
    # series, and rate() over a window longer than the series history reports
    # badly wrong values (e.g. 70% CPU instead of 20%) until the window fills.
    - Noder:
        - glemmen130:
            icon: linux.png
            href: https://grafana.glem.men/d/rYdddlPWk/node-exporter-full?var-job=node-exporter&var-nodename=glemmen130
            description: CPU, RAM og nettverk
            widget:
              type: prometheusmetric
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
              metrics:
                - label: CPU
                  query: 100 * (1 - avg(irate(node_cpu_seconds_total{mode="idle",node="glemmen130"}[2m])))
                  format: *percent
                - label: RAM
                  query: 100 * (1 - node_memory_MemAvailable_bytes{node="glemmen130"} / node_memory_MemTotal_bytes{node="glemmen130"})
                  format: *percent
                - label: Ned
                  query: >-
                    sum(
                      irate(node_network_receive_bytes_total{node="glemmen130",device!~"lo|veth.*|br.*|cali.*|flannel.*|cni.*|docker.*|kube.*|nodelocaldns|lhnet.*|wt.*|tun.*|tap.*|wg.*"}[2m])
                      unless on(device, node) label_replace(node_bonding_slaves, "device", "$1", "slave", "(.+)")
                    )
                  format: *byterate
                - label: Opp
                  query: >-
                    sum(
                      irate(node_network_transmit_bytes_total{node="glemmen130",device!~"lo|veth.*|br.*|cali.*|flannel.*|cni.*|docker.*|kube.*|nodelocaldns|lhnet.*|wt.*|tun.*|tap.*|wg.*"}[2m])
                      unless on(device, node) label_replace(node_bonding_slaves, "device", "$1", "slave", "(.+)")
                    )
                  format: *byterate
        - glemmen150:
            icon: linux.png
            href: https://grafana.glem.men/d/rYdddlPWk/node-exporter-full?var-job=node-exporter&var-nodename=glemmen150
