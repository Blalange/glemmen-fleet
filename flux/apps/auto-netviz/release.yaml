apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: auto-netviz
spec:
  type: oci
  interval: 1h
  url: oci://ghcr.io/blalange/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: auto-netviz
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: auto-netviz
      version: "0.1.2"
      sourceRef:
        kind: HelmRepository
        name: auto-netviz
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  valuesFrom:
    - kind: ConfigMap
      name: auto-netviz-values
      valuesKey: values.yaml
