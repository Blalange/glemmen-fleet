apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: auto-netviz
resources:
  - release.yaml
configMapGenerator:
  - name: auto-netviz-values
    files:
      - values.yaml
  - name: auto-netviz-manual
    files:
      - manual/00-site.yaml
      - manual/10-device-types.yaml
      - manual/20-racks.yaml
      - manual/30-networks.yaml
      - manual/40-devices.yaml
generatorOptions:
  disableNameSuffixHash: true
