device_types:
  - id: dell-poweredge-r250
    manufacturer: Dell
    model: PowerEdge R250
    u_height: 1
    depth: full
    role_hint: server
    part_number: R250
    airflow: front-to-rear
    weight_kg: 12.48
    description: 1U single-socket rack server used for 1xx/2xx servers and Talos control planes.
    faceplate:
      front:
        - kind: drive_bays
          form_factor: "3.5"
          count: 4
          prefix: "Drive "
      rear:
