schema_version: 1

module_types:
  - id: generic-12tb-sas-hdd
    manufacturer: Generic
    model: 12 TB SAS HDD
    profile: storage-disk
    bay_type: drive-3-5
    description: Generic 3.5-inch 12 TB SAS enterprise hard drive.
  - id: ibm-storwize-v5000-800w-psu
    manufacturer: IBM
    model: Storwize V5000 800W PSU
    profile: power-supply
