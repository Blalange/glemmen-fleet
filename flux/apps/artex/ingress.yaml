# Traefik terminates TLS with the *.glem.men wildcard certificate and forwards
# to the in-cluster Authentik proxy outpost. The outpost authenticates the
# request against the `ARTEX` proxy provider and proxies it to ARTEX on 8787.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: artex
  labels:
    app.kubernetes.io/name: artex
    app.kubernetes.io/instance: artex
    app.kubernetes.io/part-of: artex
spec:
  ingressClassName: traefik
  rules:
    - host: artex.glem.men
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: authentik-outpost
                port:
                  number: 9000
