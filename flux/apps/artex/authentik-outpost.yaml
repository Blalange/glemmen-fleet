# In-cluster Authentik proxy outpost for ARTEX.
#
# The outpost object `glemmen-artex` is created through the Authentik API (see
# README.md); it is deliberately not managed by an Authentik service
# connection. Put its token in the hand-created `artex-authentik-outpost`
# Secret:
#
#   kubectl -n artex create secret generic artex-authentik-outpost \
#     --from-literal=token='...'
#
# The outpost connects outbound to https://auth.blalange.org and proxies the
# request to the internal host configured on the `ARTEX` proxy provider
# (http://artex.artex.svc.cluster.local:8787).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-outpost
  labels:
    app.kubernetes.io/name: authentik-outpost
    app.kubernetes.io/instance: artex
    app.kubernetes.io/part-of: artex
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik-outpost
      app.kubernetes.io/instance: artex
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-outpost
        app.kubernetes.io/instance: artex
        app.kubernetes.io/part-of: artex
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: outpost
          image: ghcr.io/goauthentik/proxy:2026.8.5
          imagePullPolicy: IfNotPresent
          env:
            - name: AUTHENTIK_HOST
              value: https://auth.blalange.org
            - name: AUTHENTIK_HOST_BROWSER
              value: https://auth.blalange.org
            - name: AUTHENTIK_INSECURE
              value: "false"
            - name: AUTHENTIK_LOG_LEVEL
              value: info
            - name: AUTHENTIK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: artex-authentik-outpost
                  key: token
          ports:
            - name: http
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /outpost.goauthentik.io/ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /outpost.goauthentik.io/ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-outpost
  labels:
    app.kubernetes.io/name: authentik-outpost
    app.kubernetes.io/instance: artex
    app.kubernetes.io/part-of: artex
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: authentik-outpost
    app.kubernetes.io/instance: artex
  ports:
    - name: http
      port: 9000
      targetPort: http
