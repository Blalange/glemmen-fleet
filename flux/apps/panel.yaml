# Panel (external endpoint, no local storage).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: panel
  namespace: flux-system
spec:
  # suspended until the Longhorn volumes are restored (migration step 7), resume via flux/manage.sh
  suspend: true
  interval: 1h
  retryInterval: 2m
  path: ./panel
  prune: true
  targetNamespace: panel
  sourceRef:
    kind: GitRepository
    name: flux-system
