# Homepage dashboard (Helm release under flux/apps/homepage).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homepage
  namespace: flux-system
spec:
  # suspended until the Longhorn volumes are restored (migration step 7), resume via flux/manage.sh
  suspend: true
  interval: 1h
  retryInterval: 2m
  path: ./flux/apps/homepage
  prune: true
  wait: true
  targetNamespace: homepage
  dependsOn:
    - name: homepage-assets
    - name: kube-prometheus-stack
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
