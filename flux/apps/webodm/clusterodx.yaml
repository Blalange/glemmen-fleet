# ClusterODX: NodeODX-API compatible front-end that distributes tasks to the
# NodeODX node(s). WebODM is configured to use it as its processing node.
#
# Service `clusterodx` - task API (3000), web UI (10000), telnet admin (8080)
# Service `node-odx-1` - alias; WebODM's start.sh adds its default processing
#                       node as `node-odx-1:3000`, so the alias makes the
#                       default work without manual UI configuration.
apiVersion: v1
kind: Service
metadata:
  name: clusterodx
spec:
  selector:
    app.kubernetes.io/name: clusterodx
  ports:
    - name: api
      port: 3000
      targetPort: api
    - name: web
      port: 10000
      targetPort: web
    - name: admin
      port: 8080
      targetPort: admin
---
apiVersion: v1
kind: Service
metadata:
  name: node-odx-1
spec:
  selector:
    app.kubernetes.io/name: clusterodx
  ports:
    - name: api
      port: 3000
      targetPort: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clusterodx
  labels:
    app.kubernetes.io/name: clusterodx
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: clusterodx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clusterodx
    spec:
      containers:
        - name: clusterodx
          image: webodm/clusterodx:1.5.9
          imagePullPolicy: IfNotPresent
          ports:
            - name: api
              containerPort: 3000
            - name: web
              containerPort: 10000
            - name: admin
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/www/data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
        # ClusterODX keeps its node list in memory, so re-register the NodeODX
        # node regularly (the telnet admin interface is line based; adding an
        # existing node is harmless).
        - name: register-nodeodx
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                printf 'NODE ADD nodeodx 3000\r\n' | nc -w 3 127.0.0.1 8080 >/dev/null 2>&1 || true
                sleep 120
              done
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
      volumes:
        - name: data
          emptyDir: {}
