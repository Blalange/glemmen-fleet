# WebODM web application + Celery worker. Both containers share the media
# volume (ReadWriteOnce is fine: they run in the same pod).
#
# The image entrypoints expect the database host `db`, the broker `broker` and
# the webapp hostname `webapp` (see the upstream docker-compose).
apiVersion: v1
kind: Service
metadata:
  name: webapp
spec:
  selector:
    app.kubernetes.io/name: webapp
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webodm-media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: webodm
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  labels:
    app.kubernetes.io/name: webapp
spec:
  replicas: 1
  # One ReadWriteOnce media volume: never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: webapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webapp
    spec:
      containers:
        - name: webapp
          image: webodm/webodm_webapp:3.3.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - >-
              service cron start && chmod +x /webodm/*.sh &&
              /bin/bash -c "/webodm/wait-for-postgres.sh db
              /webodm/wait-for-it.sh -t 0 broker:6379 -- /webodm/start.sh"
          env: &webapp-env
            - name: WO_HOST
              value: webodm.glem.men
            - name: WO_PORT
              value: "8000"
            - name: WO_DEBUG
              value: "NO"
            - name: WO_BROKER
              value: redis://broker:6379
            - name: WO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: webodm-secret-key
                  key: WO_SECRET_KEY
            - name: WO_DATABASE_HOST
              value: db
            - name: WO_DATABASE_NAME
              value: webodm_dev
            - name: WO_DATABASE_USER
              value: postgres
            - name: WO_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: webodm-db
                  key: password
            # WebODM adds `node-odx-1:3000` as its default processing node on
            # startup; the node-odx-1 Service points at ClusterODX.
            - name: WO_DEFAULT_NODES
              value: "1"
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
          volumeMounts:
            - name: media
              mountPath: /webodm/app/media
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
        - name: worker
          image: webodm/webodm_webapp:3.3.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - >-
              /webodm/wait-for-postgres.sh db
              /webodm/wait-for-it.sh -t 0 broker:6379 --
              /webodm/wait-for-it.sh -t 0 webapp:8000 -- /webodm/worker.sh start
          env: *webapp-env
          volumeMounts:
            - name: media
              mountPath: /webodm/app/media
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 4Gi
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: webodm-media
