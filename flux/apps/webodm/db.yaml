# PostgreSQL 18 database (webodm/webodm_db image). WebODM 4 dropped PostGIS.
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector:
    app.kubernetes.io/name: webodm-db
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webodm-db
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: webodm
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  labels:
    app.kubernetes.io/name: webodm-db
spec:
  replicas: 1
  # One ReadWriteOnce volume: never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: webodm-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webodm-db
    spec:
      initContainers:
        # Older releases used PGDATA=/var/lib/postgresql/data/pgdata. The 4.x
        # entrypoint expects the old PostgreSQL 9.5 cluster at the volume root
        # so its automatic 9.5 -> 18 upgrade can find it. Move it there once.
        - name: normalize-data-dir
          image: webodm/webodm_db:18
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              if [ -s /var/lib/postgresql/data/pgdata/PG_VERSION ] && [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
                find /var/lib/postgresql/data/pgdata -mindepth 1 -maxdepth 1 -exec mv -t /var/lib/postgresql/data {} +
                rmdir /var/lib/postgresql/data/pgdata
              fi
              # PostgreSQL refuses a data directory with group/world access.
              chmod 700 /var/lib/postgresql/data
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: db
          image: webodm/webodm_db:18
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: webodm_dev
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: webodm-db
                  key: password
          ports:
            - name: postgresql
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: webodm-db
