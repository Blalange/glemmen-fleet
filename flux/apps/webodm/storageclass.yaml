# Dedicated Longhorn StorageClass. One replica (volumes stay on one node),
# Retain so deleting a PVC never deletes the only copy of the projects.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: webodm
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  staleReplicaTimeout: "2880"
  fsType: "ext4"
