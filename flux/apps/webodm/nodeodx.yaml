# NodeODX processing workers (the WebODM/ODX successor of NodeODM).
#
# StatefulSet, not Deployment: ClusterODX addresses each worker individually
# (a task is submitted to one worker and its status is polled from that same
# worker - behind a load-balanced Service those polls would hit the wrong
# replica). The headless service gives every pod a stable DNS name
# (nodeodx-0.nodeodx-hl.webodm.svc.cluster.local, ...) and ClusterODX's
# registrar sidecar adds them all automatically, so:
#
#   To add/remove workers: change `replicas` below and push.
#
# Each worker gets its own /tmp scratch (emptyDir) and, like upstream ODX,
# processes up to 2 tasks at a time (raise with `--parallel_queue_processing`
# if the worker has the CPU/RAM). ODM tasks are CPU bound and use several
# threads, so keep workers on nodes with spare cores.
apiVersion: v1
kind: Service
metadata:
  name: nodeodx-hl
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: nodeodx
  ports:
    - name: api
      port: 3000
      targetPort: api
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nodeodx
  labels:
    app.kubernetes.io/name: nodeodx
spec:
  serviceName: nodeodx-hl
  replicas: 6
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: nodeodx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nodeodx
    spec:
      # Prefer to spread workers over different machines (soft: scaling beyond
      # the number of nodes still works).
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: nodeodx
                topologyKey: kubernetes.io/hostname
      containers:
        - name: nodeodx
          # NodeODX publishes no version tags; `latest` tracks the ODX releases.
          image: webodm/nodeodx:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: api
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /info
              port: api
            initialDelaySeconds: 15
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /info
              port: api
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - name: scratch
              mountPath: /tmp
          resources:
            requests:
              cpu: 4
              memory: 24Gi
            limits:
              cpu: 8
              memory: 24Gi
      volumes:
        - name: scratch
          emptyDir: {}
