# Celery broker (Valkey, matching the WebODM 4 upstream compose file).
apiVersion: v1
kind: Service
metadata:
  name: broker
spec:
  selector:
    app.kubernetes.io/name: webodm-broker
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broker
  labels:
    app.kubernetes.io/name: webodm-broker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: webodm-broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webodm-broker
    spec:
      containers:
        - name: broker
          image: valkey/valkey:9.1-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 256Mi
