apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webodm
spec:
  ingressClassName: traefik
  rules:
    - host: webodm.glem.men
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webapp
                port:
                  number: 8000
