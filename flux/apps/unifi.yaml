# UniFi controller endpoint (external, no local storage).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: unifi
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  path: ./unifi
  prune: true
  targetNamespace: unifi
  sourceRef:
    kind: GitRepository
    name: flux-system
