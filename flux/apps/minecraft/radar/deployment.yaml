# Minecraft Radar - Bedrock Dedicated Server. Pinned to the three worker nodes;
# glemmen50 is currently cordoned/offline, so it runs on glemmen60 or glemmen80.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft-radar
  labels:
    app.kubernetes.io/name: minecraft-radar
    app.kubernetes.io/instance: minecraft
    app.kubernetes.io/part-of: minecraft
spec:
  replicas: 1
  # One ReadWriteOnce world volume: never run two server pods at the same time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minecraft-radar
      app.kubernetes.io/instance: minecraft
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minecraft-radar
        app.kubernetes.io/instance: minecraft
        app.kubernetes.io/part-of: minecraft
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - glemmen50
                      - glemmen60
                      - glemmen80
      containers:
        - name: bedrock
          image: docker.io/itzg/minecraft-bedrock-server:2026.10.2
          imagePullPolicy: IfNotPresent
          env:
            - name: EULA
              value: "TRUE"
            - name: VERSION
              value: "LATEST"
            # Current Bedrock releases only support NetherNet. Clients use
            # TCP 19142 for signaling, then one of the UDP gameplay ports.
            - name: TRANSPORT
              value: "nethernet"
            - name: SERVER_PORT
              value: "19142"
            # NetherNet advertises these public UDP ports to clients. They must
            # match the Service and the UniFi port-forward range exactly.
            - name: SERVER_UDP_PORTS
              value: "109.247.229.146:19143-19158:19143-19158"
            - name: SERVER_NAME
              value: "Minecraft Radar"
            - name: LEVEL_NAME
              value: "Radar"
            - name: GAMEMODE
              value: "survival"
            - name: DIFFICULTY
              value: "normal"
            - name: ALLOW_CHEATS
              value: "false"
            - name: ONLINE_MODE
              value: "true"
            # The image enables the allow list by default; an empty list would
            # block every player.
            - name: ALLOW_LIST
              value: "false"
            - name: MAX_PLAYERS
              value: "10"
            # The image chowns /data as root, then runs the server as this user.
            - name: UID
              value: "1000"
            - name: GID
              value: "1000"
            - name: TZ
              value: "Europe/Oslo"
            - name: STOP_SERVER_ANNOUNCE_DELAY
              value: "30"
          ports:
            # NetherNet's TCP signaling listener. The UDP gameplay range
            # (19143-19158) is exposed by the Service without individual
            # containerPort declarations.
            - name: signaling
              containerPort: 19142
              protocol: TCP
          # The TCP signaling socket opens before the world is fully ready, so
          # wait for it on startup and use it for readiness/liveness. This is
          # transport-agnostic and avoids relying on the RakNet-only probe.
          startupProbe:
            tcpSocket:
              port: signaling
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: signaling
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: signaling
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minecraft-radar-data
