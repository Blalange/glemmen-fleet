# Minecraft Radar world and server.properties. The server is pinned to the
# worker nodes, but Ceph RBD volumes can attach to whichever of those nodes is
# running it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-radar-data-ceph
  labels:
    app.kubernetes.io/name: minecraft-radar
    app.kubernetes.io/instance: minecraft
    app.kubernetes.io/part-of: minecraft
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-rbd
  resources:
    requests:
      storage: 20Gi
