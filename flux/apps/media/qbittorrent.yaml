# qBittorrent with a gluetun WireGuard sidecar. Both containers share the pod
# network namespace, so gluetun's firewall is the kill switch for all torrent
# traffic and qBittorrent's Web UI is reached through the same pod IP.
#
# The WireGuard configuration is a hand-created Secret (not in Git):
#
#   kubectl -n media create secret generic qbittorrent-wireguard \
#     --from-file=wg0.conf=./Windscribe-Oslo-Rakfisk-WG.conf
#
# The supplied file's IPv6 address is removed in the runbook because the cluster
# and pod network are IPv4-only. The custom provider also requires the Endpoint
# line to contain an IPv4 address, so the Secret uses the resolved Windscribe
# address instead of the hostname; see README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  labels:
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/instance: qbittorrent
    app.kubernetes.io/part-of: media
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
      app.kubernetes.io/instance: qbittorrent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qbittorrent
        app.kubernetes.io/instance: qbittorrent
        app.kubernetes.io/part-of: media
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Create the shared directory layout before the apps start. The CSI
        # mount maps files to uid/gid 1000.
        - name: media-dirs
          image: busybox:1.37.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - mkdir -p /data/downloads/incomplete /data/media/movies /data/media/tv
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: media
              mountPath: /data
        # Native sidecar: gluetun starts before qBittorrent and stays running.
        # The readiness probe gates the main container until the tunnel is up.
        - name: gluetun
          image: qmcgaw/gluetun:v3.41.3
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          env:
            - name: VPN_SERVICE_PROVIDER
              value: custom
            - name: VPN_TYPE
              value: wireguard
            - name: TZ
              value: Europe/Oslo
            - name: LOG_LEVEL
              value: info
            - name: FIREWALL
              value: "on"
            - name: FIREWALL_INPUT_PORTS
              value: "8080"
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: 10.42.0.0/16,10.43.0.0/16,192.168.6.0/24
            - name: HEALTH_SERVER_ADDRESS
              value: ":9999"
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          ports:
            - name: health
              containerPort: 9999
          volumeMounts:
            - name: wireguard
              mountPath: /gluetun/wireguard/wg0.conf
              subPath: wg0.conf
              readOnly: true
            - name: tun
              mountPath: /dev/net/tun
          startupProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:5.3.0_v2.1.2-ls486
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: UMASK
              value: "002"
            - name: TZ
              value: Europe/Oslo
            - name: WEBUI_PORT
              value: "8080"
            - name: TORRENTING_PORT
              value: "6881"
          ports:
            - name: webui
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: webui
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: webui
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: media
          persistentVolumeClaim:
            claimName: media-data
        - name: wireguard
          secret:
            secretName: qbittorrent-wireguard
            defaultMode: 0400
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  labels:
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/instance: qbittorrent
    app.kubernetes.io/part-of: media
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/instance: qbittorrent
  ports:
    - name: http
      port: 8080
      targetPort: webui
