# Seerr 3.5.1 request manager. It uses YugabyteDB for its database and the
# Authentik proxy outpost for the edge login. Seerr still has its own Jellyfin
# login page after the proxy because stable Seerr has no native OIDC support;
# see README.md for the limitation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
  labels:
    app.kubernetes.io/name: seerr
    app.kubernetes.io/instance: seerr
    app.kubernetes.io/part-of: media
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: seerr
      app.kubernetes.io/instance: seerr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seerr
        app.kubernetes.io/instance: seerr
        app.kubernetes.io/part-of: media
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seerr
          image: ghcr.io/seerr-team/seerr:v3.5.1
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Europe/Oslo
            - name: PORT
              value: "5055"
            - name: CONFIG_DIRECTORY
              value: /app/config
            - name: DB_TYPE
              value: postgres
            - name: DB_HOST
              value: yb-tservers.yugabyte.svc.cluster.local
            - name: DB_PORT
              value: "5433"
            - name: DB_USER
              value: seerr
            - name: DB_NAME
              value: seerr
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: media-db
                  key: seerr-password
            - name: DB_USE_SSL
              value: "false"
            - name: LOG_LEVEL
              value: info
          ports:
            - name: http
              containerPort: 5055
          volumeMounts:
            - name: config
              mountPath: /app/config
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: seerr-config
---
apiVersion: v1
kind: Service
metadata:
  name: seerr
  labels:
    app.kubernetes.io/name: seerr
    app.kubernetes.io/instance: seerr
    app.kubernetes.io/part-of: media
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: seerr
    app.kubernetes.io/instance: seerr
  ports:
    - name: http
      port: 5055
      targetPort: http
