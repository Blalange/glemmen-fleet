# Configuration and metadata volumes for the media applications. They are small
# and should survive an application removal, so use three Longhorn replicas and
# Retain rather than the cluster's default one-replica class.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: media-config
provisioner: driver.longhorn.io
parameters:
  numberOfReplicas: "3"
  staleReplicaTimeout: "2880"
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
