# Per-application configuration. Every app keeps its SQLite database, config,
# API keys, logs and metadata on these volumes. Profilarr also caches the
# cloned profile databases and its own backups there. These are small,
# latency-sensitive volumes, so they live on the NVMe pool (`nvme-rbd`).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config-ceph
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nvme-rbd
  resources:
    requests:
      storage: 20Gi
---
