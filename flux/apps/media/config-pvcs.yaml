# Per-application configuration. Every app keeps its SQLite database, config,
# API keys, logs and metadata on these volumes. Profilarr also caches the
# cloned profile databases and its own backups there.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: media-config
  resources:
    requests:
      storage: 20Gi
---
