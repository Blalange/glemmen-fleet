# Per-application configuration. The *arr apps and Seerr keep their database in
# YugabyteDB; these volumes only hold config.xml, API keys, logs and metadata.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: media-config
  resources:
    requests:
      storage: 20Gi
---
