# Shared media library and download directory.
#
# `media-data` is the old SeaweedFS CSI volume. It is kept only until the copy
# to `media-data-ceph` has been verified and SeaweedFS is removed.
#
# `media-data-ceph` uses the CephFS fast tier, which supports ReadWriteMany and
# maps the volume root to the fsGroup (1000) used by Jellyfin, the LinuxServer
# *arr apps and qBittorrent. It is sized just above the current ~2.0 TiB library
# so it fits on the fast CMR OSDs until the bulk tier exists.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-data
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: seaweedfs-media
  resources:
    requests:
      storage: 2800Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-data-ceph
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: fast-fs
  resources:
    requests:
      storage: 2300Gi
