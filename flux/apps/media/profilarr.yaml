# Profilarr 2.3.1 - configuration management for Sonarr/Radarr. It syncs
# quality profiles, custom formats and media settings from a profile database
# (TRaSH Guides, Dictionarry, ...) into the Arr instances.
#
# Access goes through the Authentik proxy outpost, so Profilarr's own login is
# disabled (AUTH=off) and the app must never be exposed directly. The parser
# service only backs the custom-format/quality-profile testers; it is
# internal-only and has no Ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: profilarr
  labels:
    app.kubernetes.io/name: profilarr
    app.kubernetes.io/instance: profilarr
    app.kubernetes.io/part-of: media
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # A single SQLite database and config directory cannot be shared by two
  # pods. Recreate also avoids two instances running during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: profilarr
      app.kubernetes.io/instance: profilarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: profilarr
        app.kubernetes.io/instance: profilarr
        app.kubernetes.io/part-of: media
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: profilarr
          image: ghcr.io/dictionarry-hub/profilarr:2.3.1
          imagePullPolicy: IfNotPresent
          env:
            # Running as uid/gid 1000 (non-root mode) makes the entrypoint skip
            # its privilege operations; PUID/PGID are kept for clarity.
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: UMASK
              value: "002"
            - name: TZ
              value: Europe/Oslo
            # Authentik authenticates at the edge. Turn Profilarr's local login
            # off so it trusts the proxy; see README.md.
            - name: AUTH
              value: "off"
            # Required behind a reverse proxy for SvelteKit's origin checks.
            - name: ORIGIN
              value: https://profilarr.glem.men
            - name: PARSER_HOST
              value: profilarr-parser
            - name: PARSER_PORT
              value: "5000"
          ports:
            - name: http
              containerPort: 6868
          volumeMounts:
            - name: config
              mountPath: /config
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: profilarr-config
---
apiVersion: v1
kind: Service
metadata:
  name: profilarr
  labels:
    app.kubernetes.io/name: profilarr
    app.kubernetes.io/instance: profilarr
    app.kubernetes.io/part-of: media
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: profilarr
    app.kubernetes.io/instance: profilarr
  ports:
    - name: http
      port: 6868
      targetPort: http
---
# Parser used by the custom-format and quality-profile testers. It is optional
# for syncing, but cheap and keeps the testing features working.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: profilarr-parser
  labels:
    app.kubernetes.io/name: profilarr-parser
    app.kubernetes.io/instance: profilarr-parser
    app.kubernetes.io/part-of: media
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: profilarr-parser
      app.kubernetes.io/instance: profilarr-parser
  template:
    metadata:
      labels:
        app.kubernetes.io/name: profilarr-parser
        app.kubernetes.io/instance: profilarr-parser
        app.kubernetes.io/part-of: media
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: parser
          image: ghcr.io/dictionarry-hub/profilarr-parser:2.3.1
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Europe/Oslo
          ports:
            - name: http
              containerPort: 5000
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: profilarr-parser
  labels:
    app.kubernetes.io/name: profilarr-parser
    app.kubernetes.io/instance: profilarr-parser
    app.kubernetes.io/part-of: media
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: profilarr-parser
    app.kubernetes.io/instance: profilarr-parser
  ports:
    - name: http
      port: 5000
      targetPort: http
