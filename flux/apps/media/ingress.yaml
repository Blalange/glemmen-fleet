# TLS is terminated by Traefik using the existing *.glem.men wildcard
# certificate in kube-system. Only Jellyfin is routed directly; the other apps
# go through the Authentik proxy outpost so they are protected by SSO.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin
  labels:
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/instance: jellyfin
    app.kubernetes.io/part-of: media
spec:
  ingressClassName: traefik
  rules:
    - host: jellyfin.glem.men
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyfin
                port:
                  number: 8096
---
