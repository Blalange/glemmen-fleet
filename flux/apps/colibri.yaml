# Colibri (pinned to glemmen80) - Longhorn StorageClass/PVC must exist first.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: colibri
  namespace: flux-system
spec:
  # suspended until the Longhorn volumes are restored (migration step 7), resume via flux/manage.sh
  suspend: true
  interval: 1h
  retryInterval: 2m
  path: ./colibri
  prune: true
  wait: true
  targetNamespace: colibri
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
