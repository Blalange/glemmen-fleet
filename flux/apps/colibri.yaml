# Colibri (pinned to glemmen80) - Longhorn StorageClass/PVC must exist first.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: colibri
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  path: ./colibri
  prune: true
  # The 220Gi strict-local colibri volume is WaitForFirstConsumer and the
  # deployment is parked at 0 replicas; there is nothing to wait for.
  wait: false
  targetNamespace: colibri
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
