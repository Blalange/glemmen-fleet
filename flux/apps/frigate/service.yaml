apiVersion: v1
kind: Service
metadata:
  name: frigate
  labels:
    app.kubernetes.io/name: frigate
    app.kubernetes.io/instance: frigate
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frigate
    app.kubernetes.io/instance: frigate
  ports:
    # Authenticated UI and API (see docs.frigate.video/configuration/authentication).
    - name: http
      port: 8971
      targetPort: http
