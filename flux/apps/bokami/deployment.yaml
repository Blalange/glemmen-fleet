apiVersion: apps/v1
kind: Deployment
metadata:
  name: bokami
  labels:
    app.kubernetes.io/name: bokami
    app.kubernetes.io/instance: bokami
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # bokami-data-ceph is ReadWriteOnce and sessions are held in memory: never
  # run two pods at the same time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bokami
      app.kubernetes.io/instance: bokami
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bokami
        app.kubernetes.io/instance: bokami
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bokami
          image: ghcr.io/t0m0t0w/bokami:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: TZ
              value: Europe/Oslo
            - name: PORT
              value: "3000"
            - name: DATA_DIR
              value: "/app/data"
            - name: BOOKS_DIR
              value: "/app/books"
            - name: TRUST_PROXY
              value: "true"
            # Optional Secret ("bokami-secrets") for static passwords. When
            # absent, Bokami uses config.json / auto-generated passwords.
            - name: BOKAMI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bokami-secrets
                  key: reader-password
                  optional: true
            - name: BOKAMI_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bokami-secrets
                  key: admin-password
                  optional: true
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: books
              mountPath: /app/books
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bokami-data-ceph
        - name: books
          persistentVolumeClaim:
            claimName: bokami-books-ceph
        - name: tmp
          emptyDir: {}
