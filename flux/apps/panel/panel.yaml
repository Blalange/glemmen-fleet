# Serves panel.glem.men from a server outside the cluster. Traefik terminates
# TLS with the glem.men wildcard certificate and forwards to 192.168.6.68:80.
apiVersion: v1
kind: Service
metadata:
  name: panel
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 80
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: panel
  labels:
    kubernetes.io/service-name: panel
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 80
endpoints:
  - addresses:
      - 192.168.6.68
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: panel
spec:
  ingressClassName: traefik
  rules:
    - host: panel.glem.men
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: panel
                port:
                  number: 80
