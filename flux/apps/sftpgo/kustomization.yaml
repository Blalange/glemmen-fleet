# SFTPGo WebDAV and SFTP file access on CephFS, authenticated by Authentik LDAP.
#
# The sftpgo-authentik and sftpgo-admin Secrets are created by hand and are not
# in Git. Create them before Flux reconciles this Kustomization; see README.md
# for the Secrets, Authentik LDAP provider/outpost and user provisioning steps.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sftpgo
resources:
  - pvc-homes.yaml
  - pvc-state.yaml
  - authentik-ldap.yaml
  - deployment.yaml
  - service-webdav.yaml
  - service-webui.yaml
  - service-sftp.yaml
  - ingress.yaml
  - ingress-webui.yaml
