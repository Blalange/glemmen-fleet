  # --------------------------------------------------------------- accessories
  - name: apc-ats
    role: power
    device_type: apc-ap4423a
    status: active
    description: APC automatic transfer switch between server80 and server100.
    interfaces:
      - name: mgmt
        type: 1000base-t
        mgmt_only: true
        enabled: true
        description: APC management port.
        ip_addresses:
          - address: 192.168.4.3/24
            primary: true

  - name: storwize-01
    role: storage
    device_type: ibm-storwize-v5000-lff-expansion
    status: staged
    description: IBM Storwize V5000 LFF expansion enclosure with 12 x 12 TB disks.

  - name: storwize-02
    role: storage
    device_type: ibm-storwize-v5000-lff-expansion
    status: staged
    description: IBM Storwize V5000 LFF expansion enclosure with 12 x 12 TB disks.

  - name: zyxel-gs1920-24
    role: switch
    device_type: zyxel-gs1920-24
    status: active
    description: Zyxel GS1920-24, firmware V4.10(AAOB.5); server-accessory switch on VLAN 4.
    interfaces:
      - name: mgmt
        type: virtual
        mgmt_only: true
        description: VLAN 4 management address.
        ip_addresses:
          - address: 192.168.4.2/24
