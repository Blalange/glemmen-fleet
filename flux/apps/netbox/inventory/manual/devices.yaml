layer: manual

defaults:
  site: glemmen
  tags:
    - production

devices:
  # ------------------------------------------------------------------ Talos nodes
  # iDRAC addresses are matched to each node's Dell service tag, not its
  # rack/position number. talosctl get systeminformation shows the service tag.
  - name: glemmen130
    role: control-plane
    device_type: dell-poweredge-r250
    talos_node: glemmen130
    idrac_ip: 192.168.4.130  # 6L51JZ3
    uplinks:
      - interface: eno8303
        switch: USW Pro 24 PoE
        port: 5
        type: cat6
      - interface: eno8403
        switch: USW Pro 24 PoE
        port: 6
        type: cat6

  - name: glemmen150
    role: control-plane
    device_type: dell-poweredge-r250
    talos_node: glemmen150
    idrac_ip: 192.168.4.150  # FL51JZ3
    uplinks:
      - interface: eno8303
        switch: USW Pro 24 PoE
        port: 7
        type: cat6
      - interface: eno8403
        switch: USW Pro 24 PoE
        port: 8
        type: cat6

  - name: glemmen160
    role: control-plane
    device_type: dell-poweredge-r250
    talos_node: glemmen160
    idrac_ip: 192.168.4.91  # DL51JZ3
    uplinks:
      - interface: eno8303
        switch: USW Pro 24 PoE
        port: 9
        type: cat6
      - interface: eno8403
        switch: USW Pro 24 PoE
        port: 10
        type: cat6

  - name: glemmen170
    role: control-plane
    device_type: dell-poweredge-r250
    talos_node: glemmen170
    idrac_ip: 192.168.4.247  # 4L51JZ3
    uplinks:
      - interface: eno8303
        switch: USW Pro 24 PoE
        port: 11
        type: cat6
      - interface: eno8403
        switch: USW Pro 24 PoE
        port: 12
        type: cat6

  - name: glemmen180
    role: control-plane
    device_type: dell-poweredge-r250
    talos_node: glemmen180
    idrac_ip: 192.168.4.135  # 2L51JZ3
    uplinks:
      - interface: eno8303
        switch: USW Pro 24 PoE
        port: 13
        type: cat6
      - interface: eno8403
        switch: USW Pro 24 PoE
        port: 14
        type: cat6

  - name: glemmen50
    role: worker
    device_type: ibm-system-x3650-m3
    talos_node: glemmen50
    uplinks:
      - interface: enp11s0f0
        switch: USW Pro 24 PoE
        port: 3
        type: cat6

  - name: glemmen60
    role: worker
    device_type: dell-poweredge-r515
    talos_node: glemmen60
    uplinks:
      - interface: eno1
        switch: USW Pro 24 PoE
        port: 4
        type: cat6

  - name: glemmen80
    role: worker
    device_type: dell-poweredge-r630
    talos_node: glemmen80
    uplinks:
      - interface: enp4s0f0
        switch: USW Pro 24 PoE
        port: 26
        type: dac-passive

  # --------------------------------------------------------------- physical servers
  # Any server below may also set idrac_ip; Redfish components work without a
  # talos_node and without a UniFi client address.
  - name: 240emy
    role: server
    device_type: dell-poweredge-r250
    unifi_ip: 192.168.6.181
    uplinks:
      - interface: Port 1
        switch: USW Pro 24 PoE
        port: 19
        type: cat6

  - name: ubuntu-server
    role: server
    device_type: dell-poweredge-r250
    unifi_ip: 192.168.6.230
    uplinks:
      - interface: Port 1
        switch: USW Pro 24 PoE
        port: 20
        type: cat6

  - name: server220
    role: server
    device_type: dell-poweredge-r250
    unifi_ip: 192.168.6.133
    uplinks:
      - interface: Port 1
        switch: USW Pro 24 PoE
        port: 23
        type: cat6

  - name: glemmen210
    role: server
    device_type: dell-poweredge-r250
    unifi_ip: 192.168.6.68
    uplinks:
      - interface: Port 1
        switch: USW Pro 24 PoE
        port: 22
        type: cat6

  - name: server200
    role: server
    device_type: dell-poweredge-r250
    status: failed
    description: Physical server between glemmen210 and server190. Currently broken; no management address.

  - name: server190
    role: server
    device_type: dell-poweredge-r250
    unifi_ip: 192.168.6.190
    uplinks:
      - interface: Port 1
        switch: USW Pro 24 PoE
        port: 21
        type: cat6

  - name: LeanderWin10
    role: server
    device_type: dell-poweredge-r250
    unifi_ip: 192.168.6.140
    uplinks:
      - interface: Port 1
        switch: USW Pro 24 PoE
        port: 18
        type: cat6

  - name: server120
    role: server
    device_type: dell-poweredge-r250
    unifi_ip: 192.168.6.120
    uplinks:
      - interface: Port 1
        switch: USW Pro 24 PoE
        port: 17
        type: cat6

  - name: server110
    role: server
    device_type: dell-poweredge-r250
    status: offline
    description: Physical server between server120 and dellserver01. No management address known.

  - name: dellserver01
    role: server
    device_type: dell-poweredge-r250
    unifi_ip: 192.168.6.100
    uplinks:
      - interface: Port 1
        switch: USW Pro 24 PoE
        port: 16
        type: cat6

  - name: server70
    role: server
    device_type: dell-poweredge-r630
    unifi_ip: 192.168.6.70
    uplinks:
      - interface: Port 1
        switch: USW Pro 24 PoE
        port: 24
        type: cat6

  # --------------------------------------------------------------- accessories
  - name: apc-ats
    role: power
    device_type: apc-ap4423a
    status: active
    description: APC automatic transfer switch between server80 and server100.
    interfaces:
      - name: mgmt
        type: 1000base-t
        mgmt_only: true
        enabled: true
        description: APC management port.
        ip_addresses:
          - address: 192.168.4.3/24
            primary: true

  - name: storwize-01
    role: storage
    device_type: ibm-storwize-v5000-lff-expansion
    status: staged
    description: IBM Storwize V5000 LFF expansion enclosure with 12 x 12 TB disks.
    module_bays: &storwize_bays
