      - name: PSU 1
        position: 13
        bay_type: power-supply
        description: Hot-swap power supply bay 1.
      - name: PSU 2
        position: 14
        bay_type: power-supply
        description: Hot-swap power supply bay 2.
      - name: Canister 1
        position: 15
        bay_type: expansion-canister
        description: Expansion canister bay 1.
      - name: Canister 2
        position: 16
        bay_type: expansion-canister
        description: Expansion canister bay 2.
    modules: &storwize_modules
      - bay: Drive 1
        module_type: generic-12tb-sas-hdd
        status: staged
        description: 12 TB SAS HDD (bay 1)
      - bay: Drive 2
        module_type: generic-12tb-sas-hdd
        status: staged
        description: 12 TB SAS HDD (bay 2)
      - bay: Drive 3
        module_type: generic-12tb-sas-hdd
        status: staged
        description: 12 TB SAS HDD (bay 3)
      - bay: Drive 4
        module_type: generic-12tb-sas-hdd
        status: staged
        description: 12 TB SAS HDD (bay 4)
      - bay: Drive 5
        module_type: generic-12tb-sas-hdd
        status: staged
        description: 12 TB SAS HDD (bay 5)
      - bay: Drive 6
        module_type: generic-12tb-sas-hdd
        status: staged
