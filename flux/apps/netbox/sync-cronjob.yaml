# Reconcile the YAML inventory in this directory into NetBox. This is the only
# writer to NetBox: the UI is anonymous read-only, and the superuser exists so
# a human can correct data or use the web UI when needed.
#
# Every taggable object created by this job is tagged "gitops" plus its
# provenance sources (manual, unifi, talos, redfish, ipmi, snmp, dtl). With
# PRUNE=true, objects that carry the gitops tag but are no longer in the
# inventory are deleted; anything created by hand (without the tag) is never
# touched. Owner groups and owners cannot be tagged, so they are created/updated
# but never pruned. Contacts and contact assignments are taggable and are pruned
# normally.
#
# The job is intentionally self-contained: the Python image is standard, and
# an init container installs the pinned dependencies into an emptyDir.
# This avoids maintaining a custom image just for the sync script.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: netbox-sync
  labels:
    app.kubernetes.io/name: netbox-sync
    app.kubernetes.io/instance: netbox
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # First rollout can coincide with NetBox's database migrations, so give
      # the job enough time to wait for the API and finish.
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: netbox-sync
            app.kubernetes.io/instance: netbox
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: dependencies
              image: docker.io/library/python:3.13-alpine
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - >-
                  pip install --no-cache-dir --target /deps
                  pynetbox==7.9.0 PyYAML==6.0.3 requests==2.32.5
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: dependencies
                  mountPath: /deps
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 512Mi
          containers:
            - name: sync
              image: docker.io/library/python:3.13-alpine
              imagePullPolicy: IfNotPresent
              command: ["python", "-u", "/scripts/sync.py"]
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: NETBOX_URL
                  value: http://netbox.netbox.svc.cluster.local
                - name: NETBOX_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: netbox-secrets
                      # Full v2 token: nbt_<key>.<secret>. NetBox 4.7 creates
                      # v2 tokens by default; pynetbox sends these as Bearer.
                      key: api_token_full
                - name: NETBOX_INVENTORY_DIR
                  value: /inventory
                - name: NETBOX_IMAGES_DIR
                  value: /images
                # Device Type Library definitions and elevation images are
                # fetched at runtime and cached on the media volume; no DTL
                # data is committed to Git. Manual inventory always wins.
                - name: DTL_ENABLED
                  value: "true"
                - name: DTL_REPO
                  value: netbox-community/devicetype-library
                - name: DTL_REF
                  value: master
                - name: DTL_CACHE_DIR
                  value: /media/dtl-cache
                - name: DTL_CACHE_TTL_HOURS
                  value: "24"
                - name: DTL_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: netbox-secrets
                      key: dtl_token
                      optional: true
                # Set to "true" for a plan-only run. The CronJob applies changes;
                # use a local dry-run or a one-off Job with DRY_RUN=true to
                # preview changes before merging inventory edits.
                - name: DRY_RUN
                  value: "false"
                - name: PRUNE
                  value: "true"
                - name: NETBOX_WAIT_SECONDS
                  value: "240"
                - name: PYTHONPATH
                  value: /deps
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: dependencies
                  mountPath: /deps
                  readOnly: true
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: inventory
                  mountPath: /inventory
                  readOnly: true
                - name: images
                  mountPath: /images
                  readOnly: true
                - name: media
                  mountPath: /media
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: dependencies
              emptyDir: {}
            - name: script
              configMap:
                name: netbox-sync-code
            - name: inventory
              configMap:
                name: netbox-inventory-data
            - name: images
              configMap:
                name: netbox-device-type-images
            - name: media
              persistentVolumeClaim:
                claimName: netbox-media
            - name: tmp
              emptyDir: {}
