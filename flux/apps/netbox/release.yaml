# NetBox chart repository and release. The chart handles migrations, the
# superuser bootstrap, the web/worker processes and the ServiceMonitor; the
# PostgreSQL and Valkey subcharts are disabled in values.yaml because the
# Bitnami images are no longer version-pinned. PostgreSQL and Valkey run as
# plain StatefulSet/Deployment resources in this namespace instead.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: netbox
spec:
  interval: 1h
  url: https://charts.netbox.oss.netboxlabs.com
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbox
spec:
  interval: 1h
  # NetBox runs database migrations during startup; the first rollout can take
  # a few minutes on a small cluster.
  timeout: 15m
  chart:
    spec:
      chart: netbox
      version: 8.3.93
      sourceRef:
        kind: HelmRepository
        name: netbox
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  valuesFrom:
    - kind: ConfigMap
      name: netbox-values
      valuesKey: values.yaml
