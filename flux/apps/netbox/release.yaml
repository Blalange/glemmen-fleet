# NetBox chart repository and release. The chart handles migrations, the
# superuser bootstrap, the web/worker processes and the ServiceMonitor; the
# bundled PostgreSQL and Valkey subcharts are disabled in values.yaml. NetBox
# uses the shared in-cluster PostgreSQL, and Valkey runs as a plain Deployment
# in this namespace from a pinned official image.
#
# The first rollout against an empty database runs the full set of Django
# migrations. The Helm timeout allows for the initial schema creation.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: netbox
spec:
  interval: 1h
  url: https://charts.netbox.oss.netboxlabs.com
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbox
spec:
  interval: 1h
  # NetBox runs database migrations during startup.
  timeout: 20m
  chart:
    spec:
      chart: netbox
      version: 8.3.93
      sourceRef:
        kind: HelmRepository
        name: netbox
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  valuesFrom:
    - kind: ConfigMap
      name: netbox-values
      valuesKey: values.yaml
