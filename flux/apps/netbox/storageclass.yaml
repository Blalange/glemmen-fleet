# Dedicated Longhorn StorageClass for the NetBox media volume. It must be
# ReadWriteMany because the web and worker pods both mount it and may run on
# different nodes. Longhorn implements RWX with an NFS share-manager, which
# requires migratable=false. The class keeps the cluster convention: one
# replica, Retain so deleting a PVC cannot delete the only copy, and Immediate
# binding. NetBox's database lives on the shared PostgreSQL instance, so there
# is no database volume here.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: netbox-media
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  staleReplicaTimeout: "2880"
  migratable: "false"
