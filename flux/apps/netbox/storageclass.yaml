# Dedicated Longhorn StorageClasses for NetBox. The database volume is a
# normal ReadWriteOnce block volume; the media volume must be ReadWriteMany
# because the web and worker pods both mount it and may run on different
# nodes. Longhorn implements RWX with an NFS share-manager, which requires
# migratable=false. Both classes keep the cluster convention: one replica,
# Retain so deleting a PVC cannot delete the only copy, and Immediate binding.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: netbox
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "2880"
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: netbox-media
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "2880"
  migratable: "false"
