# PostgreSQL for NetBox. NetBox keeps its own database in this namespace; the
# separate YugabyteDB cluster in flux/infrastructure/yugabyte is only used by
# Grafana. The password is read from netbox-secrets key db-password; that
# Secret is created by hand (see values.yaml) and is not in Git.
#
# The official postgres image only creates the database/user and sets the
# password while the data directory is empty. Changing db-password later does
# not change the password inside the database, so rotate with SQL as well.
apiVersion: v1
kind: Service
metadata:
  name: netbox-postgres
  labels:
    app.kubernetes.io/name: netbox-postgres
    app.kubernetes.io/instance: netbox
spec:
  # Headless: the single pod's DNS name is the Service name, which is all a
  # single-writer database needs.
  clusterIP: None
  selector:
    app.kubernetes.io/name: netbox-postgres
    app.kubernetes.io/instance: netbox
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: netbox-postgres
  labels:
    app.kubernetes.io/name: netbox-postgres
    app.kubernetes.io/instance: netbox
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: netbox
  # Rebind the PVC that was pruned during the database switch to its retained
  # Longhorn volume, so the existing NetBox data survives.
  volumeName: pvc-9de04e74-5087-4ced-aba7-918409fbbaf1
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: netbox-postgres
  labels:
    app.kubernetes.io/name: netbox-postgres
    app.kubernetes.io/instance: netbox
spec:
  serviceName: netbox-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: netbox-postgres
      app.kubernetes.io/instance: netbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbox-postgres
        app.kubernetes.io/instance: netbox
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: docker.io/library/postgres:18.6-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: POSTGRES_DB
              value: netbox
            - name: POSTGRES_USER
              value: netbox
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netbox-secrets
                  key: db-password
          ports:
            - name: postgres
              containerPort: 5432
          # postgres:18 keeps its cluster in /var/lib/postgresql/18/docker, so
          # the volume mounts one level above the data directory.
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "netbox", "-d", "netbox"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "netbox", "-d", "netbox"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: netbox-postgres
