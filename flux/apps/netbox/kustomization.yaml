apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: netbox
resources:
  - release.yaml
  - storageclass.yaml
  - media-pvc.yaml
  - postgres.yaml
  - valkey.yaml
  - sync-cronjob.yaml
configMapGenerator:
  - name: netbox-values
    files:
      - values.yaml
  - name: netbox-sync-script
    files:
      - sync.py
  - name: netbox-inventory
    # The generated layer is written by scripts/netbox/generate_inventory.py;
    # the manual layer is edited by hand. The keys are prefixed only to keep
    # the ConfigMap flat and reviewable. sync.py merges by the `layer` field.
    files:
      - 00-generated-unifi.yaml=inventory/generated/unifi.yaml
      - 10-generated-servers.yaml=inventory/generated/servers.yaml
      - 20-generated-talos.yaml=inventory/generated/talos.yaml
      - 30-manual-site.yaml=inventory/manual/site.yaml
      - 40-manual-device-types.yaml=inventory/manual/device-types.yaml
      - 45-manual-module-types.yaml=inventory/manual/module-types.yaml
      - 50-manual-racks.yaml=inventory/manual/racks.yaml
      - 60-manual-devices.yaml=inventory/manual/devices.yaml
      - 70-manual-cables.yaml=inventory/manual/cables.yaml
      - 80-manual-ipam.yaml=inventory/manual/ipam.yaml
  - name: netbox-device-images
    files:
      - inventory/images/apc-ap4423a-front.jpg
      - inventory/images/apc-ap4423a-rear.jpg
      - inventory/images/dell-poweredge-r250-front.jpg
      - inventory/images/dell-poweredge-r250-other.jpg
      - inventory/images/dell-poweredge-r250-rear.jpg
      - inventory/images/dell-poweredge-r515-front.jpg
      - inventory/images/dell-poweredge-r515-other.jpg
      - inventory/images/dell-poweredge-r515-rear.jpg
      - inventory/images/dell-poweredge-r515-side.jpg
      - inventory/images/dell-poweredge-r630-front.jpg
      - inventory/images/dell-poweredge-r630-rear.jpg
      - inventory/images/ibm-storwize-v5000-lff-expansion-front.jpg
      - inventory/images/ibm-storwize-v5000-lff-expansion-other.jpg
      - inventory/images/ibm-storwize-v5000-lff-expansion-rear.jpg
      - inventory/images/ibm-system-x3650-m3-front.jpg
      - inventory/images/ibm-system-x3650-m3-other.jpg
      - inventory/images/ibm-system-x3650-m3-rear.jpg
      - inventory/images/ubiquiti-u6-pro-front.jpg
      - inventory/images/ubiquiti-u6-pro-other.jpg
      - inventory/images/ubiquiti-u6-pro-rear.jpg
      - inventory/images/ubiquiti-udm-pro-front.jpg
      - inventory/images/ubiquiti-udm-pro-rear.jpg
      - inventory/images/ubiquiti-us-8-poe-150w-front.jpg
      - inventory/images/ubiquiti-us-8-poe-150w-other.jpg
      - inventory/images/ubiquiti-us-8-poe-150w-rear.jpg
      - inventory/images/ubiquiti-usw-flex-2-5g-5-front.jpg
      - inventory/images/ubiquiti-usw-flex-2-5g-5-other.jpg
      - inventory/images/ubiquiti-usw-flex-2-5g-5-rear.jpg
      - inventory/images/ubiquiti-usw-flex-2-5g-8-poe-front.jpg
      - inventory/images/ubiquiti-usw-flex-2-5g-8-poe-other.jpg
      - inventory/images/ubiquiti-usw-flex-2-5g-8-poe-rear.jpg
      - inventory/images/ubiquiti-usw-flex-mini-front.jpg
      - inventory/images/ubiquiti-usw-flex-mini-other.jpg
      - inventory/images/ubiquiti-usw-flex-mini-rear.jpg
      - inventory/images/ubiquiti-usw-pro-24-poe-front.jpg
      - inventory/images/ubiquiti-usw-pro-24-poe-rear.jpg
      - inventory/images/zyxel-gs1920-24-front.jpg
      - inventory/images/zyxel-gs1920-24-other.jpg
