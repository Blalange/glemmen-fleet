# Static assets ConfigMap for Homepage (logo, background, about, css, js).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homepage-assets
  namespace: flux-system
spec:
  # suspended until the Longhorn volumes are restored (migration step 7), resume via flux/manage.sh
  suspend: true
  interval: 1h
  retryInterval: 2m
  path: ./homepage/assets
  prune: true
  targetNamespace: homepage
  sourceRef:
    kind: GitRepository
    name: flux-system
