# Snipe-IT + MariaDB, Longhorn volumes.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: snipe-it
  namespace: flux-system
spec:
  # suspended until the Longhorn volumes are restored (migration step 7), resume via flux/manage.sh
  suspend: true
  interval: 1h
  retryInterval: 2m
  path: ./snipe-it
  prune: true
  wait: true
  targetNamespace: snipe-it
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
