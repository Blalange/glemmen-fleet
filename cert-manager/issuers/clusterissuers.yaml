# Let's Encrypt issuers using Cloudflare DNS-01, which is required for wildcard
# certificates.
#
# Two Cloudflare API tokens are used, one for each group of zones:
#   cloudflare-api-token          -> blatrix.eu, shrail.eu.org,
#                                    thisisaveryshortdomain.asso.eu.org
#   cloudflare-api-token-glem-men -> glem.men
#
# Both secrets must exist in the cert-manager namespace:
#
#   kubectl create secret generic cloudflare-api-token -n cert-manager \
#     --from-literal=api-token=<token>
#   kubectl create secret generic cloudflare-api-token-glem-men -n cert-manager \
#     --from-literal=api-token=<token>
#
# The tokens need Zone:Zone:Read and Zone:DNS:Edit for their zones.
# Use the staging issuers when testing to avoid hitting Let's Encrypt rate limits.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging-glem-men
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-glem-men-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-glem-men
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod-glem-men
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-glem-men-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-glem-men
              key: api-token
