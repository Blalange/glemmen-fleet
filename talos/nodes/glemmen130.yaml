# glemmen130 - 3 disks:
#   sda ST2000NM012B-2TD WRE0MBLR - system disk (was half of the old btrfs root, wiped by the installer)
#   sdb ST2000NM012B-2TD WRE0MWFF - Longhorn data disk (was the other half of the old btrfs root)
#   sdc ST1000DM010-2EP1 ZN1VG6WD - Longhorn data disk (old /mnt/hdd1)
apiVersion: v1alpha1
kind: HostnameConfig
hostname: glemmen130
---
apiVersion: v1alpha1
kind: BondConfig
name: bond0
links:
    - eno8303
    - eno8403
bondMode: 802.3ad
miimon: 100
updelay: 200
downdelay: 200
xmitHashPolicy: layer3+4
lacpRate: slow
up: true
addresses:
    - address: 192.168.6.130/24
routes:
    - gateway: 192.168.6.1
---
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 192.168.6.98
link: bond0
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: longhorn
provisioning:
    diskSelector:
        match: 'disk.wwid == "naa.5000c500f266c686"'
    minSize: 10GiB
    grow: true
filesystem:
    type: btrfs
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: hdd1
provisioning:
    diskSelector:
        match: 'disk.wwid == "naa.5000c500e41fe0a5"'
    minSize: 10GiB
    grow: true
filesystem:
    type: btrfs
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
    node.longhorn.io/create-default-disk: config
annotations:
    node.longhorn.io/default-disks-config: '[{"name":"system","path":"/var/mnt/longhorn-system","allowScheduling":true,"storageReserved":600000000000},{"name":"longhorn","path":"/var/mnt/longhorn","allowScheduling":true,"storageReserved":0},{"name":"hdd1","path":"/var/mnt/hdd1","allowScheduling":true,"storageReserved":0}]'
