# glemmen130 - 3 disks:
#   sda ST2000NM012B-2TD WRE0MBLR - system disk (was half of the old btrfs root, wiped by the installer)
#   sdb ST2000NM012B-2TD WRE0MWFF - Longhorn data disk (was the other half of the old btrfs root)
#   sdc ST1000DM010-2EP1 ZN1VG6WD - Longhorn data disk (old /mnt/hdd1)
apiVersion: v1alpha1
kind: HostnameConfig
hostname: glemmen130
---
apiVersion: v1alpha1
kind: BondConfig
name: bond0
links:
  - eno8303
  - eno8403
bondMode: balance-alb
miimon: 100
updelay: 200
downdelay: 200
up: true
addresses:
  - address: 192.168.6.130/24
routes:
  - gateway: 192.168.6.1
  # Hairpin NAT: replies from the .99 MetalLB VIP must return through the
  # UDM instead of taking the directly connected bond0.1 route.
  - destination: 192.168.50.0/24
    gateway: 192.168.6.1
    metric: 50
---
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 192.168.6.98
link: bond0
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
reboot: true
provisioning:
  diskSelector:
    match: 'disk.wwid == "eui.e8238fa6bf530001001b448b48dd1ef1"'
  wipe: true
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: cmr1
provisioning:
  diskSelector:
    match: 'disk.wwid == "naa.5000c500f266aba4"'
  minSize: 10GiB
  grow: true
filesystem:
  type: btrfs
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: cmr2
provisioning:
  diskSelector:
    match: 'disk.wwid == "naa.5000c500f266c686"'
  minSize: 10GiB
  grow: true
filesystem:
  type: btrfs
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: smr1
provisioning:
  diskSelector:
    match: 'disk.wwid == "naa.5000c500e41fe0a5"'
  minSize: 10GiB
  grow: true
filesystem:
  type: btrfs
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  node.longhorn.io/create-default-disk: config
annotations:
  node.longhorn.io/default-disks-config: '[{"name":"system","path":"/var/mnt/longhorn-system","allowScheduling":true,"storageReserved":64000000000,"tags":["nvme", "fast"]},{"name":"cmr1","path":"/var/mnt/cmr1","allowScheduling":true,"storageReserved":0,"tags":["cmr"]},{"name":"cmr2","path":"/var/mnt/cmr2","allowScheduling":true,"storageReserved":0,"tags":["cmr"]},{"name":"smr1","path":"/var/mnt/smr1","allowScheduling":false,"storageReserved":0,"tags":["smr"]}]'
