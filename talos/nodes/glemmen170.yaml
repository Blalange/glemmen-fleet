# glemmen170 - 3 disks:
#   nvme0n1 Samsung 256 GB - system disk + raw Ceph OSD (eui.002538b481baa2e1)
#   sda ST2000NM012B-2TD - CMR disk, handed to Ceph as an OSD
#   sdb ST2000DM008-2FR1 WFL4K91A - SMR data disk, unmounted and available
apiVersion: v1alpha1
kind: HostnameConfig
hostname: glemmen170
---
# Two-port LACP bundle: both onboard 1G ports. The switch side is
# port-channel13 with LACP active, layer3+4 hashing and no lacp
# suspend-individual for PXE.
apiVersion: v1alpha1
kind: BondConfig
name: bond0
links:
  - eno8303
  - eno8403
bondMode: 802.3ad
xmitHashPolicy: layer3+4
lacpRate: fast
miimon: 100
updelay: 200
downdelay: 200
up: true
mtu: 9000
addresses:
  - address: 192.168.6.170/24
routes:
  - gateway: 192.168.6.1
  # Hairpin NAT: replies from the .99 MetalLB VIP must return through the
  # UDM instead of taking the directly connected bond0.1 route.
  - destination: 192.168.50.0/24
    gateway: 192.168.6.1
    metric: 50
---
# Keep the legacy interface name so the PXE proxyDHCP pod keeps working.
# The Default VLAN/PXE stays at MTU 1500; the parent server VLAN is 9000.
apiVersion: v1alpha1
kind: VLANConfig
name: bond0.1
parent: bond0
vlanID: 1
mtu: 1500
---
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 192.168.6.98
link: bond0
---
apiVersion: v1alpha1
kind: SysctlConfig
params:
  net.ipv4.ip_forward: "1"
  net.ipv4.conf.all.rp_filter: "0"
  net.ipv4.conf.default.rp_filter: "0"
  # Only answer ARP on the interface that owns the address.
  net.ipv4.conf.all.arp_ignore: "1"
  net.ipv4.conf.all.arp_announce: "2"
  net.ipv4.conf.all.accept_redirects: "0"
  net.ipv4.conf.all.send_redirects: "0"
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
reboot: true
provisioning:
  diskSelector:
    match: 'disk.wwid == "eui.002538b481baa2e1"'
  wipe: true
---
# Keep the OS/containerd partition small so the rest of the NVMe disk can be
# used as a raw Ceph OSD.
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  maxSize: 100GiB
---
apiVersion: v1alpha1
kind: RawVolumeConfig
name: nvme-osd
provisioning:
  diskSelector:
    match: 'disk.wwid == "eui.002538b481baa2e1"'
  minSize: 100GiB
  maxSize: 140GiB
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  glem.men/ecmp-node: "true"
  glem.men/lan-speed: "2"
