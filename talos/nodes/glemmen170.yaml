# glemmen170 - 3 disks:
#   nvme0n1 Samsung 256 GB - system disk (eui.002538b481baa2e1; wiped by the installer)
#   sda ST2000NM012B-2TD - Longhorn data disk (cmr1)
#   sdb ST2000DM008-2FR1 WFL4K91A - Longhorn data disk (smr1, old /mnt/hdd1)
apiVersion: v1alpha1
kind: HostnameConfig
hostname: glemmen170
---
apiVersion: v1alpha1
kind: BondConfig
name: bond0
links:
  - eno8303
  - eno8403
# balance-alb, not 802.3ad: the R250 firmware PXE ROM cannot speak LACP, and
# the PXE chainloader is the only way this node boots its NVMe system disk.
# The switch ports are therefore plain access ports, not a LAG.
bondMode: balance-alb
miimon: 100
updelay: 200
downdelay: 200
up: true
addresses:
  - address: 192.168.6.170/24
routes:
  - gateway: 192.168.6.1
  # Hairpin NAT: replies from the .99 MetalLB VIP must return through the
  # UDM instead of taking the directly connected bond0.1 route.
  - destination: 192.168.50.0/24
    gateway: 192.168.6.1
    metric: 50
---
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 192.168.6.98
link: bond0
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
reboot: true
provisioning:
  diskSelector:
    match: 'disk.wwid == "eui.002538b481baa2e1"'
  wipe: true
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: cmr1
provisioning:
  diskSelector:
    match: 'disk.wwid == "naa.5000c500f266e157"'
  minSize: 10GiB
  grow: true
filesystem:
  type: btrfs
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: smr1
provisioning:
  diskSelector:
    match: 'disk.wwid == "naa.5000c500d45b0401"'
  minSize: 10GiB
  grow: true
filesystem:
  type: btrfs
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  node.longhorn.io/create-default-disk: config
annotations:
  node.longhorn.io/default-disks-config: '[{"name":"system","path":"/var/mnt/longhorn-system","allowScheduling":true,"storageReserved":64000000000,"tags":["nvme", "fast"]},{"name":"cmr1","path":"/var/mnt/cmr1","allowScheduling":true,"storageReserved":0,"tags":["cmr"]},{"name":"smr1","path":"/var/mnt/smr1","allowScheduling":false,"evictionRequested":true,"storageReserved":0,"tags":["smr"]}]'
