# glemmen160 - 2 disks:
#   sda ST2000NM012B-2TD - system disk (wiped by the installer)
#   sdb ST2000DM008-2FR1 WFL4KAP2 - Longhorn data disk (old /mnt/hdd1)
apiVersion: v1alpha1
kind: HostnameConfig
hostname: glemmen160
---
apiVersion: v1alpha1
kind: LinkConfig
name: eno8303
up: true
addresses:
  - address: 192.168.6.160/24
routes:
  - gateway: 192.168.6.1
  # Hairpin NAT: replies from the .99 MetalLB VIP must return through the
  # UDM instead of taking the directly connected bond0.1 route.
  - destination: 192.168.50.0/24
    gateway: 192.168.6.1
    metric: 50
---
apiVersion: v1alpha1
kind: LinkConfig
name: eno8403
up: true
---
# Second ECMP path. VLAN 7 ("Servere ECMP" in UniFi) is already tagged on the
# server ports; the untagged server VLAN stays available for firmware PXE on
# eno8403 as well.
apiVersion: v1alpha1
kind: VLANConfig
name: eno8403.7
parent: eno8403
vlanID: 7
addresses:
  - address: 192.168.7.160/24
---
# Keep the legacy interface name so the PXE proxyDHCP pod keeps working.
apiVersion: v1alpha1
kind: VLANConfig
name: bond0.1
parent: eno8303
vlanID: 1
---
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 192.168.6.98
link: eno8303
---
apiVersion: v1alpha1
kind: SysctlConfig
params:
  net.ipv4.ip_forward: "1"
  net.ipv4.fib_multipath_hash_policy: "1"
  net.ipv4.fib_multipath_use_neigh: "1"
  net.ipv4.conf.all.rp_filter: "0"
  net.ipv4.conf.default.rp_filter: "0"
  net.ipv4.conf.eno8303/rp_filter: "0"
  net.ipv4.conf.eno8403/rp_filter: "0"
  net.ipv4.conf.eno8403.7/rp_filter: "0"
  net.ipv4.conf.all.accept_redirects: "0"
  net.ipv4.conf.all.send_redirects: "0"
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
reboot: true
provisioning:
  diskSelector:
    match: 'disk.wwid == "eui.002538b48103783e"'
  wipe: true
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: cmr1
provisioning:
  diskSelector:
    match: 'disk.wwid == "naa.5000c500f266c046"'
  minSize: 10GiB
  grow: true
filesystem:
  type: btrfs
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: smr1
provisioning:
  diskSelector:
    match: 'disk.wwid == "naa.5000c500d45acb1c"'
  minSize: 10GiB
  grow: true
filesystem:
  type: btrfs
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  node.longhorn.io/create-default-disk: config
  glem.men/ecmp-node: "true"
annotations:
  node.longhorn.io/default-disks-config: '[{"name":"system","path":"/var/mnt/longhorn-system","allowScheduling":true,"storageReserved":64000000000,"tags":["nvme", "fast"]},{"name":"cmr1","path":"/var/mnt/cmr1","allowScheduling":true,"storageReserved":0,"tags":["cmr"]},{"name":"smr1","path":"/var/mnt/smr1","allowScheduling":false,"storageReserved":0,"tags":["smr"]}]'
