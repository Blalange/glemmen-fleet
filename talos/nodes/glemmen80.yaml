# glemmen80 - worker node, 3 disks (disk slots were shuffled; selecting by WWID):
#   sda ST91000640NS  naa.5000c500647fdfa5 - system disk (Talos boot, wiped by the installer)
#   sdb WDC WD10JFCX   naa.50014ee606491ff7 - data disk, unmounted and available
#   sdc WDC WD10JFCX   naa.50014ee65b9e625a - data disk, unmounted and available
#
# NOTE: SecureBoot is enabled on this machine; disable it in the BIOS (or build a
# SecureBoot-signed image) before installing Talos.
apiVersion: v1alpha1
kind: HostnameConfig
hostname: glemmen80
---
apiVersion: v1alpha1
kind: LinkConfig
name: enp4s0f0
up: true
mtu: 9000
addresses:
    - address: 192.168.6.80/24
routes:
    - gateway: 192.168.6.1
---
# Tagged VLAN 7 on the 10G SFP+ link. The switch port (USW Pro 24 PoE port
# 26) must carry VLAN 7 as a tagged network. MTU 9000. This lets glemmen80 use both
# 1 Gbit/s links of each 1xx node without a second physical link.
apiVersion: v1alpha1
kind: VLANConfig
name: enp4s0f0.7
parent: enp4s0f0
vlanID: 7
mtu: 9000
addresses:
    - address: 192.168.7.80/24
---
# Install to the ST91000640NS (slot moved to sda); overrides the common install target.
apiVersion: v1alpha1
kind: UnattendedInstallConfig
reboot: true
provisioning:
    diskSelector:
        match: 'disk.wwid == "naa.5000c500647fdfa5"'
    wipe: true
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
    glem.men/ecmp-node: "true"
