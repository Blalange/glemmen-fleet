# glemmen150 - 2 disks:
#   sda ST2000NM012B-2TD - system disk (wiped by the installer)
#   sdb ST2000DM008-2FR1 WFL4KACK - Longhorn data disk (old /mnt/hdd1)
apiVersion: v1alpha1
kind: HostnameConfig
hostname: glemmen150
---
apiVersion: v1alpha1
kind: BondConfig
name: bond0
links:
    - eno8303
    - eno8403
bondMode: 802.3ad
miimon: 100
updelay: 200
downdelay: 200
xmitHashPolicy: layer3+4
lacpRate: slow
up: true
addresses:
    - address: 192.168.6.150/24
routes:
    - gateway: 192.168.6.1
---
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 192.168.6.98
link: bond0
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: longhorn
provisioning:
    diskSelector:
        match: 'disk.wwid == "naa.5000c500d45ad4e3"'
    minSize: 10GiB
    grow: true
filesystem:
    type: btrfs
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
    node.longhorn.io/create-default-disk: config
annotations:
    node.longhorn.io/default-disks-config: '[{"name":"system","path":"/var/mnt/longhorn-system","allowScheduling":true,"storageReserved":600000000000,"tags":["fast"]},{"name":"longhorn","path":"/var/mnt/longhorn","allowScheduling":false,"evictionRequested":true,"storageReserved":0}]'
