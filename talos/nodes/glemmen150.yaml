# glemmen150 - CMR and SMR data disks plus the NVMe system/OSD disk:
#   nvme0n1 WD 500 GB - system disk + raw Ceph OSD (`r-nvme-osd`)
#   sda ST2000NM012B-2TD - CMR data disk, Ceph OSD
#   sdb ST2000DM008-2FR1 WFL4KACK - SMR data disk, currently unused
#
# Do not recreate UserVolumeConfigs for sda/sdb: Ceph consumes the raw block
# devices.
apiVersion: v1alpha1
kind: HostnameConfig
hostname: glemmen150
---
# Six-port LACP bundle: both onboard 1G ports plus the four ports on the
# Broadcom BCM5719 card. The switch side is port-channel11 with LACP active,
# layer3+4 hashing and no lacp suspend-individual for PXE.
apiVersion: v1alpha1
kind: BondConfig
name: bond0
links:
  - eno8303
  - eno8403
  - ens2f0
  - ens2f1
  - ens2f2
  - ens2f3
bondMode: 802.3ad
xmitHashPolicy: layer3+4
lacpRate: fast
miimon: 100
updelay: 200
downdelay: 200
up: true
mtu: 9000
addresses:
  - address: 192.168.6.150/24
routes:
  - gateway: 192.168.6.1
  # Hairpin NAT: replies from the .99 MetalLB VIP must return through the
  # UDM instead of taking the directly connected bond0.1 route.
  - destination: 192.168.50.0/24
    gateway: 192.168.6.1
    metric: 50
---
# Keep the legacy interface name so the PXE proxyDHCP pod keeps working while
# the other control-plane nodes still use bond0.1. The Default VLAN/PXE stays
# at MTU 1500; the parent server VLAN is 9000.
apiVersion: v1alpha1
kind: VLANConfig
name: bond0.1
parent: bond0
vlanID: 1
mtu: 1500
---
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 192.168.6.98
link: bond0
---
apiVersion: v1alpha1
kind: SysctlConfig
params:
  net.ipv4.ip_forward: "1"
  net.ipv4.conf.all.rp_filter: "0"
  net.ipv4.conf.default.rp_filter: "0"
  # Only answer ARP on the interface that owns the address.
  net.ipv4.conf.all.arp_ignore: "1"
  net.ipv4.conf.all.arp_announce: "2"
  net.ipv4.conf.all.accept_redirects: "0"
  net.ipv4.conf.all.send_redirects: "0"
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
reboot: true
provisioning:
  diskSelector:
    match: 'disk.wwid == "eui.e8238fa6bf530001001b448b48dd7460"'
  wipe: true
---
# Keep the OS/containerd partition small so the rest of the NVMe disk can be
# used as a raw Ceph OSD.
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  maxSize: 100GiB
---
apiVersion: v1alpha1
kind: RawVolumeConfig
name: nvme-osd
provisioning:
  diskSelector:
    match: 'disk.wwid == "eui.e8238fa6bf530001001b448b48dd7460"'
  minSize: 100GiB
  maxSize: 140GiB
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  glem.men/ecmp-node: "true"
  glem.men/lan-speed: "6000"
