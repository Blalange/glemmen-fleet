# glemmen180 - 1 physical disk only (the old node never had a working second 2TB disk):
#   sda ST2000NM012B-2TD WRE0MBFX - system disk (wiped by the installer)
# Longhorn uses the system disk only (directory volume below).
apiVersion: v1alpha1
kind: HostnameConfig
hostname: glemmen180
---
apiVersion: v1alpha1
kind: BondConfig
name: bond0
links:
  - eno8303
  - eno8403
bondMode: balance-alb
miimon: 100
updelay: 200
downdelay: 200
up: true
addresses:
  - address: 192.168.6.180/24
routes:
  - gateway: 192.168.6.1
  # Hairpin NAT: replies from the .99 MetalLB VIP must return through the
  # UDM instead of taking the directly connected bond0.1 route.
  - destination: 192.168.50.0/24
    gateway: 192.168.6.1
    metric: 50
---
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 192.168.6.98
link: bond0
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
reboot: true
provisioning:
  diskSelector:
    match: 'disk.wwid == "eui.0026b7683e061205"'
  wipe: true
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: cmr1
provisioning:
  diskSelector:
    match: 'disk.wwid == "naa.5000c500f266bb89"'
  minSize: 10GiB
  grow: true
filesystem:
  type: btrfs
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  node.longhorn.io/create-default-disk: config
annotations:
  node.longhorn.io/default-disks-config: '[{"name":"system","path":"/var/mnt/longhorn-system","allowScheduling":true,"storageReserved":64000000000,"tags":["nvme", "fast"]},{"name":"cmr1","path":"/var/mnt/cmr1","allowScheduling":true,"storageReserved":0,"tags":["cmr"]}]'
