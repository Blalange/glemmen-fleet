# glemmen180 - NVMe system disk plus one CMR data disk:
#   nvme0n1 Kingston 250 GB - system disk (wiped by the installer)
#   sda ST2000NM012B-2TD WRE0MBFX - CMR disk, handed to Ceph as an OSD

apiVersion: v1alpha1
kind: HostnameConfig
hostname: glemmen180
---
apiVersion: v1alpha1
kind: LinkConfig
name: eno8303
up: true
mtu: 9000
addresses:
  - address: 192.168.6.180/24
routes:
  - gateway: 192.168.6.1
  # Hairpin NAT: replies from the .99 MetalLB VIP must return through the
  # UDM instead of taking the directly connected bond0.1 route.
  - destination: 192.168.50.0/24
    gateway: 192.168.6.1
    metric: 50
---
apiVersion: v1alpha1
kind: LinkConfig
name: eno8403
up: true
mtu: 9000
---
# Keep the legacy interface name so the PXE proxyDHCP pod keeps working while
# the other control-plane nodes still use bond0.1.
apiVersion: v1alpha1
kind: VLANConfig
name: bond0.1
parent: eno8303
vlanID: 1
mtu: 1500
---
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 192.168.6.98
link: eno8303
---
apiVersion: v1alpha1
kind: SysctlConfig
params:
  net.ipv4.ip_forward: "1"
  net.ipv4.conf.all.rp_filter: "0"
  net.ipv4.conf.default.rp_filter: "0"
  # Only answer ARP on the interface that owns the address.
  net.ipv4.conf.all.arp_ignore: "1"
  net.ipv4.conf.all.arp_announce: "2"
  net.ipv4.conf.all.accept_redirects: "0"
  net.ipv4.conf.all.send_redirects: "0"
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
reboot: true
provisioning:
  diskSelector:
    match: 'disk.wwid == "eui.0026b7683e061205"'
  wipe: true
---
# Keep the OS/containerd partition small so the rest of the NVMe disk can be
# used as a raw Ceph OSD.
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  maxSize: 100GiB
---
apiVersion: v1alpha1
kind: RawVolumeConfig
name: nvme-osd
provisioning:
  diskSelector:
    match: 'disk.wwid == "eui.0026b7683e061205"'
  minSize: 100GiB
  maxSize: 140GiB
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  glem.men/ecmp-node: "true"
