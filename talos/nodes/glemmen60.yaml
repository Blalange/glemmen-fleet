# glemmen60 - worker node, Dell PowerEdge R515 with a PERC H700 (hardware RAID):
#   sda 600 GB  - ServeRAID/PERC virtual disk, system disk (wiped by the
#                 installer; matched by WWID - a size-based selector also
#                 matches loop devices and the install media!)
#   sdb 8.0 TB  - Longhorn data disk -> /var/mnt/hdd1
#
# Networking: single onboard Broadcom LOM (BCM5716, Dell/Quanta board) named
# eno1 (altname enp3s0f0, confirmed from live media). The cable goes to USW Pro
# 24 PoE port 4, a plain access port on the Servere VLAN (no LAG), so the
# static address is configured directly on eno1 below.
#
# Note: the Broadcom NIC only works because the schematic now ships the
# siderolabs/bnx2-bnx2x firmware extension - without it the interface never
# comes up in maintenance mode (see talos/README.md).
#
# Before wiping this node its migration backups (/mnt/hdd1) were confirmed
# expendable: the data has been restored on the new cluster, and Longhorn
# backups are disabled until a permanent backupstore exists.
apiVersion: v1alpha1
kind: HostnameConfig
hostname: glemmen60
---
apiVersion: v1alpha1
kind: LinkConfig
name: eno1
up: true
addresses:
    - address: 192.168.6.60/24
routes:
    - gateway: 192.168.6.1
---
# Install to the 600 GB PERC virtual disk.
apiVersion: v1alpha1
kind: UnattendedInstallConfig
reboot: true
provisioning:
    diskSelector:
        match: 'disk.wwid == "naa.6b8ca3a0f77e3f003260c7f61614887d"'
    wipe: true
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: hdd1
provisioning:
    diskSelector:
        match: 'disk.wwid == "naa.6b8ca3a0f77e3f003260ca1816169169"'
    minSize: 100GiB
    grow: true
filesystem:
    type: btrfs
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
    node.longhorn.io/create-default-disk: config
annotations:
    node.longhorn.io/default-disks-config: '[{"name":"system","path":"/var/mnt/longhorn-system","allowScheduling":true,"storageReserved":170000000000},{"name":"hdd1","path":"/var/mnt/hdd1","allowScheduling":true,"storageReserved":0}]'
