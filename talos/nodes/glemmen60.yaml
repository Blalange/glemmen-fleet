# glemmen60 - worker node, Dell with PERC H700, single NIC:
#   sda PERC H700 558 GB - system disk (wiped by the installer)
#   sdb PERC H700 7.3 TB - Longhorn data disk (/var/mnt/hdd1)
#
# Joined to the cluster last. Before wiping this node, the migration backups
# under /mnt/hdd1 are no longer needed (the data has been restored on the new
# cluster). The 7.3 TB disk may later host the permanent backup store.
apiVersion: v1alpha1
kind: HostnameConfig
hostname: glemmen60
---
apiVersion: v1alpha1
kind: LinkConfig
name: eno1
up: true
addresses:
    - address: 192.168.6.60/24
routes:
    - gateway: 192.168.6.1
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: hdd1
provisioning:
    diskSelector:
        match: '!system_disk && disk.size > 5000u * GiB'
    minSize: 100GiB
    grow: true
filesystem:
    type: btrfs
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
    node.longhorn.io/create-default-disk: config
annotations:
    node.longhorn.io/default-disks-config: '[{"name":"system","path":"/var/mnt/longhorn-system","allowScheduling":true,"storageReserved":170000000000},{"name":"hdd1","path":"/var/mnt/hdd1","allowScheduling":true,"storageReserved":0}]'
