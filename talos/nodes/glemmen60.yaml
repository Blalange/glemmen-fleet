# glemmen60 - worker node, Dell PowerEdge R515 with a PERC H700 (hardware RAID):
#   vd 558 GB  - system disk (wiped by the installer; matched by size, not by
#                /dev/sdX, so enumeration order does not matter)
#   vd 7.3 TB  - Longhorn data disk -> /var/mnt/hdd1
#
# Networking: single onboard Broadcom LOM (BCM5716, Dell/Quanta board) named
# eno1 (altname enp3s0f0, confirmed from live media). The cable goes to USW Pro
# 24 PoE port 4, a plain access port on the Servere VLAN (no LAG), so the
# static address is configured directly on eno1 below.
#
# Note for the maintenance boot: the pre-built setup-glemmen60.iso in
# generated/iso boots WITHOUT kernel arguments (DHCP) and gets an address from
# the Servere VLAN - use `manage.sh apply glemmen60 <dhcp-address>` with that
# address. If you rebuild the ISO, the static arguments derived from this file
# are embedded automatically.
#
# Before wiping this node its migration backups (/mnt/hdd1) were confirmed
# expendable: the data has been restored on the new cluster, and Longhorn
# backups are disabled until a permanent backupstore exists.
apiVersion: v1alpha1
kind: HostnameConfig
hostname: glemmen60
---
apiVersion: v1alpha1
kind: LinkConfig
name: eno1
up: true
addresses:
    - address: 192.168.6.60/24
routes:
    - gateway: 192.168.6.1
---
# Install to the smaller (558 GB) PERC virtual disk; overrides the common
# /dev/sda install target.
apiVersion: v1alpha1
kind: UnattendedInstallConfig
reboot: true
provisioning:
    diskSelector:
        match: 'disk.size < 1000u * GiB'
    wipe: true
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: hdd1
provisioning:
    diskSelector:
        match: '!system_disk && disk.size > 5000u * GiB'
    minSize: 100GiB
    grow: true
filesystem:
    type: btrfs
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
    node.longhorn.io/create-default-disk: config
annotations:
    node.longhorn.io/default-disks-config: '[{"name":"system","path":"/var/mnt/longhorn-system","allowScheduling":true,"storageReserved":170000000000},{"name":"hdd1","path":"/var/mnt/hdd1","allowScheduling":true,"storageReserved":0}]'
