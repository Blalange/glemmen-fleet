# Control-plane-only machine config patch.
#
# Pin etcd to the LAN: the netbird interface comes up early in boot and the
# default "first routable address" selection would otherwise pick the 100.110.x/16
# address for etcd (and kube-apiserver) traffic.
#
# Worker nodes must not receive this document ("etcd config is only allowed on
# control plane machines"), so it is applied with --config-patch-control-plane.
cluster:
    etcd:
        advertisedSubnets:
            - 192.168.6.0/24
        listenSubnets:
            - 192.168.6.0/24
---
# Allow controllers running in the cluster to drive the Talos API (tuppr uses
# this for health-gated node upgrades). Talos v1.14 requires this document and
# only allows it on control plane machines.
apiVersion: v1alpha1
kind: KubeTalosAPIAccessConfig
allowedRoles:
    - os:admin
allowedKubernetesNamespaces:
    - system-upgrade
---
# KubeNodeConfig contents are used as-is (unlike .machine.nodeLabels), so the
# control-plane role label has to be set here as well. All control planes are
# schedulable workers in this cluster, hence deliberately no NoSchedule taint.
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
    node-role.kubernetes.io/control-plane: ""
