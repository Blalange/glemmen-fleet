# Control-plane-only machine config patch.
#
# Pin etcd to the LAN: the netbird interface comes up early in boot and the
# default "first routable address" selection would otherwise pick the 100.110.x/16
# address for etcd (and kube-apiserver) traffic.
#
# Worker nodes must not receive this document ("etcd config is only allowed on
# control plane machines"), so it is applied with --config-patch-control-plane.
cluster:
    etcd:
        advertisedSubnets:
            - 192.168.6.0/24
        listenSubnets:
            - 192.168.6.0/24
---
# Allow controllers running in the cluster to drive the Talos API (tuppr uses
# this for health-gated node upgrades). Talos v1.14 requires this document and
# only allows it on control plane machines.
apiVersion: v1alpha1
kind: KubeTalosAPIAccessConfig
allowedRoles:
    - os:admin
allowedKubernetesNamespaces:
    - system-upgrade
---
# The control-plane switch ports carry the UDM Default network
# (192.168.50.0/24) as tagged VLAN 1, while the Talos server network
# (192.168.6.0/24) is the untagged/native VLAN. Expose VLAN 1 as bond0.1 so the
# host (and the hostNetwork PXE proxyDHCP pod) can see that L2 segment too.
apiVersion: v1alpha1
kind: VLANConfig
name: bond0.1
parent: bond0
vlanID: 1
---
# Address for bond0.1 from the UDM. Only the connected route is needed; a
# second default route from the Default VLAN would compete with the server
# VLAN gateway.
apiVersion: v1alpha1
kind: DHCPv4Config
name: bond0.1
ignoreRoutes: true
ignoreHostname: true
---
# KubeNodeConfig contents are used as-is (unlike .machine.nodeLabels), so the
# control-plane role label has to be set here as well. All control planes are
# schedulable workers in this cluster, hence deliberately no NoSchedule taint.
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
    node-role.kubernetes.io/control-plane: ""

---
# Calico is the CNI. Delete the Talos-generated Flannel document so Talos no
# longer installs/updates the kube-flannel DaemonSet. The Calico operator,
# Installation, IPPools, FelixConfiguration and the ECMP route agent are
# managed from flux/infrastructure/calico/.
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
