# Common machine config patch, applied to every node.
#
# Applied by scripts/talos/gen-config.py via `talosctl gen config --config-patch`.
# Node specific overrides live in talos/nodes/<hostname>.yaml and are merged on top.
#
# Notes:
# - v1.14 splits most settings into prefix-less config documents (kind: X). Patches
#   merge per document (kind + name for named documents).
# - `$patch: delete` removes a field/document from the generated defaults.
# - KubeNodeConfig contents are used as-is by Talos. The control-plane role
#   label is set in control-plane.yaml; the etcd/worker role labels are applied
#   after bootstrap by `manage.py roles`. Longhorn's node.longhorn.io/*
#   label+annotation are set per node below.

# Static hostnames: delete the generated `auto: stable` (the actual hostname is
# set per node in talos/nodes/<host>.yaml).
apiVersion: v1alpha1
kind: HostnameConfig
auto:
    $patch: delete
---
# Keep the pod/service CIDRs familiar (same as the old k3s cluster).
apiVersion: v1alpha1
kind: KubeNetworkConfig
podSubnets:
    - 10.42.0.0/16
serviceSubnets:
    - 10.43.0.0/16
---
# Pin the kubelet node IP to the LAN, and drop the generated control-plane taint
# (all nodes run all roles; the old cluster had no taints either) and the
# generated role labels (see note above).
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
    validSubnets:
        - 192.168.6.0/24
labels:
    $patch: delete
taints:
    $patch: delete
---
# Upstream DNS servers (no DHCP on the static bond).
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
    - address: 192.168.6.1
    - address: 1.1.1.1
---
# btrfs kernel module (btrfs user volumes for Longhorn).
apiVersion: v1alpha1
kind: KernelModuleConfig
name: btrfs
---
# NOTE: UnattendedInstallConfig is rendered by scripts/talos/gen-config.py
# (generated/patches/install.yaml) because it embeds the schematic-specific
# installer image. `provisioning` is replaced, not merged, by config patches.
---
# Directory user volume on the system disk (EPHEMERAL). Longhorn uses it as its
# "system" disk. Directory volumes are bind-mounted and propagated into the
# kubelet container automatically, so Longhorn's hostPath can reach them.
apiVersion: v1alpha1
kind: UserVolumeConfig
name: longhorn-system
volumeType: directory
