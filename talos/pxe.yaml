# Machine identities used by the iPXE boot script.
#
# The generator (scripts/talos/gen-pxe.py) emits iseq checks for every value
# below. Keep the values in sync with the hardware:
#   serial - SMBIOS serial number (Dell service tag / IBM serial)
#   uuid   - SMBIOS UUID from `talosctl get systeminformation`
#   macs   - permanent MAC addresses of the cabled NICs (`talosctl get links`,
#            permanentAddr). Include every NIC that the firmware might PXE boot
#            from; the bond MAC is not enough when the members differ.
#
# The iPXE environment exposes these as ${serial}, ${uuid} and ${mac}.
# Unknown machines fall through to netboot.xyz.
nodes:
  glemmen130:
    serial: 6L51JZ3
    uuid: 4c4c4544-004c-3510-8031-b6c04f4a5a33
    macs:
      - 6c:3c:8c:75:3d:94
      - 6c:3c:8c:75:3d:95
