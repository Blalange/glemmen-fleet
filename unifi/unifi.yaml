# Exposes the UniFi controller at 192.168.50.1 as https://unifi.glem.men.
# Same pattern as panel/: a Service with a manually managed EndpointSlice
# pointing at the host outside the cluster. The controller has a self-signed
# certificate, so Traefik talks HTTPS to it with verification disabled through
# the ServersTransport below. Client-side TLS is the usual Traefik default
# store, i.e. the *.glem.men wildcard certificate.
---
apiVersion: v1
kind: Service
metadata:
  name: unifi
  annotations:
    # Port 443 already implies https, but keep it explicit.
    traefik.ingress.kubernetes.io/service.serversscheme: https
    # <namespace>-<name>@kubernetescrd of the ServersTransport below.
    traefik.ingress.kubernetes.io/service.serverstransport: unifi-insecure@kubernetescrd
spec:
  ports:
    - name: https
      port: 443
      protocol: TCP
      targetPort: 443
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: unifi
  labels:
    kubernetes.io/service-name: unifi
addressType: IPv4
ports:
  - name: https
    protocol: TCP
    port: 443
endpoints:
  - addresses:
      - 192.168.50.1
---
# Skip certificate verification when talking to the controller.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: insecure
spec:
  insecureSkipVerify: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: unifi
spec:
  ingressClassName: traefik
  rules:
    - host: unifi.glem.men
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: unifi
                port:
                  number: 443
