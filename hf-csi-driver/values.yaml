# hf-csi-driver 0.14.2 (driver image v0.14.2).
#
# The chart defaults are what this cluster wants: a privileged node plugin
# DaemonSet (hostNetwork/hostPID) with system-node-critical priority, the
# sidecar-injection webhook, and the orphaned-FUSE-connection sweep enabled.
# Only the generated names are shortened; the release is called hf-csi, so
# fullnameOverride keeps the ServiceAccount, DaemonSet and webhook called
# hf-csi-node / hf-csi-webhook instead of hf-csi-hf-csi-driver-*.
fullnameOverride: hf-csi

# The published 0.14.2 chart pins hf-mount-fuse v0.9.2 (latest when the chart
# was released on 2026-08-31). v0.10.1 is the current release and carries the
# fixes we want on a flaky link: Hub rate-limit retries and startup retries,
# resilience to stalled CAS transfers, detaching a dead FUSE mount on restart
# (v0.9.2 crash-loops the sidecar until an operator cleans it up), and a
# one-shot graceful-shutdown drain. The sidecar CLI/args interface is
# unchanged between the two, so this is a drop-in for driver v0.14.2.
hfMount:
  image:
    tag: v0.10.1
