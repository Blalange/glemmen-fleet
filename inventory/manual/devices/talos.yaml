layer: manual

devices:
  # ------------------------------------------------------------------ Talos nodes
  # iDRAC addresses are matched to each node's Dell service tag, not its
  # rack/position number. talosctl get systeminformation shows the service tag.
  - name: glemmen130
    role: control-plane
    device_type: dell-poweredge-r250
    talos_node: glemmen130
    service_tag: 6L51JZ3
    contacts:
      - contact: Simon Bråten
        role: technical-contact
    idrac_ip: 192.168.4.130 # 6L51JZ3
    oob_ip: 192.168.4.130
    uplinks:
      - interface: eno8303
        switch: USW Pro 24 PoE
        port: 5
        type: cat6
      - interface: eno8403
        switch: USW Pro 24 PoE
        port: 6
        type: cat6

    interfaces:
      - name: iDRAC
        type: 1000base-t
        enabled: true
        mgmt_only: true
        description: Dell iDRAC 6L51JZ3 out-of-band management.
        mac_address: 6c:3c:8c:75:3d:8e
        untagged_vlan: 4
        ip_addresses:
          - address: 192.168.4.130/24
            dns_name: idrac-6l51jz3
