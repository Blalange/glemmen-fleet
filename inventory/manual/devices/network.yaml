layer: manual

devices:
  - name: Dream Machine Pro B bygg
    role: gateway
    device_type: ubiquiti-udm-pro
    status: active
    unifi_serial: 245A4C7679D1
    snmp_ip: 192.168.50.1

  - name: USW Pro 24 PoE
    role: switch
    device_type: ubiquiti-usw-pro-24-poe
    status: active
    unifi_serial: AC8BA9B5F7E9
    snmp_ip: 192.168.50.178

  - name: zyxel-gs1920-24
    role: switch
    device_type: zyxel-gs1920-24
    status: active
    contacts:
      - contact: Simon Bråten
        role: technical-contact
    description: Zyxel GS1920-24, firmware V4.10(AAOB.5); server-accessory switch on VLAN 4.
    snmp_ip: 192.168.4.2
    # The 28 physical ports are generated from the switch's SNMP interface
    # table, and their cables from LLDP/FDB. Only the static SFP types and the
    # management address are kept here; the port-to-device mapping changes
    # with the patching and must not be maintained by hand.
    snmp_interfaces: true
    snmp_cables: true
    interfaces:
      - name: Port 25
        type: 1000base-x-sfp
      - name: Port 26
        type: 1000base-x-sfp
      - name: Port 27
        type: 1000base-x-sfp
      - name: Port 28
        type: 1000base-x-sfp
        ip_addresses:
          - address: 192.168.4.2/24
            dns_name: zyxel-gs1920-24
            primary: true
