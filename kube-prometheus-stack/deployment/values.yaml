# kube-prometheus-stack configuration
# Provides Prometheus, Grafana, Alertmanager, and exporters

# Prometheus configuration
prometheus:
  prometheusSpec:
    replicas: 1
    # Scrape configuration
    scrapeInterval: 15s

    # Storage configuration
    retention: 30d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: monitoring
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

    # Resource limits
    resources:
      requests:
        cpu: 500m
        memory: 500Mi
      limits:
        cpu: 2000m
        memory: 2Gi

    # Service monitors selector - match all
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

    # Enable monitoring of all namespaces
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}

# Grafana configuration
grafana:
  enabled: true
  replicas: 1

  # Use secret for admin password
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  # Persistence for dashboards
  persistence:
    enabled: true
    storageClassName: monitoring
    size: 2Gi
    existingClaim: monitoring-grafana

  # Grafana resources
  resources:
    requests:
      cpu: 2
      memory: 1Gi
    limits:
      cpu: 4
      memory: 2Gi

  # Ingress configuration
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.glem.blatrix.eu

  # Additional data sources
  additionalDataSources: []

# Alertmanager configuration
alertmanager:
  enabled: true
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: monitoring
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 3Gi

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

# Node exporter - collects hardware and OS metrics
nodeExporter:
  enabled: true

# Kube-state-metrics - collects Kubernetes object state
kubeStateMetrics:
  enabled: true

# Prometheus operator
prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Default rules - pre-configured alerts
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: true
    configReloaders: true
    general: true
    k8s: true
    kubeApiserverAvailability: true
    kubeApiserverSlos: true
    kubelet: true
    kubeProxy: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeSchedulerAlerting: true
    kubeSchedulerRecording: true
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true

# Additional scrape configs (example for custom services)
# prometheus:
#   prometheusSpec:
