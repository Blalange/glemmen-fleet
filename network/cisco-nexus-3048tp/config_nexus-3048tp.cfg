! Cisco Nexus 3048TP-1GE (N3K-C3048TP-1GE)
! Glemmen server/access switch.
!
! This is the intended running configuration. It is maintained in Git and
! applied over the console or mgmt0. Set the local admin password separately;
! no passwords or other secrets belong in this file.
!
! Port layout:
!   Ethernet1/1-20   iDRAC/IMM access ports, VLAN 4 (Server tilbehor)
!   Ethernet1/21-26  glemmen130, 6 x 1G LACP (port-channel10)
!   Ethernet1/27-32  glemmen150, 6 x 1G LACP (port-channel11)
!   Ethernet1/33-38  glemmen160, 6 x 1G LACP (port-channel12)
!   Ethernet1/39-40  glemmen170, 2 x 1G LACP (port-channel13)
!   Ethernet1/41-42  glemmen180, 2 x 1G LACP (port-channel14)
!   Ethernet1/43     glemmen250, 1G server trunk
!   Ethernet1/44     glemmen50, 1G server trunk
!   Ethernet1/45     glemmen60, 1G server trunk
!   Ethernet1/46-48  spare server trunks
!   Ethernet1/49     SFP1, glemmen80 10G server trunk
!   Ethernet1/50     SFP2, future glemmen70 10G server trunk (shutdown)
!   Ethernet1/51     SFP3, uplink to UDM Pro port 10
!   Ethernet1/52     SFP4, uplink to USW Pro 24 PoE port 26 (shutdown until cutover)
!
! Server ports are trunks with the server VLAN (3) untagged/native and the
! legacy Default/PXE VLAN (1) plus the ECMP VLAN (7) tagged. The UDM Pro is
! the only DHCP server and gateway for all VLANs.

hostname cisco-nexus-3048tp
boot nxos bootflash:nxos.7.0.3.I7.4.bin

feature lacp
feature lldp
! SSH is enabled by default; Telnet is not used.
no feature telnet

! VLANs. VLAN 1 is only used as the native link to the UDM Pro and as the
! tagged PXE/Default network on the server ports.
vlan 1
  name Default
vlan 3
  name Servere
vlan 4
  name Server-tilbehor
vlan 7
  name Servere-ECMP

! The Nexus 3048TP has no per-port L2 MTU. Jumbo frames are enabled globally
! through the network-qos policy; the server and ECMP VLANs use MTU 9000.
policy-map type network-qos jumbo
  class type network-qos class-default
    mtu 9216
system qos
  service-policy type network-qos jumbo

! Layer 3 + Layer 4 hashing. On the Nexus 3000 the keyword source-dest-port
! includes source/destination MAC, IP and TCP/UDP port.
port-channel load-balance ethernet source-dest-port

! Host-facing ports are edge ports. BPDU guard protects them from accidental
! switch loops; the two uplinks to the UDM Pro and USW are normal ports.
spanning-tree port type edge bpduguard default

! Out-of-band management. mgmt0 is patched to a VLAN 4 access port on the
! UDM Pro (preferably UDM port 8 after the Zyxel is removed) or to a USW
! VLAN 4 access port once the SFP4 uplink is active.
vrf context management
  ip route 0.0.0.0/0 192.168.4.1
  ip name-server 1.1.1.1
interface mgmt0
  description OOB management - VLAN 4 access
  vrf member management
  ip address 192.168.4.2/24
  no shutdown

! SNMP read-only for the inventory collector.
snmp-server community public ro
snmp-server location Glemmen-rack
snmp-server contact Simon-Braten

