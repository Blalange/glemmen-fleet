! ---------------------------------------------------------------------------
! glemmen130 - 6 x 1G LACP. Native VLAN 3, tagged VLAN 1 (PXE) and 7 (ECMP).
! no lacp suspend-individual is the Nexus 3000 LACP fallback behaviour: a
! member link keeps forwarding as an individual port while the server firmware
! is in PXE and does not send LACPDUs yet. The member ports carry the same
! trunk configuration so untagged VLAN 3 works in that state.
! ---------------------------------------------------------------------------
interface port-channel10
  description glemmen130 - 6x1G LACP
  switchport
  switchport mode trunk
  switchport trunk native vlan 3
  switchport trunk allowed vlan 1,3,7
  spanning-tree port type edge trunk
  no lacp suspend-individual
  no lacp graceful-convergence
  no shutdown
interface Ethernet1/21
  description glemmen130 - NIC 1
  switchport
  switchport mode trunk
  switchport trunk native vlan 3
  switchport trunk allowed vlan 1,3,7
  spanning-tree port type edge trunk
  channel-group 10 mode active
  no shutdown
interface Ethernet1/22
  description glemmen130 - NIC 2
  switchport
  switchport mode trunk
  switchport trunk native vlan 3
  switchport trunk allowed vlan 1,3,7
  spanning-tree port type edge trunk
